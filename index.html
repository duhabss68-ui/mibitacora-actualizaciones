/* v0.18 — Pantalla para elegir la edición (solo en el instalador de Windows).

:root{--ink:#1F2A44;--muted:#5A6478}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:#FBF7F1}
body{display:flex;align-items:center;justify-content:center;padding:32px 16px}
main{width:100%;max-width:1040px;text-align:center}
.logo svg{width:150px;height:150px;display:block;margin:0 auto 8px}
h1{font-size:30px;margin:6px 0 6px}
p.lead{font-size:18px;color:var(--muted);margin:0 0 28px}
.ops{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.op{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 20px 24px;border-radius:24px;background:#fff;border:3px solid transparent;box-shadow:0 8px 26px #1F2A4418;transition:transform .12s,box-shadow .12s;position:relative;overflow:hidden}
.op::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:var(--c)}
.op:hover{transform:translateY(-3px);box-shadow:0 14px 32px #1F2A4426}
.op:focus-visible{outline:4px solid var(--c);outline-offset:3px}
.op.actual{border-color:var(--c)}
.op .em{font-size:56px;line-height:1;margin-top:6px}
.op b{font-size:24px;color:var(--d)}
.op span{font-size:15px;color:var(--muted);line-height:1.4}
.op .go{margin-top:8px;padding:12px 22px;border-radius:14px;background:var(--btn);color:#fff;font-weight:700;font-size:16px}
.op .tag.lock{left:14px;right:auto;color:#8A3B12;border-color:#E0A44E;background:#FFF6EA}
.op .tag{position:absolute;top:18px;right:14px;font-size:12px;font-weight:700;color:var(--d);background:#fff;border:1px solid var(--c);border-radius:999px;padding:2px 10px}
.prim{--c:#FA704C;--d:#B23E22;--btn:#C54532}
.sec{--c:#2F5FA7;--d:#1E3F78;--btn:#2F5FA7}
.tele{--c:#D9622B;--d:#1F2A44;--btn:#C2531F}
.tele::before{background:linear-gradient(90deg,#1F2A44 0 60%,#D9622B 60%)}
.nota{margin:28px auto 0;max-width:720px;font-size:15px;color:var(--muted);background:#fff;border-radius:16px;padding:14px 18px;border:1px solid #EEE3D3}
.cargando{font-size:18px;color:var(--muted)}
@media(max-width:820px){.ops{grid-template-columns:1fr}.op{padding:22px 16px}}
</style></head>
