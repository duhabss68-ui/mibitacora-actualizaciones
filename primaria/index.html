function resetRoulette(){rouletteToken++;rouletteRevealing=false;rouletteRemaining[selectedGroup]=[];rouletteWinner=null;rouletteAngle=0;render()}
function modifyExtra(delta){if(rouletteRevealing)return;if(!rouletteWinner)return warn('Primero gira la ruleta.');const id=selectedGroup+'|'+rouletteWinner;state.extra[id]=(state.extra[id]||0)+delta;save();render()}
function downloadExtras(){const g=group();if(!g)return;csvDownload('puntos_'+safeName(g.name)+'.csv',[['Alumno','Puntos extra'],...roster(g).map(s=>[s.name,state.extra[selectedGroup+'|'+s.id]||0])])}
function drawWheel(students){
  const cv=document.getElementById('wheel');if(!cv)return;
  const ctx=cv.getContext('2d'),w=cv.width,c=w/2,r=c-14;ctx.clearRect(0,0,w,w);const n=students.length;
  if(!n){ctx.fillStyle='#ecf3f5';ctx.beginPath();ctx.arc(c,c,r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#31576b';ctx.textAlign='center';ctx.font='bold 22px sans-serif';ctx.fillText('Ronda finalizada',c,c);return}
  const colors=ROULETTE_COLORS;
  for(let i=0;i<n;i++){
    const a=rouletteAngle+(i/n)*Math.PI*2-Math.PI/2,step=Math.PI*2/n,col=colors[i%colors.length];
    ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,r,a,a+step);ctx.closePath();ctx.fillStyle=col;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    /* Los nombres están ocultos: cada gajo lleva un signo de interrogación (derecho, no girado) */
    const mx=c+Math.cos(a+step/2)*r*.72,my=c+Math.sin(a+step/2)*r*.72,fs=Math.max(12,Math.min(36,Math.round(Math.PI*2*r*.72/n*.75)));
    ctx.save();ctx.fillStyle=textOn(col);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold '+fs+'px sans-serif';ctx.fillText('?',mx,my);ctx.restore();
  }
  ctx.beginPath();ctx.arc(c,c,23,0,Math.PI*2);ctx.fillStyle='white';ctx.fill();ctx.fillStyle='#173348';ctx.font='bold 19px sans-serif';ctx.textAlign='center';ctx.fillText('★',c,c+7);
  ctx.fillStyle='#1a3549';ctx.beginPath();ctx.moveTo(c-12,5);ctx.lineTo(c+12,5);ctx.lineTo(c,29);ctx.fill();
}
function spinWheel(){
  if(rouletteBusy)return;const pool=roster(group()),used=rouletteRemaining[selectedGroup]||[],students=pool.filter(s=>!used.includes(s.id));
  if(!students.length)return warn('Todos participaron. Reinicia los sorteos.');
  rouletteBusy=true;rouletteWinner=null;rouletteRevealing=false;rouletteToken++;
  const n=students.length,winnerIndex=Math.floor(Math.random()*n),step=2*Math.PI/n,start=rouletteAngle;
  const final=((2*Math.PI-step*(winnerIndex+.5))%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
  const delta=((final-start)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)+Math.PI*2*5,frames=100;let frame=0;
  document.querySelector('.spin-button').disabled=true;
  function animate(){
    const t=++frame/frames,e=1-Math.pow(1-t,4);rouletteAngle=(start+delta*e)%(2*Math.PI);drawWheel(students);
    if(frame<frames){requestAnimationFrame(animate)}

}

function gridKey(e){
  const t=e.target,isMark=t.classList.contains('gmark');
  if(isMark){
    const a=state.activities.find(x=>x.id===t.dataset.a),list=a&&modeOf(a)==='icon'?ICON_MARKS:LEVEL_MARKS;
    if(/^[1-9]$/.test(e.key)&&list[Number(e.key)-1]){e.preventDefault();setMark(t,list[Number(e.key)-1].c);return}
    if(['Delete','Backspace','0'].includes(e.key)){e.preventDefault();setMark(t,'');return}
  }
  if(!['Enter','ArrowDown','ArrowUp'].includes(e.key))return;
  const table=t.closest('table');if(!table)return;
  const col=[...table.querySelectorAll(`.gcell[data-a="${t.dataset.a}"]`)],i=col.indexOf(t);
  e.preventDefault();if(e.key==='Enter'&&t.tagName==='INPUT')t.dispatchEvent(new Event('change'));
  const up=e.key==='ArrowUp'||(e.key==='Enter'&&e.shiftKey),n=col[up?i-1:i+1];if(n){n.focus();if(n.select)n.select()}
}

  roster(g).forEach(s=>{

    if(mode==='max'){if(md==='num')todo.push([state.grades,k,a.max]);else if(md==='icon')todo.push([state.marks,k,'OK']);else if(md==='level')todo.push([state.marks,k,'NE'])}

function toggleRubView(id){rubView=rubView===id?'':id;render()}
function uniqueRubricName(name,exceptId){
  const taken=new Set(state.rubrics.filter(r=>r.id!==exceptId).map(r=>normName(r.name)));let n=name.slice(0,100),k=2;
  while(taken.has(normName(n))){const t=' ('+k++ +')';n=name.slice(0,100-t.length)+t}return n;
}
function newRubric(kind){
  const d=kind==='cotejo'?{id:gid(),name:'',kind,levels:copy(COTEJO_LEVELS),criteria:[{id:gid(),n:'',w:1,d:['',''],pda:''}]}
    :{id:gid(),name:'',kind,levels:copy(RUB_LEVELS),criteria:[{id:gid(),n:'',w:25,d:['','','',''],pda:''}]};
  rubEdit={ctx:'lib',id:d.id,draft:d,locked:false,isNew:true};rubView='';render();window.scrollTo(0,0);
  setTimeout(()=>document.getElementById('rdName')?.focus(),0);
}
function editRubric(id){const r=state.rubrics.find(x=>x.id===id);if(!r)return;rubEdit={ctx:'lib',id,draft:copy(r),locked:false};render();window.scrollTo(0,0)}
function copyRubric(id){
  const src=rubricById(id);if(!src)return;
  const r=normalizeRubric({...copy(src),id:gid()});r.criteria.forEach(c=>{c.id=gid();c.pda=''});r.name=uniqueRubricName((src.bank?src.name:'Copia de '+src.name));
  state.rubrics.push(r);save();rubEdit={ctx:'lib',id:r.id,draft:copy(r),locked:false};rubView='';render();window.scrollTo(0,0);
  notify(`Se creó «${r.name}» en «Mis rúbricas». Cámbiale lo que quieras y toca «Guardar».`,'success');
}
function deleteRubric(id){
  const r=state.rubrics.find(x=>x.id===id);if(!r)return;
  withUndo(`Rúbrica «${r.name}» quitada de tu biblioteca. Las actividades que ya la usan no cambian.`,()=>{state.rubrics=state.rubrics.filter(x=>x.id!==id);if(rubEdit?.id===id)rubEdit=null});
}

/* ---------- Editor (biblioteca o rúbrica de una actividad) ---------- */
function rubricEditorHTML(){
  const e=rubEdit,d=e.draft,cot=d.kind==='cotejo',lk=e.locked,tw=d.criteria.reduce((a,c)=>a+(Number(c.w)>0?Number(c.w):0),0)||1;
  const act=e.ctx==='act'?state.activities.find(a=>a.id===e.id):null,pd=act?pdaList(group(),act.scopeId):[];
  const lv=cot?'':`<div class="rd-levels"><b>Niveles</b> <span class="helper">(del mejor al más bajo; los puntos dicen cuánto vale cada nivel)</span><div class="flex">${d.levels.map((l,i)=>`<div class="rd-level"><input class="field" value="${esc(l.n)}" maxlength="40" aria-label="Nombre del nivel ${i+1}" oninput="rdLevel(${i},'n',this.value)"><label class="helper">Puntos <input class="field pts" type="number" min="0" max="100" step="0.5" value="${l.p}" aria-label="Puntos del nivel ${i+1}" oninput="rdLevel(${i},'p',this.value)"></label></div>`).join('')}
    <button class="mini" onclick="rdAddLevel()" ${lk||d.levels.length>=6?'disabled':''}>+ Nivel</button><button class="mini" onclick="rdDelLevel()" ${lk||d.levels.length<=2?'disabled':''}>− Nivel</button></div></div>`;
  return `<div class="rub-editor"><h3>${act?'Rúbrica de la actividad «'+esc(act.name)+'»':e.isNew?(cot?'Nueva lista de cotejo':'Nueva rúbrica'):'Editar «'+esc(d.name)+'»'}</h3>
  ${lk?`<div class="hint">Esta actividad ya tiene alumnos evaluados: puedes cambiar textos, pesos, puntos y PDA (las notas se recalculan solas), pero no agregar ni quitar criterios o niveles.</div>`:''}
  <label class="helper" for="rdName">Nombre</label><input id="rdName" class="field wide" maxlength="100" value="${esc(d.name)}" placeholder="${cot?'Ej. Revisión de cuaderno':'Ej. Exposición del proyecto'}" oninput="rdSet(this.value)">
  ${lv}
  <div class="table-wrap"><table class="rubtable rd-table"><thead><tr><th>Criterio</th><th>Peso</th>${cot?'':d.levels.map(l=>`<th>${esc(l.n||'Nivel')}</th>`).join('')}${pd.length?'<th>PDA</th>':''}<th></th></tr></thead><tbody>
  ${d.criteria.map((c,i)=>`<tr><td><textarea class="field" rows="2" maxlength="200" aria-label="Criterio ${i+1}" placeholder="Qué vas a observar" oninput="rdCrit(${i},'n',this.value)">${esc(c.n)}</textarea></td>
  <td class="rd-w"><input class="field pts" type="number" min="0.1" max="100" step="1" value="${c.w}" aria-label="Peso del criterio ${i+1}" oninput="rdCrit(${i},'w',this.value)"><small id="rdPct${i}">${numfmt(Math.round((Number(c.w)||0)/tw*1000)/10)} %</small></td>
  ${cot?'':d.levels.map((l,j)=>`<td><textarea class="field" rows="3" maxlength="400" aria-label="Descripción del criterio ${i+1}, nivel ${esc(l.n)}" placeholder="Cómo se ve este nivel" oninput="rdDesc(${i},${j},this.value)">${esc(c.d[j]||'')}</textarea></td>`).join('')}
  ${pd.length?`<td><select class="field" aria-label="PDA del criterio ${i+1}" onchange="rdCrit(${i},'pda',this.value)"><option value="">—</option>${pd.map(x=>`<option value="${esc(x.id)}" ${c.pda===x.id?'selected':''}>${esc(x.t.length>60?x.t.slice(0,58)+'…':x.t)}</option>`).join('')}</select></td>`:''}
  <td><button class="mini" onclick="rdDelCrit(${i})" ${lk||d.criteria.length<=1?'disabled':''} aria-label="Quitar criterio ${i+1}">✕</button></td></tr>`).join('')}</tbody></table></div>
  <div class="flex"><button class="secondary" onclick="rdAddCrit()" ${lk||d.criteria.length>=30?'disabled':''}>+ Agregar criterio</button><span class="helper">El peso es relativo: el programa lo convierte a porcentaje.</span></div>
  <div class="actions"><button class="primary" onclick="saveRubricDraft()">Guardar</button><button class="secondary" onclick="cancelRubricEdit()">Cancelar</button>${act?`<button class="secondary" onclick="saveActRubricToLibrary()">Guardar también en «Mis rúbricas»</button>`:''}</div></div>`;
}
function rdSet(v){rubEdit.draft.name=v}
function rdLevel(i,k,v){const l=rubEdit.draft.levels[i];if(!l)return;l[k]=k==='p'?Number(v):v}
function rdCrit(i,k,v){
  const c=rubEdit.draft.criteria[i];if(!c)return;c[k]=k==='w'?Number(v):v;
  if(k==='w'){const tw=rubEdit.draft.criteria.reduce((a,x)=>a+(Number(x.w)>0?Number(x.w):0),0)||1;rubEdit.draft.criteria.forEach((x,j)=>{const el=document.getElementById('rdPct'+j);if(el)el.textContent=numfmt(Math.round((Number(x.w)||0)/tw*1000)/10)+' %'})}
}
function rdDesc(i,j,v){const c=rubEdit.draft.criteria[i];if(c)c.d[j]=v}
function rdAddCrit(){const d=rubEdit.draft;if(rubEdit.locked||d.criteria.length>=30)return;d.criteria.push({id:gid(),n:'',w:d.kind==='cotejo'?1:Math.max(1,Math.round(100/(d.criteria.length+1))),d:d.levels.map(()=>''),pda:''});render()}
function rdDelCrit(i){const d=rubEdit.draft;if(rubEdit.locked||d.criteria.length<=1)return;d.criteria.splice(i,1);render()}
function rdAddLevel(){const d=rubEdit.draft;if(rubEdit.locked||d.kind==='cotejo'||d.levels.length>=6)return;const low=d.levels[d.levels.length-1];d.levels.push({n:'Nivel '+(d.levels.length+1),p:Math.max(0,(low?.p||1)-1)});d.criteria.forEach(c=>c.d.push(''));render()}
function rdDelLevel(){const d=rubEdit.draft;if(rubEdit.locked||d.kind==='cotejo'||d.levels.length<=2)return;d.levels.pop();d.criteria.forEach(c=>c.d.pop());render()}
function cancelRubricEdit(){const ctx=rubEdit?.ctx;rubEdit=null;if(ctx==='act')switchTo('cuadricula');else render()}
function draftProblems(d){
  if(!String(d.name||'').trim())return 'Escribe el nombre de la rúbrica.';
  if(d.criteria.some(c=>!String(c.n||'').trim()))return 'Cada criterio necesita un texto (o quítalo con ✕).';
  if(d.criteria.some(c=>!(Number(c.w)>0)||Number(c.w)>100))return 'Cada criterio debe valer entre 0.1 y 100.';
  if(d.kind!=='cotejo'){
    if(d.levels.some(l=>!String(l.n||'').trim()))return 'Cada nivel necesita un nombre.';
    if(d.levels.some(l=>!Number.isFinite(Number(l.p))||l.p<0||l.p>100))return 'Los puntos de cada nivel deben estar entre 0 y 100.';
    if(!(Math.max(...d.levels.map(l=>Number(l.p)))>0))return 'Al menos un nivel debe valer más de cero.';
  }
  return '';
}
function saveRubricDraft(){
  const e=rubEdit;if(!e)return;const msg=draftProblems(e.draft);if(msg)return warn(msg);
  let r;try{r=normalizeRubric({...copy(e.draft),levels:e.draft.levels.map(l=>({n:l.n,p:Number(l.p)}))})}catch(err){return warn(err.message)}
  if(e.ctx==='lib'){
    r.criteria.forEach(c=>{c.pda=''});r.name=uniqueRubricName(r.name,r.id);
    const i=state.rubrics.findIndex(x=>x.id===r.id);if(i>=0)state.rubrics[i]=r;else state.rubrics.push(r);
    rubEdit=null;rubView=r.id;save();render();notify(`«${r.name}» guardada en «Mis rúbricas».`,'success');
  }else{
    const a=state.activities.find(x=>x.id===e.id);if(!a)return;
    const valid=new Set(pdaList(group(),a.scopeId).map(x=>x.id));r.criteria.forEach(c=>{if(!valid.has(c.pda))c.pda=''});
    a.rubric=r;
    /* quita marcas de criterios o niveles que ya no existen (sólo posible si no estaba bloqueada) */
    for(const [k,rec] of Object.entries(state.rscores))if(k.startsWith(a.id+'|')){for(const cid of Object.keys(rec))if(!r.criteria.some(c=>c.id===cid)||rec[cid]>=r.levels.length)delete rec[cid];if(!Object.keys(rec).length)delete state.rscores[k]}
    rubEdit=null;save();switchTo('cuadricula');notify(`Rúbrica de «${a.name}» guardada. Las notas se recalcularon.`,'success');
  }
}
function editActivityRubric(aid){
  const a=state.activities.find(x=>x.id===aid);if(!a||modeOf(a)!=='rubric')return;
  rubEdit={ctx:'act',id:aid,draft:copy(a.rubric),locked:Object.keys(state.rscores).some(k=>k.startsWith(aid+'|'))};
  evalState={aid,sid:''};switchTo('evaluar');
}
function saveActRubricToLibrary(){
  const msg=draftProblems(rubEdit.draft);if(msg)return warn(msg);
  try{const r=normalizeRubric({...copy(rubEdit.draft),id:gid()});r.criteria.forEach(c=>{c.id=gid();c.pda=''});r.name=uniqueRubricName(r.name);state.rubrics.push(r);save();notify(`Copia guardada en «Mis rúbricas» como «${r.name}».`,'success')}
  catch(err){warn(err.message)}
}

/* ---------- Evaluar con un clic ---------- */
function openRubricEval(aid,sid){
  const a=state.activities.find(x=>x.id===aid);if(!a||modeOf(a)!=='rubric')return;
  const ros=roster(group());
  if(!sid)sid=(ros.find(s=>rubricResult(a,s.id).frac===null)||ros[0])?.id||'';
  evalState={aid,sid};rubEdit=null;gradeActivityId=aid;switchTo('evaluar');
}
VIEWS.evaluar=function(c,g){
  const a=state.activities.find(x=>x.id===evalState.aid&&!x.archived);
  if(!g||!a||a.groupId!==g.id||modeOf(a)!=='rubric'){rubEdit=null;active='cuadricula';return VIEWS.cuadricula(c,g)}
  if(rubEdit&&rubEdit.ctx==='act'&&rubEdit.id===a.id){
    title('CALIFICACIONES','Rúbrica de la actividad',a.name);
    c.innerHTML=`<div class="flex back-row"><button class="secondary" onclick="cancelRubricEdit()">← Volver a la cuadrícula</button></div><section class="panel">${rubricEditorHTML()}</section>`;return;
  }
  const ros=roster(g),r=a.rubric,cot=r.kind==='cotejo';
  if(!ros.length){c.innerHTML=emptyPanel('Este grupo todavía no tiene alumnos.');return}
  if(evalState.team){const h=teamEvalHTML(a,g);if(h){c.innerHTML=h;return}}
  let i=ros.findIndex(s=>s.id===evalState.sid);if(i<0){i=0;evalState.sid=ros[0].id}
  const st=ros[i],rec=state.rscores[a.id+'|'+st.id]||{},res=rubricResult(a,st.id);
  const doneN=ros.filter(s=>rubricResult(a,s.id).frac!==null).length,nota=res.frac===null?null:res.frac*a.max;
  title('CALIFICACIONES','Evaluar con '+(cot?'lista de cotejo':'rúbrica'),a.name+' · '+g.name);
  c.innerHTML=`<div class="flex back-row"><button class="secondary" onclick="switchTo('cuadricula')">← Volver a la cuadrícula</button><span class="chip">${esc(r.name)}</span><span class="chip ok">${doneN} de ${ros.length} evaluados</span><button class="mini" onclick="editActivityRubric('${a.id}')">Ver o cambiar la rúbrica</button><button class="mini" onclick="printRubric('','${a.id}')">Imprimir la rúbrica</button><button class="mini" onclick="openTeamGrade('${a.id}')">Evaluar por equipos</button></div>
  <div class="eval-layout"><nav class="eval-list" aria-label="Alumnos">${ros.map((s,j)=>{const rr=rubricResult(a,s.id);return `<button class="eval-st ${s.id===st.id?'on':''}" onclick="evalGo('${s.id}')" ${s.id===st.id?'aria-current="true"':''}><span>${j+1}. ${esc(s.name)}</span><span class="es ${rr.frac!==null?gradeClass(rr.frac*10,10):rr.done?'partial':''}">${rr.frac!==null?numfmt(round2(rr.frac*a.max)):rr.done?rr.done+'/'+rr.total:'—'}</span></button>`}).join('')}</nav>
  <section class="panel eval-main"><div class="eval-head"><div><div class="eyebrow">Alumno ${i+1} de ${ros.length}</div><h2 id="evalName">${esc(st.name)}</h2></div>
  ${evalScoreHTML(a,res,nota)}</div>
  <p class="helper">Toca el nivel de cada criterio. Si te equivocas, toca otro nivel; tocar el mismo lo quita. La nota sale sola cuando marcas todos.</p>
  ${evalTableHTML(r,rec,cot)}
  <div class="actions eval-nav"><button class="secondary" onclick="evalStep(-1)" ${i===0?'disabled':''}>← Anterior</button><button class="secondary" onclick="rubAllTop()">Todo en «${esc(r.levels[0].n)}»</button><button class="secondary" onclick="rubClear()" ${res.done?'':'disabled'}>Borrar lo de este alumno</button><span class="spacer"></span><button class="${nota!==null?'primary':'secondary'} big" id="evalNext" onclick="evalStep(1)" ${i===ros.length-1?'disabled':''}>Siguiente alumno →</button></div>
  ${i===ros.length-1&&doneN===ros.length?doneCard('Evaluaste a todo el grupo con esta rúbrica.','Las notas ya están en la cuadrícula.'):''}</section></div>`;
};
function evalScoreHTML(a,res,nota){return `<div class="eval-score ${nota!==null?gradeClass(nota,a.max):''}" role="status" aria-live="polite">${nota!==null?`<small>Nota</small><b>${numfmt(round2(nota))}</b><small>de ${a.max}</small>`:`<small>Faltan</small><b>${res.total-res.done}</b><small>${res.total-res.done===1?'criterio':'criterios'}</small>`}</div>`}
function evalTableHTML(r,rec,cot){
  const tw=r.criteria.reduce((x,cc)=>x+cc.w,0)||1;
  return `<div class="table-wrap"><table class="rubtable eval-table ${cot?'cotejo':''}"><thead><tr><th>Criterio</th>${r.levels.map(l=>`<th>${esc(l.n)}${cot?'':`<small>${numfmt(l.p)} pts</small>`}</th>`).join('')}</tr></thead><tbody>
  ${r.criteria.map(cr=>`<tr><th scope="row">${esc(cr.n)}<small>Vale ${numfmt(Math.round(cr.w/tw*1000)/10)} %</small></th>${r.levels.map((l,j)=>{const on=rec[cr.id]===j;return `<td><button class="rcell ${on?'on':''} ${cot?(j===0?'yes':'no'):''}" data-c="${esc(cr.id)}" data-l="${j}" aria-pressed="${on}" aria-label="${esc(cr.n)}: ${esc(l.n)}" onclick="rubPick('${esc(cr.id)}',${j})">${cot?esc(l.n):`<b>${esc(l.n)}</b><span>${esc(cr.d[j]||'')}</span>`}</button></td>`}).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function evalGo(sid){evalState.sid=sid;render();document.getElementById('evalName')?.scrollIntoView({block:'nearest'})}
function evalStep(d){const ros=roster(group()),i=ros.findIndex(s=>s.id===evalState.sid),n=ros[i+d];if(n){evalGo(n.id);document.querySelector('.rcell')?.focus()}}
function rubPick(cid,li){
  const a=state.activities.find(x=>x.id===evalState.aid);if(!a)return;const targets=evalTargets(),ref=state.rscores[a.id+'|'+targets[0]]||{};
  if(!a.rubric.criteria.some(c=>c.id===cid)||!a.rubric.levels[li])return;
  const off=ref[cid]===li;   /* tocar el nivel que ya estaba lo quita (a todos los del equipo en modo equipo) */
  for(const sid of targets){const k=a.id+'|'+sid,rec=state.rscores[k]||{};if(off)delete rec[cid];else rec[cid]=li;if(Object.keys(rec).length)state.rscores[k]=rec;else delete state.rscores[k]}
  const rec=state.rscores[a.id+'|'+targets[0]]||{};
  save();render();
  const b=document.querySelector(`.rcell[data-c="${cid}"][data-l="${li}"]`);if(b)b.focus();
  if(rubricResult(a,targets[0]).frac!==null&&Object.keys(rec).length===a.rubric.criteria.length&&rec[cid]===li){const n=document.getElementById('evalNext');if(n&&!n.disabled&&a.rubric.criteria[a.rubric.criteria.length-1].id===cid)n.focus()}
}
function rubAllTop(){
  const a=state.activities.find(x=>x.id===evalState.aid);if(!a)return;const ctx=teamCtx(),targets=evalTargets(),who=ctx?'del equipo «'+ctx.cur.name+'»':'de '+(roster(group()).find(s=>s.id===evalState.sid)?.name||'');
  withUndo(`Todos los criterios ${who} en «${a.rubric.levels[0].n}». Ajusta los que no apliquen.`,()=>{for(const sid of targets)state.rscores[a.id+'|'+sid]=Object.fromEntries(a.rubric.criteria.map(c=>[c.id,0]))});
}
function rubClear(){
  const a=state.activities.find(x=>x.id===evalState.aid);if(!a)return;const ctx=teamCtx(),targets=evalTargets(),who=ctx?'del equipo «'+ctx.cur.name+'»':'de '+(roster(group()).find(s=>s.id===evalState.sid)?.name||'');
  withUndo(`Se borró la evaluación ${who} en «${a.name}».`,()=>{for(const sid of targets)delete state.rscores[a.id+'|'+sid]});
}

/* ---------- Compartir por archivo (sin datos de alumnos) ---------- */
function exportRubrics(ids){
  const list=(ids?state.rubrics.filter(r=>ids.includes(r.id)):state.rubrics).map(r=>({...copy(r),criteria:r.criteria.map(c=>({...c,pda:''}))}));
  if(!list.length)return warn('Primero crea o copia una rúbrica en «Mis rúbricas».');
  const pack={format:'mibitacora-rubricas',formatVersion:1,app:APP_NAME,edition:EDITION,appVersion:APP_VERSION,exportedAt:new Date().toISOString(),count:list.length,author:state.profile.teacher||'',
    checksum:{algorithm:'SHA-256',value:sha256Hex(JSON.stringify(list))},rubrics:list};
  const name=list.length===1?'Rubrica_'+safeName(list[0].name):'Rubricas_MiBitacora_'+todayISO();
  download(name+'.json',new Blob([JSON.stringify(pack,null,2)],{type:'application/json'}));
  notify(list.length===1?`Archivo de «${list[0].name}» guardado en Descargas.`:`${list.length} rúbricas guardadas en un archivo en Descargas.`,'success');
}
function rubDrop(e){e.preventDefault();e.stopPropagation();e.currentTarget.classList.remove('over');const f=e.dataTransfer?.files?.[0];if(f)importRubricsFile(f)}
let rubImport=[];
async function importRubricsFile(file){
  if(!file)return;
  try{
    if(file.size>3*1024*1024)throw new Error('El archivo es demasiado grande para ser un archivo de rúbricas.');
    let d;try{d=JSON.parse(await file.text())}catch(e){throw new Error('El archivo no es un archivo de rúbricas de '+APP_NAME+'.')}
    if(!d||!['mibitacora-rubricas','aulagestion-rubricas'].includes(d.format)||!Array.isArray(d.rubrics))throw new Error(d&&['mibitacora-backup','aulagestion-backup'].includes(d.format)?'Ese archivo es una copia de seguridad, no un archivo de rúbricas. Las copias se recuperan en «Más › Copias de seguridad».':'El archivo no es un archivo de rúbricas de '+APP_NAME+'.');
    if(!d.checksum||d.checksum.algorithm!=='SHA-256'||sha256Hex(JSON.stringify(d.rubrics))!==d.checksum.value)throw new Error('El archivo está dañado o fue modificado: falló la verificación. No se agregó nada.');
    const ok=[];let bad=0;
    for(const r of d.rubrics.slice(0,300)){try{const n=normalizeRubric({...r,id:gid()});n.criteria.forEach(c=>{c.id=gid();c.pda=''});ok.push(n)}catch(e){bad++}}
    if(!ok.length)throw new Error('No se encontró ninguna rúbrica válida en el archivo.');
    rubImport=ok.map(r=>({r,on:true}));
    openModal(`<h2>Traer rúbricas</h2><p>Encontré <b>${ok.length}</b> ${ok.length===1?'rúbrica':'rúbricas'}${d.author?` de <b>${esc(String(d.author).slice(0,80))}</b>`:''}.${bad?` ${bad} no se pudieron leer y se omitirán.`:''}</p>
      <div class="imp-list">${rubImport.map((x,i)=>`<label class="imp-row"><input type="checkbox" checked onchange="rubImport[${i}].on=this.checked;document.getElementById('rubImpOk').textContent='Agregar '+rubImport.filter(y=>y.on).length"><span><b>${esc(x.r.name)}</b> <span class="helper">${x.r.kind==='cotejo'?'Lista de cotejo':'Rúbrica'} · ${x.r.criteria.length} criterios</span></span></label>`).join('')}</div>
      <div class="actions"><button class="primary" id="rubImpOk" data-autofocus onclick="confirmRubricImport()">Agregar ${ok.length}</button><button class="secondary" onclick="closeModal()">Cancelar</button></div>`,{label:'Traer rúbricas'});
  }catch(e){warn('No se pudieron traer las rúbricas: '+e.message)}
}
function confirmRubricImport(){
  const add=rubImport.filter(x=>x.on).map(x=>x.r);if(!add.length)return warn('Marca al menos una rúbrica.');
  add.forEach(r=>{r.name=uniqueRubricName(r.name);state.rubrics.push(r)});rubImport=[];save();closeModal();if(active!=='rubricas')switchTo('rubricas');else render();
  notify(`${add.length} ${add.length===1?'rúbrica agregada':'rúbricas agregadas'} a «Mis rúbricas».`,'success');
}

/* ---------- Imprimir (rúbrica para los alumnos, ficha del alumno) ---------- */
function printHTML(html){
  document.getElementById('printArea')?.remove();
  const d=document.createElement('div');d.id='printArea';d.innerHTML=html;document.body.appendChild(d);document.body.classList.add('printing');
  const done=()=>{document.body.classList.remove('printing');d.remove();window.removeEventListener('afterprint',done)};

  <p class="helper">Cada barra es el promedio (0 a 10) de las evidencias ligadas a ese PDA. Es un apoyo para tu observación, no una calificación oficial.</p></section>`:''}`:''}`;

function firstWord(n){return String(n).split(/\s+/)[0]}
function addPdas(){
  const g=group(),sc=scopeId(g);if(!g||!sc)return;
  const lines=(document.getElementById('pdaPaste')?.value||'').split(/\r?\n/).map(x=>x.replace(/^\s*(\d+[.)-]|[-•*·])\s*/,'').replace(/\s+/g,' ').trim()).filter(Boolean);
  if(!lines.length)return warn('Escribe o pega al menos un PDA.');
  const k=g.id+'|'+sc,list=state.pdas[k]||(state.pdas[k]=[]),seen=new Set(list.map(x=>normName(x.t)));let added=0,rep=0,long=0;
  for(const t of lines){if(t.length>400){long++;continue}if(seen.has(normName(t))){rep++;continue}if(list.length>=300)break;list.push({id:gid(),t});seen.add(normName(t));added++}
  save();render();
  notify(`${added} ${added===1?'PDA agregado':'PDA agregados'}.${rep?` ${rep} ya estaban.`:''}${long?` ${long} eran demasiado largos (más de 400 letras).`:''}`,added?'success':'info');
}
function editPda(id){
  const g=group(),list=pdaList(g,scopeId(g)),p=list.find(x=>x.id===id);if(!p)return;
  const t=prompt('Texto del PDA:',p.t);if(t===null)return;const v=t.replace(/\s+/g,' ').trim().slice(0,400);if(!v)return warn('El PDA no puede quedar vacío.');
  p.t=v;save();render();notify('PDA corregido. Sus evidencias ligadas se conservan.','success');
}
function removePda(id){
  const g=group(),sc=scopeId(g),k=g.id+'|'+sc,p=pdaList(g,sc).find(x=>x.id===id);if(!p)return;
  withUndo(`PDA quitado. Las calificaciones no cambian; solo se desligaron sus evidencias.`,()=>{
    state.pdas[k]=(state.pdas[k]||[]).filter(x=>x.id!==id);if(!state.pdas[k].length)delete state.pdas[k];
    state.projects.forEach(pr=>{pr.pdas=pr.pdas.filter(x=>x!==id)});
    state.activities.forEach(a=>{if(a.pdas)a.pdas=a.pdas.filter(x=>x!==id);if(a.rubric)a.rubric.criteria.forEach(c=>{if(c.pda===id)c.pda=''})});
  });
}
function copyPdasFrom(){
  const g=group(),sc=scopeId(g),from=state.groups.find(x=>x.id===document.getElementById('pdaFrom')?.value);if(!g||!from)return;
  const k=g.id+'|'+sc,list=state.pdas[k]||[],seen=new Set(list.map(x=>normName(x.t))),add=pdaList(from,sc).filter(x=>!seen.has(normName(x.t))).map(x=>({id:gid(),t:x.t,...(x.cat?{cat:true}:{}),...(x.cont?{cont:x.cont}:{})}));
  if(!add.length)return notify('Este grupo ya tiene todos esos PDA.','info');
  withUndo(`${add.length} PDA copiados de ${from.name}.`,()=>{state.pdas[k]=[...(state.pdas[k]||[]),...add].slice(0,300)});
}

let scheduleEditing=-1,schedFilter={group:'',scope:''};
const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
function schedDescribe(x){const g=state.groups.find(g=>g.id===x.groupId),d=DISCIPLINAS.find(d=>d.id===x.scopeId);return `${g?g.name:'Grupo eliminado'} · ${d?d.name:'Sin disciplina'} (${x.day} ${x.start}–${x.end})`}
/* Un docente no puede estar en dos clases a la vez: se compara contra TODO su horario, de cualquier grupo */
function scheduleConflict(e,ignoreIdx){return state.profile.schedule.findIndex((x,i)=>i!==ignoreIdx&&x.day===e.day&&toMin(e.start)<toMin(x.end)&&toMin(e.end)>toMin(x.start))}

  <section class="section panel"><div class="flex" style="justify-content:space-between"><h3>Vista semanal</h3><div class="flex"><label class="label-inline">Grupo <select class="field" onchange="schedFilter.group=this.value;render()"><option value="">Todos</option>${groups.map(g=>`<option value="${esc(g.id)}" ${schedFilter.group===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select></label><label class="label-inline">Disciplina <select class="field" onchange="schedFilter.scope=this.value;render()"><option value="">Todas</option>${subjectsAll.map(d=>`<option value="${d.id}" ${schedFilter.scope===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select></label></div></div>${calendarHTML(shown)}</section>

function saveSchedule(){
  const day=document.getElementById('scheduleDay').value,groupId=document.getElementById('scheduleGroup').value,scope=document.getElementById('scheduleSubject').value,start=document.getElementById('scheduleStart').value,end=document.getElementById('scheduleEnd').value;
  if(!scope||!TIME_RE.test(start)||!TIME_RE.test(end)||start>=end)return warn('Selecciona una disciplina e indica un horario válido (la hora de fin debe ser posterior a la de inicio).');
  const entry={id:scheduleEditing>=0?state.profile.schedule[scheduleEditing].id:gid(),day,groupId,scopeId:scope,start,end};
  const clash=scheduleConflict(entry,scheduleEditing);
  if(clash>=0)return warn('Empalme de horario: ya tienes «'+schedDescribe(state.profile.schedule[clash])+'». Un docente no puede estar en dos clases a la vez; cambia el horario o elimina la otra clase.');
  if(scheduleEditing>=0){state.profile.schedule[scheduleEditing]=entry;scheduleEditing=-1}else state.profile.schedule.push(entry);

function deleteSchedule(i){if(scheduleEditing===i)scheduleEditing=-1;else if(scheduleEditing>i)scheduleEditing--;withUndo('Clase eliminada del horario.',()=>{state.profile.schedule.splice(i,1)})}
/* Calendario semanal: columnas por día, bloques posicionados por hora */
function calendarHTML(items){
  if(!items.length)return '<div class="empty">Aún no hay clases para mostrar. Agrega la primera con el formulario de arriba.</div>';
  const mins=items.flatMap(({x})=>[toMin(x.start),toMin(x.end)]),t0=Math.floor(Math.min(...mins)/60)*60,t1=Math.max(t0+60,Math.ceil(Math.max(...mins)/60)*60),PPM=0.95;
  const days=DAYS.filter((d,i)=>i<5||items.some(({x})=>x.day===d)),hours=[];for(let t=t0;t<t1;t+=60)hours.push(t);
  const H=(t1-t0)*PPM,hh=t=>String(Math.floor(t/60)).padStart(2,'0')+':00';
  return `<div class="cal" role="table" aria-label="Horario semanal" style="--days:${days.length}"><div class="cal-head"><div></div>${days.map(d=>`<div role="columnheader">${d}</div>`).join('')}</div>
  <div class="cal-body"><div class="cal-hours" style="height:${H}px">${hours.map(t=>`<span style="top:${(t-t0)*PPM}px">${hh(t)}</span>`).join('')}</div>
  ${days.map(d=>`<div class="cal-col" style="height:${H}px">${items.filter(({x})=>x.day===d).map(({x,i})=>{const dis=DISCIPLINAS.find(q=>q.id===x.scopeId),gr=state.groups.find(g=>g.id===x.groupId),col=scopeColor(x.scopeId),h=(toMin(x.end)-toMin(x.start))*PPM;
    return `<button class="cal-block" style="top:${(toMin(x.start)-t0)*PPM}px;height:${h}px;background:${tint(col,.78)};border-left:5px solid ${col}" onclick="editSchedule(${i})" title="Clic para modificar"><b>${esc(gr?.name||'?')}</b><span>${esc(dis?.name||'')}</span><small>${esc(x.start)}–${esc(x.end)}</small></button>`}).join('')}</div>`).join('')}</div></div>`;
}

  let pre=null;try{const raw=localStorage.getItem(KEY+'_prerestore');if(raw)pre=JSON.parse(raw)}catch(e){}

  c.innerHTML=`<section class="panel"><h3>Copia de tus datos</h3>${abPanelHTML()}<p>Guarda una copia en tu computadora. También puedes recuperar una copia anterior.</p>
  <p class="helper">Ahora tienes <b>${cn.groups}</b> grupos, <b>${cn.students}</b> alumnos y <b>${cn.activities}</b> actividades. ${bd===null?'<b>Aún no has guardado ninguna copia.</b>':'Última copia: '+esc(new Date(state.lastBackup).toLocaleString('es-MX'))+' (hace '+bd+' días).'}</p>
  <div class="actions"><button class="primary" onclick="backup()">↓ Guardar una copia</button><label class="secondary" style="cursor:pointer" tabindex="0">↑ Recuperar desde una copia <input type="file" accept=".json,application/json" onchange="restore(this)" style="display:none"></label></div>
  <div class="hint">Cada respaldo incluye un código de verificación (SHA-256): si el archivo se daña o se modifica, el programa lo detecta y <b>no restaura nada</b>. Antes de restaurar, tus datos actuales se guardan automáticamente por si necesitas deshacer.</div>
  ${pre?`<div class="hint warn">Tienes una copia automática previa a la última restauración (${esc(new Date(pre.savedAt).toLocaleString('es-MX'))}). <button class="secondary" onclick="undoRestore()">↶ Deshacer la última restauración</button></div>`:''}
  <div class="hint">🔒 Tu información se guarda solo en esta computadora, dentro de este navegador: no se sube a internet ni la ve nadie más. Para no perderla si la computadora falla, guarda una copia de seguridad cada semana (mejor en una USB) o activa la copia automática.</div>
  <button class="danger" onclick="resetDemo()">Borrar todo y empezar de nuevo</button></section>`;
};
function makeBackupPack(){
  const data=copy(state),json=JSON.stringify(data),cn=countsOf(data);
  return {format:'mibitacora-backup',formatVersion:2,app:APP_NAME,edition:EDITION,appVersion:APP_VERSION,exportedAt:new Date().toISOString(),counts:cn,checksum:{algorithm:'SHA-256',value:sha256Hex(json)},data};
}
function backup(){
  const pack=makeBackupPack(),now=new Date(pack.exportedAt);
  const stamp=now.toLocaleDateString('en-CA')+'_'+String(now.getHours()).padStart(2,'0')+String(now.getMinutes()).padStart(2,'0');
  download('MiBitacora_'+EDITION+'_copia_'+stamp+'.json',new Blob([JSON.stringify(pack,null,2)],{type:'application/json'}));
  state.lastBackup=pack.exportedAt;save();render();
  notify('Copia guardada en tu carpeta de Descargas. Guárdala también en una USB o en tu correo.','success',{ms:10000});
}
async function restore(input){
  const file=input.files&&input.files[0];input.value='';if(!file)return;
  try{
    if(file.size>25*1024*1024)throw new Error('El archivo es demasiado grande para ser un respaldo de '+APP_NAME+'.');
    const d=JSON.parse(await file.text());let legacy=false,data;
    if(d&&['mibitacora-backup','aulagestion-backup'].includes(d.format)){
      if(d.edition!==EDITION)throw new Error('Este respaldo es de la edición '+d.edition+'. Usa un respaldo de '+EDITION+'.');
      if(!d.checksum||d.checksum.algorithm!=='SHA-256'||sha256Hex(JSON.stringify(d.data))!==d.checksum.value)throw new Error('El respaldo está dañado o fue modificado: falló la verificación de integridad. No se restauró nada.');
      data=d.data;
    }else if(d&&d.format==='aulagestion-demo-v1'){legacy=true;data=d.data}
    else throw new Error('Formato no compatible.');
    const clean=normalizeState(data,{strict:true}),cn=countsOf(clean),when=d.exportedAt?new Date(d.exportedAt).toLocaleString('es-MX'):'fecha desconocida';
    if(!confirm(`Se restaurará un respaldo (${when}).\n\nGrupos: ${cn.groups} · Alumnos: ${cn.students} · Actividades: ${cn.activities}\n${legacy?'Aviso: es un respaldo antiguo, sin verificación de integridad.\n':''}\nTus datos actuales se guardarán automáticamente como copia de seguridad para poder deshacer. ¿Continuar?`))return;
    try{localStorage.setItem(KEY+'_prerestore',JSON.stringify({savedAt:new Date().toISOString(),state}))}
    catch(e){if(!confirm('No fue posible crear la copia automática de tus datos actuales. ¿Restaurar de todos modos?'))return}
    state=clean;currentPeriod=state.profile.period||'1';save();selectedGroup='';switchTo('inicio');notify('Tu copia se recuperó correctamente.','success');
  }catch(e){warn('No se pudo recuperar la copia: '+e.message)}
}
function undoRestore(){
  try{
    const pre=JSON.parse(localStorage.getItem(KEY+'_prerestore')||'null');if(!pre)return;
    if(!confirm('¿Volver a los datos que tenías antes de la última restauración? Los datos actuales se reemplazarán.'))return;
    state=normalizeState(pre.state);currentPeriod=state.profile.period||'1';save();localStorage.removeItem(KEY+'_prerestore');selectedGroup='';switchTo('inicio');notify('Se recuperaron tus datos anteriores.','success');
  }catch(e){warn('No se pudo deshacer: '+e.message)}
}
function resetDemo(){
  if(!confirm('¿Borrar toda tu información y empezar de nuevo? Se perderán los datos actuales.\n\nSi no tienes un respaldo reciente, cancela y descarga uno primero.'))return;
  try{localStorage.setItem(KEY+'_prerestore',JSON.stringify({savedAt:new Date().toISOString(),state}))}catch(e){}
  state=normalizeState(copy(seed));currentPeriod='1';save();selectedGroup='';switchTo('inicio');
}

/* ---- Lectura de .xlsx (ZIP con XML). Sin bibliotecas externas. ---- */
async function inflateRaw(u8){
  if(typeof DecompressionStream==='undefined')throw new Error('Este navegador no puede abrir archivos .xlsx. Copia la columna de nombres en Excel y pégala en el cuadro de texto.');
  const ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();w.write(u8);w.close();
  return new Uint8Array(await new Response(ds.readable).arrayBuffer());
}
async function unzipEntries(buf){
  const u8=new Uint8Array(buf),dv=new DataView(buf);let eocd=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-66000);i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}}
  if(eocd<0)throw new Error('El archivo no parece ser un .xlsx válido.');
  const n=dv.getUint16(eocd+10,true);let p=dv.getUint32(eocd+16,true);const out={},td=new TextDecoder();
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nl));p+=46+nl+el+cl;
    if(!/^xl\/(worksheets\/sheet\d+\.xml|sharedStrings\.xml|workbook\.xml)$/.test(name))continue;
    const lnl=dv.getUint16(off+26,true),lel=dv.getUint16(off+28,true),start=off+30+lnl+lel,raw=u8.subarray(start,start+csize);
    out[name]=td.decode(method===0?raw:await inflateRaw(raw));
  }
  return out;
}
function colIndex(ref){let n=0;for(const ch of ref.replace(/[^A-Z]/gi,'').toUpperCase())n=n*26+ch.charCodeAt(0)-64;return n-1}
async function parseXlsx(buf){
  const z=await unzipEntries(buf),sheetName=Object.keys(z).filter(k=>k.startsWith('xl/worksheets/')).sort((a,b)=>a.localeCompare(b,'en',{numeric:true}))[0];
  if(!sheetName)throw new Error('No encontré hojas con datos en el archivo.');
  const dp=new DOMParser(),shared=[];
  if(z['xl/sharedStrings.xml']){const d=dp.parseFromString(z['xl/sharedStrings.xml'],'application/xml');d.querySelectorAll('si').forEach(si=>shared.push([...si.querySelectorAll('t')].map(t=>t.textContent).join('')))}
  const sd=dp.parseFromString(z[sheetName],'application/xml'),rows=[];
  sd.querySelectorAll('sheetData > row').forEach(r=>{
    const row=[];
    r.querySelectorAll(':scope > c').forEach(c=>{
      const t=c.getAttribute('t'),ref=c.getAttribute('r')||'',i=ref?colIndex(ref):row.length;let v='';
      if(t==='s')v=shared[Number(c.querySelector('v')?.textContent)]||'';
      else if(t==='inlineStr')v=[...c.querySelectorAll('t')].map(x=>x.textContent).join('');
      else v=c.querySelector('v')?.textContent||'';
      row[i]=String(v).trim();
    });
    rows.push(Array.from(row,x=>x||''));
  });
  return rows;
}
function parseText(text){
  const lines=text.replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());if(!lines.length)return [];
  const delim=['\t',';',','].find(d=>lines.slice(0,5).some(l=>l.includes(d)))||null;
  return lines.map(l=>delim?l.split(delim).map(x=>x.replace(/^"|"$/g,'').trim()):[l.trim()]);
}

/* ---- Extraer nombres de las filas ---- */
const HDR_FULL=/^(nombre(s)?( completo)?|alumno(s)?|nombre del alumno|nombre del estudiante|estudiante(s)?)$/i;
const HDR_AP=/^(apellido(s)?|primer apellido|ap(ellido)?\.? paterno)$/i,HDR_AP2=/^(segundo apellido|ap(ellido)?\.? materno)$/i,HDR_NOM=/^(nombre(s)?|nombre\(s\))$/i;
const SMALL=new Set(['de','del','la','las','los','y','e','da','van','von']);
function titleCase(s){return s.toLowerCase().split(/\s+/).map((w,i)=>i&&SMALL.has(w)?w:w.replace(/^(\p{L})/u,m=>m.toUpperCase())).join(' ')}
function cleanName(s){
  let n=String(s).replace(/^\s*\d+\s*[.\-)]*\s+/,'').replace(/\s+/g,' ').trim();
  if(n.includes(',')){const [a,...b]=n.split(',');if(b.length)n=b.join(' ').trim()+' '+a.trim()}
  if(n&&n===n.toUpperCase()&&/\p{L}/u.test(n))n=titleCase(n);
  return n.slice(0,130);
}
function extractNames(rows){
  rows=rows.filter(r=>r&&r.some(x=>x&&String(x).trim()));if(!rows.length)return {names:[],note:'El archivo está vacío.'};
  let hi=-1,mode=null,cols={};
  for(let i=0;i<Math.min(rows.length,10)&&hi<0;i++){
    const r=rows[i].map(x=>String(x||'').trim());
    const full=r.findIndex(x=>HDR_FULL.test(x));
    const ap=r.findIndex(x=>HDR_AP.test(x)),nom=r.findIndex(x=>HDR_NOM.test(x));
    if(ap>=0&&nom>=0&&ap!==nom){hi=i;mode='split';cols={ap,ap2:r.findIndex(x=>HDR_AP2.test(x)),nom}}
    else if(full>=0){hi=i;mode='full';cols={full}}
  }
  const body=rows.slice(hi+1),names=[];
  if(mode==='split'){body.forEach(r=>{const s=[r[cols.nom],r[cols.ap],cols.ap2>=0?r[cols.ap2]:''].filter(x=>x&&String(x).trim()).join(' ');if(s)names.push(s)})}
  else if(mode==='full'){body.forEach(r=>{if(r[cols.full])names.push(r[cols.full])})}
  else{ /* sin encabezado: columna con más texto (no números) */
    const width=Math.max(...rows.map(r=>r.length)),score=[];
    for(let c=0;c<width;c++)score.push(rows.filter(r=>r[c]&&/\p{L}{2,}/u.test(r[c])&&!/^\d+([.,]\d+)?$/.test(r[c])).length);
    const best=score.indexOf(Math.max(...score));rows.forEach(r=>{if(r[best]&&/\p{L}{2,}/u.test(r[best]))names.push(r[best])});
  }
  return {names:names.map(cleanName).filter(Boolean),note:mode?'':'No encontré un encabezado «Nombre»; usé la columna que parece tener los nombres.'};
}

/* ---- Vista previa ---- */
let impState={target:'group',items:[],file:''};
function flagItems(items,g){
  const seen=new Map(),existing=g?new Set(g.students.map(s=>normName(s.name))):new Set();
  items.forEach(it=>{
    it.flags=[];const k=normName(it.name);
    if(!k){it.flags.push('vacío');return}
    if(seen.has(k))it.flags.push('repetido en el archivo');else seen.set(k,1);
    if(existing.has(k))it.flags.push('ya está en el grupo');
    if(it.name.split(' ').length<2)it.flags.push('¿falta apellido?');
    if(/\d/.test(it.name))it.flags.push('tiene números');
    it.on=!it.flags.some(f=>f==='repetido en el archivo'||f==='ya está en el grupo'||f==='vacío');
  });
}
async function handleListFile(file,target){
  if(!file)return;
  try{
    if(/\.xls$/i.test(file.name))throw new Error('Los archivos .xls (Excel antiguo) no se pueden leer. Ábrelo en Excel, elige «Guardar como» y escoge «Libro de Excel (.xlsx)»; o copia la columna de nombres y pégala aquí.');
    if(file.size>10*1024*1024)throw new Error('El archivo es demasiado grande para ser una lista de alumnos.');
    const rows=/\.xlsx$/i.test(file.name)?await parseXlsx(await file.arrayBuffer()):parseText(await file.text());
    const {names,note}=extractNames(rows);
    if(!names.length)throw new Error('No encontré nombres en ese archivo. Revisa que tenga una columna con los nombres de los alumnos.');
    if(names.length>300)throw new Error('El archivo trae más de 300 nombres. Revisa que sea la lista de un solo grupo.');
    impState={target,file:file.name,note,items:names.map(n=>({name:n,on:true,flags:[]}))};
    flagItems(impState.items,target==='group'?group():null);showImportPreview();
  }catch(e){warn(e.message||'No se pudo leer el archivo.')}
}
function showImportPreview(){
  const it=impState.items,doubt=it.filter(x=>x.flags.length).length,sel=it.filter(x=>x.on).length;

  ${doubt?`<div class="hint warn">Revisa ${doubt} fila(s) marcadas con una nota.</div>`:'<div class="hint ok-hint">Todo se ve bien ✓</div>'}

}

/* ===== 64_proyectos.js — v0.14: Proyectos con contenidos y PDA del catálogo oficial =====
   · Cada grupo tiene un grado (1.° a 6.° en Primaria, 1.° a 3.° en Secundaria).
   · El catálogo (CATALOGO, incrustado por build.py) se filtra por grado y por campo formativo o disciplina:
     solo aparecen los contenidos que tienen PDA para ese grado.
   · Un proyecto pertenece a un grupo y a un campo/disciplina. Guarda sus contenidos y sus PDA.
     Los PDA elegidos del catálogo se agregan a la lista de PDA del grupo (marcados cat:true), así funcionan
     igual que los propios en actividades, rúbricas y en el avance por PDA.
   · Las actividades se ligan a un proyecto y heredan sus PDA (effectivePdas en 40_core.js). */

/* ---------- grado del grupo ---------- */
function gradeSelectHTML(g,id){
  return `<select class="field grade-sel" ${id?`id="${id}"`:''} aria-label="Grado de ${esc(g.name)}" onchange="setGroupGrade('${g.id}',this.value)"><option value="">Sin indicar</option>${Array.from({length:MAX_GRADE},(_,i)=>String(i+1)).map(n=>`<option value="${n}" ${g.grade===n?'selected':''}>${n}.° grado</option>`).join('')}</select>`;
}
function setGroupGrade(gid,v){
  const g=state.groups.find(x=>x.id===gid);if(!g)return;
  if(v&&!gradeOk(v))return;g.grade=v?String(Number(v)):'';
  /* Telesecundaria: al poner el grado se agregan las disciplinas que le faltan (nunca se quita ninguna) */
  let added=[];
  if(IS_TELE&&g.grade){const cur=g.disciplines||[];added=teleDisciplinas(g.grade).filter(d=>!cur.includes(d));g.disciplines=[...cur,...added]}
  save();render();
  notify(g.grade?`${g.name}: ${g.grade}.° grado. Ya se cargan sus contenidos y PDA.`+(added.length?` Se agregaron: ${added.map(d=>DISCIPLINAS.find(x=>x.id===d)?.name).join(', ')}.`:''):`${g.name}: sin grado.`,'success',{ms:added.length?7000:4000});
}

/* ---------- catálogo ---------- */
function catalogAll(sc){return ((CATALOGO&&CATALOGO.alcances)||{})[sc]||[]}
/* Contenidos con PDA para el grado del grupo: [{i,c,p:[texto]}]. null = el grupo no tiene grado. */
function catalogFor(g,sc){
  if(!g||!g.grade)return null;
  return catalogAll(sc).map((it,i)=>({i,c:it.c,p:(it.g||{})[g.grade]||[]})).filter(x=>x.p.length);
}
function catalogGrades(sc){const s=new Set();catalogAll(sc).forEach(it=>Object.keys(it.g||{}).forEach(k=>s.add(k)));return [...s].sort()}
/* Busca o agrega un PDA del catálogo en la lista del grupo; devuelve su id */
function ensureCatPda(g,sc,t,cont){
  const k=g.id+'|'+sc,list=state.pdas[k]||(state.pdas[k]=[]);
  const hit=list.find(x=>normName(x.t)===normName(t));
  if(hit){if(!hit.cont&&cont)hit.cont=cont;return hit.id}
  if(list.length>=300)return null;
  const p={id:gid(),t,cat:true,cont};list.push(p);return p.id;
}

function projEdit(id){
  const g=group(),pr=state.projects.find(x=>x.id===id);if(!g||!pr)return;
  const cat=catalogFor(g,pr.scopeId)||[],list=pdaList(g,pr.scopeId),sel=new Set(),own=new Set(),ownCont=[];
  for(const pid of pr.pdas){const p=list.find(x=>x.id===pid);if(!p)continue;let found=false;
    if(p.cat)for(const it of cat){const j=it.p.findIndex(t=>normName(t)===normName(p.t));if(j>=0){sel.add('p:'+it.i+':'+j);sel.add('c:'+it.i);found=true;break}}
    if(!found)own.add(pid)}
  for(const ct of pr.contenidos){const it=cat.find(x=>normName(x.c)===normName(ct.t));if(it)sel.add('c:'+it.i);else ownCont.push(ct.t)}
  projEditing=id;projDraft={g:g.id,sc:pr.scopeId,id,name:pr.name,desc:pr.desc,start:pr.start,end:pr.end,sel,own,ownCont};render();
  setTimeout(()=>document.getElementById('projEditor')?.scrollIntoView({block:'start'}),20);
}

function projCount(){

function projToggle(el){
  const d=projDraft;if(!d)return;const k=el.dataset.k,on=el.checked;
  if(on)d.sel.add(k);else d.sel.delete(k);
  if(k.startsWith('p:')&&on){const ck='c:'+k.split(':')[1];d.sel.add(ck);const c=document.querySelector(`#catList input[data-k="${ck}"]`);if(c)c.checked=true}
  if(k.startsWith('c:')&&!on){const i=k.split(':')[1];[...d.sel].filter(x=>x.startsWith('p:'+i+':')).forEach(x=>d.sel.delete(x));document.querySelectorAll(`#catList input[data-k^="p:${i}:"]`).forEach(x=>{x.checked=false})}

function projSave(){
  const g=group(),d=projDraft;if(!g||!d)return;
  const name=String(d.name||'').replace(/\s+/g,' ').trim().slice(0,120);if(!name)return warn('Escribe el nombre del proyecto.');
  if(d.start&&d.end&&d.end<d.start)return warn('La fecha de cierre no puede ser antes del inicio.');
  const pend=(document.getElementById('projNewPdas')?.value??d.newPdas??'').split(/\r?\n/).map(x=>x.replace(/^\s*(\d+[.)-]|[-•*·])\s*/,'').replace(/\s+/g,' ').trim()).filter(Boolean);
  if(pend.some(t=>t.length>600))return warn('Un PDA propio es demasiado largo (más de 600 letras).');
  const cat=catalogFor(g,d.sc)||[],byI=Object.fromEntries(cat.map(x=>[x.i,x])),old=d.id?state.projects.find(x=>x.id===d.id):null;
  withUndo(d.id?`Proyecto «${name}» actualizado. Sus actividades ya heredan los PDA nuevos.`:`Proyecto «${name}» creado.`,()=>{
    const ids=[],conts=[];
    const addCont=(t,catFlag)=>{if(conts.some(x=>normName(x.t)===normName(t)))return;const prev=old&&old.contenidos.find(x=>normName(x.t)===normName(t));conts.push({id:prev?prev.id:gid(),t,...(catFlag?{cat:true}:{})})};
    for(const it of cat){if(d.sel.has('c:'+it.i))addCont(it.c,true)}
    for(const k of d.sel){if(!k.startsWith('p:'))continue;const [,i,j]=k.split(':'),it=byI[i];if(!it||!it.p[j])continue;const id=ensureCatPda(g,d.sc,it.p[j],it.c);if(id)ids.push(id)}
    for(const id of d.own)if(pdaList(g,d.sc).some(x=>x.id===id))ids.push(id);
    const kk=g.id+'|'+d.sc,list=state.pdas[kk]||(state.pdas[kk]=[]);
    for(const t of pend){const hit=list.find(x=>normName(x.t)===normName(t));if(hit){ids.push(hit.id);continue}if(list.length>=300)break;const p={id:gid(),t};list.push(p);ids.push(p.id)}
    for(const t of d.ownCont)addCont(t,false);
    const data={name,desc:String(d.desc||'').trim().slice(0,600),start:DATE_RE.test(d.start||'')?d.start:'',end:DATE_RE.test(d.end||'')?d.end:'',contenidos:conts.slice(0,60),pdas:[...new Set(ids)]};
    if(old)Object.assign(old,data);else state.projects.push({id:gid(),groupId:g.id,scopeId:d.sc,archived:false,...data});
    projDraft=null;projEditing='';
  });
}

  window.levelValuesOpen=true;const k=levelCuts(),t=cutsText();
  c.innerHTML=backToOptions()+`<section class="panel"><h3>Colores de las calificaciones</h3>
    <p class="helper">Se usan en la cuadrícula, en las rúbricas, en el semáforo y en Avance por PDA. Escala de 0 a 10. Ponlos igual que los acuerdos de tu escuela para que los colores coincidan al evaluar.</p>
    <div class="cuts-grid">
      <label class="cut g-ok"><b>Nivel esperado (verde)</b> desde <input class="field" type="number" id="cutNe" min="0" max="10" step="0.1" value="${k.ne}" oninput="cutsPreview()"> hasta 10</label>
      <label class="cut g-mid"><b>En proceso (amarillo)</b> desde <input class="field" type="number" id="cutEp" min="0" max="10" step="0.1" value="${k.ep}" oninput="cutsPreview()"> <span id="cutEpTo">hasta ${esc(t.ep.split(' a ')[1]||'')}</span></label>
      <div class="cut g-low"><b>Requiere apoyo (rojo)</b> <span id="cutRa">${esc(t.ra)}</span></div>
    </div>
    <div class="actions"><button class="primary" onclick="setLevelCuts()">Guardar colores</button><button class="secondary" onclick="setLevelCuts(true)">Volver a 8 y 6</button></div></section>
    <section class="panel section">${levelValuesHTML()}</section>`;
};
function cutsPreview(){const ne=Number(document.getElementById('cutNe')?.value),ep=Number(document.getElementById('cutEp')?.value);const a=document.getElementById('cutEpTo'),b=document.getElementById('cutRa');if(a&&Number.isFinite(ne))a.textContent='hasta '+numfmt(round2(ne-0.1));if(b&&Number.isFinite(ep))b.textContent='menos de '+numfmt(ep)}
function setLevelCuts(reset){
  const ne=reset?8:Number(document.getElementById('cutNe')?.value),ep=reset?6:Number(document.getElementById('cutEp')?.value);
  if(![ne,ep].every(n=>Number.isFinite(n)&&n>=0&&n<=10))return warn('Los rangos deben estar entre 0 y 10.');
  if(ep>ne)return warn('«En proceso» no puede empezar más arriba que «Nivel esperado».');
  state.settings.levelCuts={ne:round2(ne),ep:round2(ep)};save();render();notify('Colores guardados. La cuadrícula ya los usa.','success');
}


/* ---------- Rubros y porcentajes (por grupo y campo formativo) ---------- */
let rubDrafts={};   /* cambios sin guardar, por grupo|campo */
function rubDraft(g,sc){
  const k=rubroKey(g,sc);
  if(!rubDrafts[k]){const R=rubrosOf(g,sc);rubDrafts[k]={pct:R.pct,items:copy(R.items),moves:{},dirty:false}}
  return rubDrafts[k];
}
function rubUsage(g,sc,rid,p=currentPeriod){return state.activities.filter(a=>a.groupId===g.id&&a.scopeId===sc&&String(a.period)===String(p)&&a.rubro===rid).length}
VIEWS.rubros=function(c,g){
  title('CALIFICACIONES','Rubros y porcentajes',`Los rubros son los tipos de trabajo que calificas. ${SCOPE_W.each} de cada grupo tiene los suyos, y cada trimestre puede tener rubros distintos.`);
  if(!g){c.innerHTML=backToOptions()+emptyPanel('Primero crea un grupo.');return}
  const sc=scopeId(g),d=rubDraft(g,sc),sum=Math.round(d.items.reduce((a,x)=>a+(Number(x.w)||0),0)*10)/10;
  const sumChip=!d.pct?'':Math.abs(sum-100)<0.01?`<span class="chip ok" id="rubSum">Suma: 100 % ✓</span>`:`<span class="chip warnchip" id="rubSum">Suma: ${numfmt(sum)} % · ${sum<100?'faltan '+numfmt(Math.round((100-sum)*10)/10):'sobran '+numfmt(Math.round((sum-100)*10)/10)} %</span>`;
  const others=scopesForGroup(g).filter(x=>x.id!==sc);
  const own=rubrosOwn(g,sc),prevName=currentPeriod==='1'?'':periodName(Number(currentPeriod)-1);
  c.innerHTML=backToOptions()+`<section class="panel"><div class="scope-controls"><div class="flex">${groupSelect()}${scopeSelect(g)}</div></div>
  <div class="seg rub-per" role="radiogroup" aria-label="Trimestre">${['1','2','3'].map(n=>`<button class="seg-b ${currentPeriod===n?'on':''}" role="radio" aria-checked="${currentPeriod===n}" onclick="rubSetPeriod('${n}')">${periodName(n)}</button>`).join('')}</div>
  <h3 class="rub-title">Rubros del ${esc(periodName(currentPeriod))} · ${esc(scopeName(g,sc))}</h3>
  ${!own&&prevName?`<p class="hint">Este trimestre usa por ahora los mismos rubros del ${esc(prevName)}. Si los cambias aquí, solo cambian en el ${esc(periodName(currentPeriod))}; los otros trimestres quedan igual.</p>`:`<p class="helper">Lo que cambies aquí solo afecta al ${esc(periodName(currentPeriod))}. Las actividades de los otros trimestres conservan sus rubros.</p>`}
  <div class="seg rub-mode" role="radiogroup" aria-label="Cómo cuentan los rubros"><button class="seg-b ${!d.pct?'on':''}" role="radio" aria-checked="${!d.pct}" onclick="rubSetPct(false)">Todas las actividades valen lo mismo</button><button class="seg-b ${d.pct?'on':''}" role="radio" aria-checked="${d.pct}" onclick="rubSetPct(true)">Cada rubro vale un porcentaje</button></div>
  <div class="table-wrap"><table class="rows rub-table"><thead><tr><th>Rubro</th>${d.pct?'<th>Porcentaje</th>':''}<th>Actividades</th><th></th></tr></thead><tbody>
  ${d.items.map((it,i)=>{const used=rubUsage(g,sc,it.id);return `<tr><td><input class="field" maxlength="40" value="${esc(it.name)}" aria-label="Nombre del rubro ${i+1}" oninput="rubroEdit(${i},'name',this.value)"></td>${d.pct?`<td><span class="pct-in"><input class="field percent-input" type="number" min="0" max="100" step="0.5" value="${it.w}" aria-label="Porcentaje de ${esc(it.name)}" oninput="rubroEdit(${i},'w',this.value)"> %</span></td>`:''}<td>${used?used+(used===1?' actividad':' actividades'):'<span class="muted">—</span>'}${d.moves[it.id]?'':''}</td><td><div class="flex rub-order"><button class="mini" onclick="rubMove(${i},-1)" ${i===0?'disabled':''} aria-label="Subir ${esc(it.name)}" title="Subir">▲</button><button class="mini" onclick="rubMove(${i},1)" ${i===d.items.length-1?'disabled':''} aria-label="Bajar ${esc(it.name)}" title="Bajar">▼</button><button class="mini" onclick="rubRemove(${i})" ${d.items.length<=1?'disabled':''} aria-label="Quitar ${esc(it.name)}">✕ Quitar</button></div></td></tr>`}).join('')}
  </tbody></table></div>
  <div class="flex rub-add"><input class="field" id="rubNew" maxlength="40" placeholder="Nuevo rubro, ej. Participación" list="rubIdeas" onkeydown="if(event.key==='Enter')rubAdd()" ${d.items.length>=12?'disabled':''}><datalist id="rubIdeas">${RUBRO_IDEAS.filter(n=>!d.items.some(it=>normName(it.name)===normName(n))).map(n=>`<option value="${esc(n)}">`).join('')}</datalist><button class="secondary" onclick="rubAdd()" ${d.items.length>=12?'disabled':''}>+ Agregar rubro</button>${sumChip}</div>
  <div class="actions"><button class="primary" onclick="rubSave()">Guardar rubros del ${esc(periodName(currentPeriod))}</button>${d.dirty?`<button class="secondary" onclick="rubDiscard()">Descartar cambios</button><span class="chip warnchip">Cambios sin guardar</span>`:''}</div>
  <div class="hint">${d.pct?'Los porcentajes deben sumar 100. ':''}Si un rubro todavía no tiene calificaciones, no cuenta: ${d.pct?'su porcentaje se reparte entre los rubros que ya tienen notas':'el promedio se hace con lo que ya calificaste'}. Los porcentajes los decides tú según los acuerdos de tu escuela. Con ▲ ▼ eliges el orden: así se agrupan tus actividades en Calificar, el Cuaderno y el Excel.</div></section>
  ${rubCopyPeriodsHTML(g,sc)}
  ${EDITION==='Primaria'?(others.length?`<section class="section panel"><h3>¿Los mismos rubros en otros campos?</h3><p class="helper">Copia los rubros guardados de <b>${esc(scopeName(g,sc))}</b> a los demás campos formativos de ${esc(g.name)}. Después puedes ajustar cada uno.</p><button class="secondary" onclick="rubCopyOthers()">Copiar a los otros ${others.length} campos</button></section>`:''):rubCopyGroupsHTML(g,sc)}`;

function curRub(){const g=group();return g?{g,sc:scopeId(g),p:currentPeriod,d:rubDraft(g,scopeId(g))}:null}
/* v0.25: cambiar de trimestre desde Rubros (cambia el trimestre de trabajo de toda la app) */
function rubSetPeriod(n){const x=curRub();if(x&&x.d.dirty&&n!==currentPeriod)return warn('Primero guarda o descarta los cambios de este trimestre.');setPeriod(n)}
/* v0.25: copiar los rubros guardados de este trimestre a los otros trimestres del mismo grupo y campo/disciplina */
function rubCopyPeriodsHTML(g,sc){
  const others=['1','2','3'].filter(n=>n!==currentPeriod);
  return `<section class="section panel"><h3>¿Los mismos rubros en otro trimestre?</h3><p class="helper">Copia los rubros guardados del <b>${esc(periodName(currentPeriod))}</b> a los trimestres que marques (solo en ${esc(g.name)} · ${esc(scopeName(g,sc))}). Las actividades de esos trimestres pasan al rubro con el mismo nombre; sus notas no cambian.</p>
  <div class="copy-periods flex">${others.map(n=>`<label class="check-inline copy-t"><input type="checkbox" data-cp="${n}"> ${periodName(n)}</label>`).join('')}</div>
  <div class="actions"><button class="secondary" onclick="rubCopyPeriods()">Copiar a los trimestres marcados</button></div></section>`;
}
function rubCopyPeriods(){
  const x=curRub();if(!x)return;
  const ps=[...document.querySelectorAll('.copy-periods input[data-cp]:checked')].map(el=>el.dataset.cp).filter(n=>n!==x.p);
  if(!ps.length)return warn('Marca al menos un trimestre.');
  rubCopyTo(x,ps.map(p=>({g:x.g,sc:x.sc,p})));
}
function rubSetPct(on){const x=curRub();if(!x)return;x.d.pct=on;if(on&&x.d.items.every(it=>!(it.w>0))){const n=x.d.items.length,base=Math.floor(100/n);x.d.items.forEach((it,i)=>{it.w=i===0?100-base*(n-1):base})}x.d.dirty=true;render()}
function rubroEdit(i,k,v){
  const x=curRub();if(!x||!x.d.items[i])return;x.d.items[i][k]=k==='w'?Number(v):v;x.d.dirty=true;
  if(k==='w'){const sum=Math.round(x.d.items.reduce((a,y)=>a+(Number(y.w)||0),0)*10)/10,el=document.getElementById('rubSum');
    if(el){const ok=Math.abs(sum-100)<0.01;el.className='chip '+(ok?'ok':'warnchip');el.textContent=ok?'Suma: 100 % ✓':`Suma: ${numfmt(sum)} % · ${sum<100?'faltan '+numfmt(Math.round((100-sum)*10)/10):'sobran '+numfmt(Math.round((sum-100)*10)/10)} %`}}
}
function rubAdd(){
  const x=curRub();if(!x)return;const inp=document.getElementById('rubNew'),name=(inp?.value||'').replace(/\s+/g,' ').trim().slice(0,40);
  if(!name)return warn('Escribe el nombre del rubro.');
  if(x.d.items.some(it=>normName(it.name)===normName(name)))return warn('Ese rubro ya está en la lista.');
  if(x.d.items.length>=12)return warn('Cada campo puede tener hasta 12 rubros.');
  x.d.items.push({id:gid(),name,w:0});x.d.dirty=true;render();document.getElementById('rubNew')?.focus();
}
/* v0.18.2: el orden de los rubros es el orden en que se agrupan las actividades en Calificar, el Cuaderno y el Excel */
function rubMove(i,dir){const x=curRub();if(!x)return;const j=i+dir,it=x.d.items;if(j<0||j>=it.length)return;[it[i],it[j]]=[it[j],it[i]];x.d.dirty=true;render()}
function rubRemove(i){
  const x=curRub();if(!x)return;const it=x.d.items[i];if(!it||x.d.items.length<=1)return;
  const used=rubUsage(x.g,x.sc,it.id);
  if(!used){x.d.items.splice(i,1);x.d.dirty=true;render();return}
  const rest=x.d.items.filter(y=>y.id!==it.id);
  openModal(`<h2>Quitar «${esc(it.name)}»</h2><p>Este rubro tiene <b>${used}</b> ${used===1?'actividad':'actividades'}. ¿A qué rubro ${used===1?'la paso':'las paso'}? Sus notas no cambian.</p><label class="label-inline">Pasar a <select class="field" id="rubMoveTo">${rest.map(y=>`<option value="${esc(y.id)}">${esc(y.name)}</option>`).join('')}</select></label><div class="actions"><button class="primary" data-autofocus onclick="rubRemoveConfirm('${it.id}')">Quitar y pasar actividades</button><button class="secondary" onclick="closeModal()">Cancelar</button></div><p class="helper">El cambio se aplica al tocar «Guardar rubros».</p>`,{label:'Quitar rubro'});
}
function rubRemoveConfirm(rid){
  const x=curRub();if(!x)return;const to=document.getElementById('rubMoveTo')?.value;if(!to)return;
  x.d.moves[rid]=to;Object.keys(x.d.moves).forEach(k=>{if(x.d.moves[k]===rid)x.d.moves[k]=to});
  x.d.items=x.d.items.filter(y=>y.id!==rid);x.d.dirty=true;closeModal();render();
}
function rubDiscard(){const x=curRub();if(!x)return;delete rubDrafts[rubroKey(x.g,x.sc,x.p)];render()}
function rubProblems(d){
  const names=new Set();
  for(const it of d.items){const n=String(it.name||'').replace(/\s+/g,' ').trim();if(!n)return 'Cada rubro necesita un nombre.';if(names.has(normName(n)))return `El rubro «${n}» está repetido.`;names.add(normName(n))}
  if(d.pct){
    if(d.items.some(it=>!Number.isFinite(Number(it.w))||it.w<0||it.w>100))return 'Cada porcentaje debe estar entre 0 y 100.';
    const sum=d.items.reduce((a,it)=>a+Number(it.w),0);if(Math.abs(sum-100)>=0.01)return `Los porcentajes suman ${numfmt(Math.round(sum*10)/10)} %; deben sumar exactamente 100 %.`;
  }
  return '';
}
function rubSave(){
  const x=curRub();if(!x)return;const msg=rubProblems(x.d);if(msg)return warn(msg);
  const k=rubroKey(x.g,x.sc,x.p),d=x.d,items=d.items.map(it=>({id:it.id,name:String(it.name).replace(/\s+/g,' ').trim().slice(0,40),w:d.pct?Math.round(Number(it.w)*10)/10:(Number(it.w)||0)}));
  const moves={...d.moves};delete rubDrafts[k];
  withUndo(`Rubros del ${periodName(x.p)} de ${scopeName(x.g,x.sc)} guardados${d.pct?' con sus porcentajes':''}. Los promedios ya se recalcularon.`,()=>{
    freezeLaterRubros(x.g,x.sc,x.p);
    state.rubros[k]={pct:d.pct,items};
    state.activities.forEach(a=>{if(a.groupId===x.g.id&&a.scopeId===x.sc&&String(a.period)===String(x.p)&&moves[a.rubro])a.rubro=moves[a.rubro]});
  });
}
function rubCopyOthers(){
  const x=curRub();if(!x)return;
  rubCopyTo(x,scopesForGroup(x.g).filter(s=>s.id!==x.sc).map(s=>({g:x.g,sc:s.id,p:x.p})));
}
/* v0.25: la primera vez que el docente entra al 2.º o 3.er trimestre con un grupo, se le muestran los rubros con los que
   empieza (copia del trimestre anterior) para que decida si los cambia. Solo se pregunta una vez por grupo y trimestre. */
function periodRubrosCheck(){
  if(currentPeriod==='1'||document.getElementById('modal')||active==='bienvenida')return;
  const g=group();if(!g||(typeof licReadOnly==='function'&&licReadOnly()))return;
  const scs=scopesForGroup(g).filter(sc=>{const R=rubrosOwn(g,sc.id);return !R||R.nr});
  if(!scs.length)return;
  const prev=periodName(Number(currentPeriod)-1),now=periodName(currentPeriod);
  const line=sc=>{const R=rubrosOf(g,sc.id);return `<li><b>${esc(sc.name)}:</b> ${R.items.map(it=>esc(it.name)+(R.pct?' '+numfmt(it.w)+' %':'')).join(' · ')}</li>`};
  openModal(`<h2>📅 ${esc(now)} · ${esc(g.name)}</h2>
    <p>Tus rubros del ${esc(now)} empiezan <b>iguales que en el ${esc(prev)}</b>. Si en este trimestre calificas otras cosas (por ejemplo, agregas «Proyecto» o cambias los porcentajes), puedes cambiarlos: los del ${esc(prev)} y sus calificaciones no se tocan.</p>
    <ul class="opt-sum per-rub-list">${scs.map(line).join('')}</ul>
    <div class="actions"><button class="primary" data-autofocus onclick="periodRubrosAccept(true)">Revisar rubros</button><button class="secondary" onclick="periodRubrosAccept(false)">Así están bien</button></div>`,{label:'Rubros del trimestre',sticky:true});
}
function periodRubrosAccept(go){
  const g=group();if(g)scopesForGroup(g).forEach(sc=>{const R=ensureRubros(g,sc.id);delete R.nr});
  save();closeModal();
  if(go)switchTo('rubros');else notify(`Listo: el ${periodName(currentPeriod)} usa esos rubros. Puedes cambiarlos cuando quieras en Opciones del cuaderno › Rubros y porcentajes.`,'success');
}
/* Copia los rubros guardados del grupo/alcance actual a otros pares grupo|alcance */
function rubCopyTo(x,targets){
  if(x.d.dirty)return warn(`Primero guarda los cambios de ${SCOPE_W.this}.`);
  if(!targets.length)return warn('Marca al menos un grupo.');
  const src=rubrosOf(x.g,x.sc,x.p),same=t=>t.g.id===x.g.id&&t.sc===x.sc;
  const label=targets.map(t=>same(t)?periodName(t.p):(EDITION==='Primaria'?scopeName(t.g,t.sc):t.g.name+' · '+scopeName(t.g,t.sc))+(t.p!==x.p?' ('+periodName(t.p)+')':'')).join(', ');
  withUndo(`Rubros copiados a ${label}.`,()=>{
    for(const t of targets){
      const tp=t.p||x.p;freezeLaterRubros(t.g,t.sc,tp);
      const k=rubroKey(t.g,t.sc,tp),old=rubrosOf(t.g,t.sc,tp).items,items=copy(src.items);
      state.rubros[k]={pct:src.pct,items};delete rubDrafts[k];
      /* cada actividad de ahí (de ese trimestre) pasa al rubro con el mismo nombre; si no hay, al primero */
      state.activities.forEach(a=>{if(a.groupId!==t.g.id||a.scopeId!==t.sc||String(a.period)!==String(tp))return;const was=old.find(it=>it.id===a.rubro);
        const hit=(was&&items.find(it=>normName(it.name)===normName(was.name)))||items.find(it=>it.id===a.rubro)||items[0];a.rubro=hit.id});
    }
  });
}
/* v0.13 (Secundaria): copiar a mis otros grupos (y a otras disciplinas). Vienen marcados los grupos con la misma disciplina. */
function rubCopyTargets(g,sc){const out=[];for(const g2 of activeGroups())for(const s of scopesForGroup(g2))if(!(g2.id===g.id&&s.id===sc))out.push({g:g2,sc:s.id,p:currentPeriod});return out}
function rubCopyGroupsHTML(g,sc){
  const T=rubCopyTargets(g,sc);if(!T.length)return '';
  return `<section class="section panel"><h3>¿Los mismos rubros en tus otros grupos?</h3><p class="helper">Copia los rubros guardados de <b>${esc(g.name)} · ${esc(scopeName(g,sc))}</b> a los grupos que marques (en el ${esc(periodName(currentPeriod))}). Ya vienen marcados los que tienen la misma disciplina. Después puedes ajustar cada uno.</p>
  <div class="copy-targets">${T.map(t=>`<label class="check-inline copy-t"><input type="checkbox" data-cg="${esc(t.g.id)}" data-cs="${esc(t.sc)}" ${t.sc===sc?'checked':''}> ${esc(t.g.name)} · ${esc(scopeName(t.g,t.sc))}</label>`).join('')}</div>
  <div class="actions"><button class="secondary" onclick="rubCopyGroups()">Copiar a los grupos marcados</button></div></section>`;
}
function rubCopyGroups(){
  const x=curRub();if(!x)return;
  const targets=[...document.querySelectorAll('.copy-targets input[data-cg]:checked')].map(el=>({g:state.groups.find(y=>y.id===el.dataset.cg),sc:el.dataset.cs,p:x.p})).filter(t=>t.g&&scopesForGroup(t.g).some(s=>s.id===t.sc)&&!(t.g.id===x.g.id&&t.sc===x.sc));
  rubCopyTo(x,targets);
}

async function abIdbGet(){try{const db=await abIdb();return await new Promise(res=>{const q=db.transaction('h').objectStore('h').get('dir');q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}catch(e){return null}}
async function abIdbSet(v){try{const db=await abIdb();await new Promise((res,rej)=>{const tx=db.transaction('h','readwrite');v?tx.objectStore('h').put(v,'dir'):tx.objectStore('h').delete('dir');tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){}}

async function abStop(){AB.handle=null;AB.name='';AB.perm='none';await abIdbSet(null);notify('La copia automática quedó apagada.','info');renderTopbar();if(active==='datos')render()}
function abSchedule(){

async function abWrite(announce){
  if(!AB.handle||AB.perm!=='granted')return false;
  try{
    const pack=makeBackupPack(),json=JSON.stringify(pack,null,2),day=new Date().toLocaleDateString('en-CA');
    for(const name of ['MiBitacora_'+EDITION+'_auto_ultima.json','MiBitacora_'+EDITION+'_auto_'+day+'.json']){
      const fh=await AB.handle.getFileHandle(name,{create:true}),w=await fh.createWritable();await w.write(json);await w.close();
    }
    /* conserva solo las 10 copias diarias más recientes */
    /* también cuenta las copias con el nombre anterior (AulaGestion_…), ordenando por fecha */
    const dated=[],re=new RegExp('^(MiBitacora|AulaGestion)_'+EDITION+'_auto_(\\d{4}-\\d{2}-\\d{2})\\.json$');for await(const [n] of AB.handle.entries()){const m=re.exec(n);if(m)dated.push([m[2],n])}
    dated.sort((a,b)=>b[0].localeCompare(a[0])||(a[1]<b[1]?1:-1)).slice(10).forEach(([,n])=>AB.handle.removeEntry(n).catch(()=>{}));
    AB.last=pack.exportedAt;AB.err='';try{localStorage.setItem(KEY+'_ablast',AB.last)}catch(e){}
    if(announce)notify(`Copia automática lista en la carpeta «${AB.name}». Se actualiza sola cada vez que guardas.`,'success');
    renderTopbar();if(active==='datos')render();return true;
  }catch(e){
    AB.err=e.message||String(e);if(e&&(e.name==='NotAllowedError'||e.name==='SecurityError'))AB.perm='prompt';
    renderTopbar();return false;
  }
}

/* ===== 66_licencia.js — v0.15: activación con clave (edición con LIC_REQUIRED) =====
   · Cada laptop/navegador tiene un «código de equipo» (8 letras y números) que se crea una sola vez.
   · El docente se lo manda a Rusho; él genera una clave firmada (ECDSA P-256) con su llave privada.
     La app solo trae la llave pública: puede comprobar claves, pero no fabricarlas.
   · Clave = 'MB1-' + base64url(JSON {v,e,c,n,t,x}) + '.' + base64url(firma). La firma cubre el texto base64url.
   · Sin clave: 15 días de prueba completos (v0.16; antes 30). Prueba o clave vencida: solo lectura (ver, exportar, respaldar);
     NUNCA se borran ni se bloquean los datos.
   · La licencia se guarda aparte de los datos (KEY+'_lic'): no viaja en los respaldos.
   · La fecha que se usa es la mayor entre hoy y la última vista (atrasar el reloj no regresa días).
   v0.20 — licencia por niveles:
   · La clave trae la lista de niveles comprados: {…, e:'<primer nivel>', l:['Primaria','Secundaria',…]}.
     Las claves viejas (solo «e») valen para ese único nivel. «e» se sigue llenando para las versiones viejas.
   · Licencia y prueba son UNA por equipo para todos los niveles (se guardan en 'mibitacora_lic').
     La primera vez se juntan las de cada edición (sin borrar las originales); la prueba cuenta desde el primer uso.
   · Se pueden tener varias claves (por ejemplo una vieja de Secundaria y otra nueva de Primaria): cuentan todas.
   · En la prueba se usan todos los niveles. Con clave, los niveles que no vienen en ella quedan en SOLO LECTURA
     (estado 'nivel'), con candado y el botón «Agregar este nivel» (WhatsApp 33 5195 0699). Nunca se borra nada. */
const LIC_TRIAL_DAYS=15;
const LIC_ALPHA='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const LIC={status:'checking',info:null,error:'',frozen:null,blockedAt:0,keys:[],levels:[],activated:false};
const LIC_LEVELS=['Primaria','Secundaria','Telesecundaria','Bachillerato'];   /* Bachillerato: reservado para cuando exista la edición */
const LIC_SHARED='mibitacora_lic';
const LIC_WA='523351950699',LIC_WA_TXT='33 5195 0699';
function licRead(k){try{const o=JSON.parse(localStorage.getItem(k)||'null');return o&&typeof o==='object'?o:null}catch(e){return null}}
function licStore(){
  const s=licRead(LIC_SHARED);
  if(s){if(!Array.isArray(s.keys))s.keys=[];return s}
  /* v0.20: primera vez con la licencia compartida: se juntan las licencias que había en cada edición (no se borran) */
  const own=licRead(KEY+'_lic')||{};
  const olds=['primaria','secundaria','telesecundaria'].map(e=>licRead('aulagestion_v09_'+e+'_lic')).filter(Boolean);
  const withKey=own.key?own:olds.find(x=>x.key);
  const o={dev:(withKey||own).dev||(olds[0]||{}).dev||'',keys:[],migrated:true};
  [own,...olds].forEach(x=>{if(x.key&&!o.keys.includes(x.key))o.keys.push(x.key)});
  const firsts=[own,...olds].map(x=>x.first).filter(d=>DATE_RE.test(d||'')).sort();
  const lasts=[own,...olds].map(x=>x.last).filter(d=>DATE_RE.test(d||'')).sort();
  if(firsts.length)o.first=firsts[0];
  if(lasts.length)o.last=lasts[lasts.length-1];
  licSave(o);return o;
}
function licSave(o){try{localStorage.setItem(LIC_SHARED,JSON.stringify(o))}catch(e){}}
function licLevelsOf(info){const l=Array.isArray(info?.l)&&info.l.length?info.l:[info?.e];return [...new Set(l.filter(x=>LIC_LEVELS.includes(x)))]}
function licJoin(a){return a.length<2?(a[0]||''):a.slice(0,-1).join(', ')+' y '+a[a.length-1]}
function licNewCode(){const r=new Uint8Array(8);crypto.getRandomValues(r);const s=[...r].map(b=>LIC_ALPHA[b%LIC_ALPHA.length]).join('');return s.slice(0,4)+'-'+s.slice(4)}
function licNormCode(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/^(.{4})(.+)$/,'$1-$2')}
/* Datos del equipo: código, primer uso y última fecha vista */
function licDevice(){
  const o=licStore();let changed=false;
  const hd=window.MB_HOST&&window.MB_HOST.device;   /* v0.17: en el instalador el código sale del equipo (no cambia al reinstalar) */
  if(hd&&o.dev!==hd){o.dev=hd;changed=true}
  if(!/^[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(o.dev||'')){o.dev=licNewCode();changed=true}
  const t=todayISO();
  if(!DATE_RE.test(o.first||'')){o.first=t;changed=true}
  if(!DATE_RE.test(o.last||'')||t>o.last){o.last=t;changed=true}
  if(changed)licSave(o);
  return o;
}
function licToday(){const o=licDevice(),t=todayISO();return t>o.last?t:o.last}
function daysBetween(a,b){return Math.round((Date.parse(b+'T12:00:00')-Date.parse(a+'T12:00:00'))/864e5)}
function licTrialLeft(){const o=licDevice();return Math.max(0,LIC_TRIAL_DAYS-daysBetween(o.first,licToday()))}
const b64uDec=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((s.length+3)%4)),c=>c.charCodeAt(0));
/* Comprueba una clave. Devuelve {ok,info,msg} */
async function licVerify(raw){
  const key=String(raw||'').replace(/\s+/g,'');
  if(window.MB_HOST)return window.MB_HOST.invoke('verify_license',{key,edition:EDITION,device:licDevice().dev}).then(r=>r.ok?{ok:true,info:r.info,key}:{ok:false,msg:r.msg}).catch(e=>({ok:false,msg:'No se pudo comprobar la clave ('+e+').'}));   /* v0.17: en el instalador la firma se comprueba en el programa (Rust) */
  const m=/^MB1-([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)$/.exec(key);
  if(!m)return {ok:false,msg:'Esa no parece una clave de Mi Bitácora. Cópiala completa, empieza con «MB1-».'};
  let info;
  try{
    const k=await crypto.subtle.importKey('jwk',LIC_PUB,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
    const good=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},k,b64uDec(m[2]),new TextEncoder().encode(m[1]));
    if(!good)return {ok:false,msg:'La clave no es válida. Revisa que la hayas copiado completa, sin cambiar ninguna letra.'};
    info=JSON.parse(new TextDecoder().decode(b64uDec(m[1])));
  }catch(e){return {ok:false,msg:'No se pudo comprobar la clave. Revisa que esté completa.'}}
  const dev=licDevice().dev;
  if(!licLevelsOf(info).length)return {ok:false,msg:'Esa clave no trae ningún nivel de Mi Bitácora.'};
  if(licNormCode(info.c)!==dev)return {ok:false,msg:`Esa clave es para otro equipo (${info.c}). El código de esta laptop es ${dev}.`};
  return {ok:true,info,key};
}
/* Estado: 'activa' | 'prueba' | 'vencida' (y 'libre' si la edición no pide clave) */
/* Estados: 'activa' | 'prueba' | 'vencida' | 'nivel' (este nivel no viene en la clave: solo lectura) */
async function licRefresh(){
  if(!LIC_REQUIRED){LIC.status='libre';return}
  const o=licDevice(),today=licToday();LIC.info=null;LIC.error='';LIC.keys=[];
  for(const k of o.keys){const r=await licVerify(k);if(r.ok)LIC.keys.push({key:k,info:r.info,levels:licLevelsOf(r.info),expired:!!(r.info.x&&today>r.info.x)});else LIC.error=r.msg}
  LIC.activated=LIC.keys.length>0;
  const live=LIC.keys.filter(k=>!k.expired),mine=LIC.keys.filter(k=>k.levels.includes(EDITION));
  LIC.levels=[...new Set(live.flatMap(k=>k.levels))];
  LIC.info=(mine.find(k=>!k.expired)||mine[0]||live[0]||LIC.keys[0]||{}).info||null;
  if(!LIC.activated)LIC.status=licTrialLeft()>0?'prueba':'vencida';
  else if(LIC.levels.includes(EDITION))LIC.status='activa';
  else LIC.status=mine.length?'vencida':'nivel';
  LIC.frozen=licReadOnly()?licSnapshot(state):null;
  /* para la pantalla de elegir edición (solo para mostrar candados; la app vuelve a comprobar todo) */
  const cache={activated:LIC.activated,levels:LIC.levels,trial:LIC.status==='prueba'};
  if(JSON.stringify(o.cache)!==JSON.stringify(cache)){o.cache=cache;licSave(o)}
}
function licReadOnly(){return LIC_REQUIRED&&(LIC.status==='vencida'||LIC.status==='nivel')}
function licWhyOff(){return LIC.status==='nivel'?`Tu licencia no incluye el nivel ${EDITION}`:LIC.info?'Tu licencia venció':'Terminó tu periodo de prueba'}
/* «Agregar este nivel»: escribir por WhatsApp con el código del equipo */
function licAddMsg(level){const n=LIC.info?.n;return `Hola, quiero agregar el nivel ${level} a mi licencia de Mi Bitácora. Mi código de equipo es ${licDevice().dev}.${n?' Nombre: '+n+'.':''}`}

function licOpenWhatsApp(level){
  const txt=licAddMsg(level);
  if(window.MB_HOST)return window.MB_HOST.invoke('abrir_whatsapp',{texto:txt}).catch(()=>licCopyAddMsg(level));

function licCopyAddMsg(level){
  const txt=licAddMsg(level),done=()=>notify(`Mensaje copiado. Pégalo en WhatsApp al ${LIC_WA_TXT}.`,'success',{ms:7000});

}
/* Lo que no se puede cambiar en solo lectura: todo menos la fecha de respaldo y la configuración de pantalla */
function licSnapshot(s){return JSON.stringify({...s,lastBackup:'',settings:null})}
async function licActivate(){
  const ta=document.getElementById('licKey'),msg=document.getElementById('licMsg');
  const r=await licVerify(ta?.value||'');
  if(!r.ok){if(msg){msg.textContent=r.msg;msg.className='hint warn'}return}
  const o=licDevice();if(!o.keys.includes(r.key))o.keys.push(r.key);o.key=r.key;licSave(o);await licRefresh();render();
  const lv=licLevelsOf(r.info),exp=r.info.x&&licToday()>r.info.x;
  if(exp)notify('La clave es válida, pero ya venció. Pide una nueva.','error',{ms:9000});
  else if(lv.includes(EDITION))notify(`¡Listo, ${r.info.n}! Tu licencia quedó activada para ${licJoin(lv)}${r.info.x?' hasta el '+fmtIso(r.info.x):''}.`,'success',{ms:9000});
  else notify(`Clave activada para ${licJoin(lv)}. Este nivel (${EDITION}) no viene en tu clave: queda en solo lectura.`,'info',{ms:11000});
}
function licCopyCode(){
  const c=licDevice().dev;
  const done=()=>notify(`Código ${c} copiado. Mándalo por WhatsApp para recibir tu clave.`,'success',{ms:6000});
  if(navigator.clipboard?.writeText)navigator.clipboard.writeText(c).then(done,()=>prompt('Copia tu código de equipo:',c));else prompt('Copia tu código de equipo:',c);
}
const LIC_TYPES={fundador:'Fundador',anual:'Anual',prueba:'Prueba extendida'};
VIEWS.licencia=function(c){
