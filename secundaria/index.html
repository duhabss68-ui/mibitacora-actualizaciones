/* Calendario semanal (Secundaria) */
.cal{overflow-x:auto;border:1px solid #e3eaf1;border-radius:16px;background:#fff}

.cal-hours{position:relative}
.cal-hours span{position:absolute;right:8px;transform:translateY(-50%);font-size:11px;color:#718294}
.cal-hours span:first-child{transform:none}
.cal-col{position:relative;border-left:1px solid #edf0f4;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 56px,#e9eef2 56px,#e9eef2 57px)}

.topbar{display:none;margin:0 0 16px;padding:13px 16px;border-radius:14px;background:#FFF6E0;border:1px solid #F0D58C;color:#6B4A0A;align-items:center;gap:12px;flex-wrap:wrap;font-weight:600}
.topbar.show{display:flex}.topbar .grow{flex:1}
.big{padding:15px 24px;font-size:18px;border-radius:14px}
.linkbtn{background:none;border:0;color:#27546a;text-decoration:underline;font-size:15px;padding:6px}
/* Inicio */
.welcome-strip{display:flex;align-items:center;gap:18px;padding:20px 24px;border-radius:18px;margin-bottom:18px;background:linear-gradient(110deg,var(--accent-dark),var(--accent));color:#fff}
.welcome-strip h2{margin:0 0 6px;font-size:26px}.welcome-strip p{margin:0;opacity:.95}
.today-strip{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 0}
.chip.warnchip{background:#FFF0D2;color:#7A4B00}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.home-card{border:1px solid #e3eaf1;background:#fff;border-radius:18px;padding:24px 18px;text-align:center;box-shadow:0 3px 13px #1e3f5710;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:17px;font-weight:800;color:#203047}
.home-card .hc-ico{font-size:40px}.home-card small{font-weight:500;color:#4A5B6D;font-size:14px}
.home-card:hover,.home-card:focus-visible{border-color:var(--accent);box-shadow:0 6px 20px #1e3f5726;transform:translateY(-2px)}
/* Asistencia */
.att-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:14px 0}
.att-card{border:2px solid #cfe8da;background:#EAF7F0;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.att-card.st-F,.att-card.st-FI{border-color:#f0b4bd;background:#FFECEF}.att-card.st-FJ{border-color:#efd18b;background:#FFF6DD}
.att-toggle{border:0;background:transparent;text-align:left;font-size:17px;font-weight:800;color:#203047;display:flex;justify-content:space-between;gap:8px;align-items:center;padding:4px}
.att-toggle .st{font-size:14px;font-weight:700}
.att-sub{display:flex;gap:6px;flex-wrap:wrap}
.att-btn{border:1px solid #d6e0e8;background:#fff;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:700}
.att-btn.on{background:#203047;color:#fff}
.save-bar{position:sticky;bottom:0;background:#ffffffee;padding:12px;border-top:1px solid #e3eaf1;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px}
.done-card{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:16px;background:#E1F5EC;color:#14543F;margin:12px 0}
.empty-state{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
/* Importar */
.dropzone{border:3px dashed #9db6c6;border-radius:18px;background:#F6FAFC;padding:30px 18px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;cursor:pointer;font-size:16px}
.dropzone.over,.dropzone:hover,.dropzone:focus-visible{border-color:var(--accent);background:#fff}
.dz-ico{font-size:38px}
.imp-table input.field{min-width:220px}
.imp-flag{font-size:13px;font-weight:700;color:#7A4B00;background:#FFF0D2;border-radius:8px;padding:3px 8px}
/* Ventanas */
.modal-back{position:fixed;inset:0;background:#10202d99;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-card{background:#fff;border-radius:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:26px}
.modal-card.wide{max-width:860px}
.help-ico{font-size:46px;text-align:center}.modal-card h2{text-align:center;margin:6px 0 14px}
.help-steps{font-size:17px;line-height:1.7;padding-left:24px}
/* Avisos */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px;width:min(560px,94vw)}
.toast{display:flex;align-items:center;gap:10px;background:#203047;color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 8px 24px #0004;font-size:16px}
.toast.success{background:#14654F}.toast.error{background:#A83242}
.toast-msg{flex:1;white-space:pre-line}.toast-ic{font-weight:900}
.toast-undo{background:#fff;color:#203047;border:0;border-radius:10px;padding:8px 12px;font-weight:800}
.toast-x{background:transparent;border:0;color:#fff;font-size:22px;line-height:1}
/* Asistente */
.wizard{max-width:720px;margin:0 auto}
.wiz-head{display:flex;align-items:center;gap:18px;margin-bottom:12px}
.wiz-dots{display:flex;align-items:center;gap:6px}
.wiz-dot{width:36px;height:36px;border-radius:50%;background:#e3eaf1;color:#4A5B6D;display:grid;place-items:center;font-weight:800}
.wiz-dot.on{background:var(--accent);color:#fff}.wiz-dot.done{background:#14654F;color:#fff}
.wiz-line{width:28px;height:3px;background:#e3eaf1}
.wiz-actions{display:flex;justify-content:space-between;margin-top:20px}.wiz-skip{text-align:center;margin-top:12px}
.ok-hint{border-left-color:#14654F;background:#E1F5EC;color:#14543F}
/* Cuadrícula */
.legend{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.lg{padding:4px 12px;border-radius:999px;font-weight:700;font-size:14px}
.g-ok{background:#D5F0E0;color:#0F5A3A}.g-mid{background:#FFF0B8;color:#6B5200}.g-low{background:#FFD3D8;color:#8E1F30}
.grid-wrap{max-height:70vh}
.gradegrid th.gh{min-width:130px;text-transform:none;font-size:13px;vertical-align:top}
.gradegrid .gh-name{font-weight:800;font-size:14px;color:#203047;white-space:normal}
.gh-actions{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.gradegrid .stickycol{position:sticky;left:0;background:#fff;z-index:2;min-width:160px}
.gradegrid thead th{position:sticky;top:0;background:#f4f7fa;z-index:3}
.gcell{width:84px;min-width:0;text-align:center;font-weight:700;font-size:17px}
input.gcell.g-ok{background:#D5F0E0}input.gcell.g-mid{background:#FFF0B8}input.gcell.g-low{background:#FFD3D8}
.avgpill{padding:5px 12px;border-radius:999px;font-weight:800}
.quick-add{margin-top:16px}.quick-add summary{font-weight:800;cursor:pointer;padding:6px 0}
.activity-create{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-top:10px}
.activity-create label{display:block}
/* Letra grande */
.big-text .main,.big-text .side{zoom:1.18}
@media(max-width:700px){.more-menu{right:auto;left:0}}
@media print{.topbar,#toasts,.subtabs{display:none!important}}
.chip{font-size:14px}.side .brand small{font-size:12px}
.mini{font-size:14px}.rows th{font-size:13px}

.quote{margin:0 0 16px;padding:14px 20px;border-left:5px solid var(--accent);background:#ffffffcc;border-radius:0 14px 14px 0}
.quote blockquote{margin:0;font-size:19px;line-height:1.45;font-style:italic;color:#203047}
.quote figcaption{margin-top:8px;font-size:15px;color:#4A5B6D}.quote cite{font-style:normal}

/* Iconos */
.svgi{width:1.3em;height:1.3em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.28em;flex:none}
.ic{display:inline-block}.side .nav .svgi{width:1.35em;height:1.35em}
body.secondary-edition .side .nav .svgi{color:#2F5FA7}body.secondary-edition .side .nav.on .svgi{color:#1E3F78}
body.secondary-edition .more-menu .svgi{color:#2F5FA7}
body.secondary-edition .subtab .svgi{color:#2F5FA7}body.secondary-edition .subtab.on .svgi{color:#fff}
body.secondary-edition .home-card .hc-ico{display:grid;place-items:center;width:68px;height:68px;border-radius:20px;background:#E5ECF7;color:#1E3F78;box-shadow:inset 0 -3px 0 #D8A45A}
body.secondary-edition .home-card .hc-ico .svgi{width:34px;height:34px;stroke-width:1.6}
body.secondary-edition .help-ico{display:grid;place-items:center;width:80px;height:80px;margin:0 auto;border-radius:24px;background:#E5ECF7;color:#1E3F78;box-shadow:inset 0 -3px 0 #D8A45A}
body.secondary-edition .help-ico .svgi{width:42px;height:42px;stroke-width:1.5}
body.secondary-edition .dz-ico{color:#2F5FA7}body.secondary-edition .dz-ico .svgi{width:44px;height:44px;stroke-width:1.5}

/* ===== Hoja tipo Excel ===== */
body[data-view=cuadricula] .main,body[data-view=libreta] .main,body[data-view=actividades] .main{max-width:none;padding:22px 16px}
.sheet-wrap{--rowh:32px;--cellfs:15px}
.sheet-wrap.dens-normal{--rowh:40px;--cellfs:16px}.sheet-wrap.dens-wide{--rowh:52px;--cellfs:18px}
.sheet-wrap{border:1px solid #c9d4de;border-radius:10px;background:#fff}
.grid-wrap{max-height:calc(100vh - 250px)}
.sheet{border-collapse:separate;border-spacing:0;width:max-content;min-width:0;font-size:var(--cellfs);font-variant-numeric:tabular-nums}
.sheet th,.sheet td{border-right:1px solid #dbe3ea;border-bottom:1px solid #dbe3ea;padding:0 8px;height:var(--rowh);white-space:nowrap;text-align:center}
.sheet tr:last-child td{border-bottom:1px solid #dbe3ea}
.sheet thead th{position:sticky;top:0;z-index:4;background:#eef3f7;color:#2c3f52;font-size:13px;font-weight:700;text-transform:none;letter-spacing:0;height:auto;padding:4px 6px;white-space:normal;line-height:1.15;min-width:72px;max-width:130px}
.sheet .stickycol{position:sticky;left:0;z-index:2;background:#fff;text-align:left;width:190px;min-width:150px;max-width:230px;overflow:hidden;text-overflow:ellipsis;font-weight:700;border-right:2px solid #aebccb}
.sheet .rn{position:sticky;left:0;z-index:2;background:#eef3f7;color:#6a7b8c;width:34px;min-width:34px;max-width:34px;padding:0;font-size:12px;font-weight:600}
.gradegrid .rn+.stickycol{left:34px}
.sheet thead th.corner{z-index:6;text-align:left}.sheet thead th.rn{text-align:center}
.sheet thead th.stickycol{background:#eef3f7}
.sheet tbody tr:nth-child(even) td:not(.gc){background:#f8fafc}
.sheet tbody tr:nth-child(even) td.stickycol{background:#f8fafc}
.sheet tbody tr:hover td.stickycol,.sheet tbody tr:hover td.avgcell{background:#e6f2f5}
.sheet tr.cur td.stickycol,.sheet tr.cur td.rn{background:#FFE9A8;color:#3d2f00}
.sheet th.cur{background:#FFE9A8;color:#3d2f00}
.sheet td.gc{padding:0;min-width:72px;width:78px}
.gradegrid .avgcell,.gradegrid .avgh{position:sticky;right:0;z-index:2;background:#f4f8fa;border-left:2px solid #aebccb;min-width:96px}
.gradegrid thead th.avgh{z-index:5}
.sheet tfoot td{position:sticky;bottom:0;z-index:3;background:#eef3f7;font-weight:700;font-size:13px}
.sheet tfoot td.stickycol{z-index:5;background:#eef3f7}
.sheet .gcell,.sheet .grade-input{display:block;width:100%;height:calc(var(--rowh) - 1px);border:0;border-radius:0;background:transparent;text-align:center;font:inherit;font-weight:700;color:#1d2b3a;padding:0 4px;-moz-appearance:textfield;appearance:textfield}
.sheet .gcell::-webkit-outer-spin-button,.sheet .gcell::-webkit-inner-spin-button,.sheet .grade-input::-webkit-outer-spin-button,.sheet .grade-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sheet .gcell:focus,.sheet .grade-input:focus{outline:3px solid var(--accent);outline-offset:-3px;background:#fff;position:relative;z-index:1}
.sheet td.gc input.g-ok{background:#D5F0E0}.sheet td.gc input.g-mid{background:#FFF0B8}.sheet td.gc input.g-low{background:#FFD3D8}
.colbtn{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:1px;width:100%;cursor:pointer;padding:3px 2px;border-radius:6px}
.colbtn:hover,.colbtn:focus-visible{background:#dfe9f0}.colbtn:focus-visible{outline:2px solid #3E8EDE}
.gh-name{font-weight:800;color:#203047;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.colbtn small{font-weight:600;color:#566b7e;font-size:12px}
.sheet-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.seg{display:flex;align-items:center;gap:4px}.seg-b{border:1px solid #cfdae5;background:#fff;padding:6px 12px;font-size:14px;font-weight:700;border-radius:8px;color:#35566b}
.seg-b.on{background:var(--accent);border-color:var(--accent);color:#fff}
.colmenu{position:absolute;z-index:150;background:#fff;border:1px solid #c9d4de;border-radius:12px;box-shadow:0 10px 28px #1e3f5738;padding:6px;min-width:250px;display:flex;flex-direction:column}
.colmenu .cm-title{padding:8px 10px;font-weight:800;border-bottom:1px solid #edf0f4;margin-bottom:4px;display:flex;flex-direction:column}
.colmenu .cm-title small,.colmenu button small{font-weight:500;color:#566b7e;font-size:13px}
.colmenu button{border:0;background:transparent;text-align:left;padding:10px;border-radius:8px;font-size:15px;font-weight:600;color:#23415a}
.colmenu button:hover,.colmenu button:focus-visible{background:#E3F1F2}
@media print{.sheet-wrap{max-height:none!important;overflow:visible!important}.sheet .stickycol,.sheet thead th{position:static}}
.gradegrid th.gh,.gradegrid td.gc{width:84px;min-width:84px;max-width:84px}
.gradegrid th.gh,.gradegrid td.gc{width:92px;min-width:92px;max-width:92px}
.sheet-wrap{width:fit-content;max-width:100%}

/* Ruleta misteriosa */
.winner-name.hidden{font-size:96px;line-height:1.1;font-weight:900;color:var(--accent);text-align:center}
.winner-name.shown{text-align:center}
.winner-name.pop{animation:popin .65s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.mystery{text-align:center}
#confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:300}
@media (prefers-reduced-motion:reduce){.winner-name.pop{animation:none}}

/* ===== v0.9: formas de calificar, rúbricas, PDA y ficha del alumno ===== */
.af .activity-create{margin-top:14px}
.check-inline{display:inline-flex;gap:8px;align-items:center;font-size:14px;font-weight:700;padding:11px 0;cursor:pointer}
.check-inline input{width:18px;height:18px;accent-color:var(--accent)}
.af-pda{border:1px solid #dce8ef;border-radius:12px;padding:10px 14px 12px;margin:12px 0 0;max-width:980px;background:#fbfdfe}
.af-pda legend{font-weight:750;font-size:14px;padding:0 6px}
.pda-pick{display:flex;gap:9px;align-items:flex-start;padding:6px 4px;font-size:14px;cursor:pointer;line-height:1.35}
.pda-pick input{margin-top:2px;width:17px;height:17px;flex:none;accent-color:var(--accent)}
.af-hint{min-height:1em;margin:8px 0 0}
.pda-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0}
.chip.pda{background:#EEF3FB;color:#2B4A72;font-weight:600;max-width:520px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* cuadrícula: casillas de marca, rúbrica y texto */
.sheet .gmark,.sheet .grub{cursor:pointer;font-size:calc(var(--cellfs) + 3px);line-height:1}
.sheet .gmark:hover,.sheet .grub:hover{background:#eef6f8}
.sheet .gmark.g-ok,.sheet .grub.g-ok{background:#D5F0E0;color:#0F5A3A}.sheet .gmark.g-mid,.sheet .grub.g-mid{background:#FFF0B8;color:#6B5200}.sheet .gmark.g-low,.sheet .grub.g-low{background:#FFD3D8;color:#8E1F30}
.sheet .grub{font-size:var(--cellfs)}
.sheet .grub.todo{color:#1d6f86;font-size:13px;text-decoration:underline;font-weight:700}
.sheet .grub.partial{background:repeating-linear-gradient(135deg,#fff 0 6px,#EEF4F7 6px 12px);color:#4b6375;font-size:13px}
.sheet .gtext{text-align:left!important;font-weight:500!important;font-size:14px;padding:0 8px!important}
.gradegrid th.gh.mode-text,.gradegrid td.gc:has(.gtext),#actTable td.gc:has(.gtext){width:220px;min-width:220px;max-width:220px}
#actTable td.gc{min-width:160px}
.sheet td.td-text{max-width:220px;overflow:hidden;text-overflow:ellipsis;text-align:left;font-size:13px}
.gradegrid th.gh small{white-space:nowrap}
.level-values{margin:12px 0}

/* rúbricas: biblioteca */
body[data-view=rubricas] .main,body[data-view=evaluar] .main,body[data-view=pda] .main{max-width:1600px}
.rub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-top:6px}
.rub-card{border:1px solid #dfe8ef;border-radius:14px;padding:14px;background:#fbfdfe}
.rub-card.open{grid-column:1/-1;background:#fff;border-color:#b9d3dc}
.rub-head{display:flex;gap:12px;align-items:center}
.rub-ico{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#E5ECF7;color:var(--accent-dark);font-size:22px;flex:none}
.rub-actions{margin-top:10px;gap:6px}
.danger-lite{color:#a83242!important}
.rub-preview{margin-top:12px;overflow-x:auto}
.share-box{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;margin-top:18px;padding:14px 16px;border-radius:14px;background:#f5f9fb;border:1px solid #e1eaf0}
.share-box p{margin:4px 0 0;max-width:520px}
.dropzone.small{padding:10px 16px;border-width:2px;font-size:14px;flex-direction:column;gap:2px;border-radius:12px}
.dropzone.small span{font-size:12px;color:#5c7283}
.rubtable{border-collapse:collapse;width:100%;font-size:14px}
.rubtable th,.rubtable td{border:1px solid #d7e1e8;padding:8px 10px;vertical-align:top;text-align:left}
.rubtable thead th{background:#eef3f7;font-size:13px;color:#2c3f52}
.rubtable th small,.rubtable thead th small{display:block;font-weight:500;color:#5c7283;font-size:12px;margin-top:2px}
.rubtable tbody th{background:#f8fafc;width:200px}
.rubtable.cotejo td.box{width:70px}
.rubtable td.num{text-align:center;white-space:nowrap}

/* rúbricas: editor */
.rub-editor h3{margin-bottom:8px}
.rd-levels{margin:14px 0 6px}
.rd-level{display:flex;flex-direction:column;gap:4px;background:#f5f9fb;border:1px solid #e1eaf0;border-radius:10px;padding:8px}
.rd-level .field{min-width:130px;width:150px}
.field.pts{width:84px;min-width:70px}
.rd-table td{padding:6px}
.rd-table textarea{width:100%;min-width:160px;resize:vertical;font:inherit;font-size:14px}
.rd-table td:first-child textarea{min-width:200px}
.rd-w{white-space:nowrap;text-align:center}.rd-w small{display:block;color:#5c7283;margin-top:4px}

/* rúbricas: evaluar con un clic */
.back-row{margin-bottom:14px;gap:8px}
.eval-layout{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
.eval-list{display:flex;flex-direction:column;gap:3px;background:#fff;border:1px solid #e3eaf1;border-radius:16px;padding:8px;position:sticky;top:90px;max-height:calc(100vh - 120px);overflow:auto}
.eval-st{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:9px;font-size:14px;color:#23415a;font-weight:600}
.eval-st span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eval-st:hover{background:#eef5f8}.eval-st.on{background:var(--accent);color:#fff}
.eval-st .es{flex:none;min-width:38px;text-align:center;border-radius:99px;padding:2px 8px;font-size:12px;font-weight:800;background:#eef3f7;color:#566b7e}
.eval-st .es.partial{background:#FFF0D2;color:#7A4B00}
.eval-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.eval-head h2{margin:2px 0 0;font-size:28px;letter-spacing:-.02em}
.eval-score{display:flex;flex-direction:column;align-items:center;min-width:120px;padding:10px 18px;border-radius:16px;background:#eef3f7;color:#3b5266}
.eval-score b{font-size:34px;line-height:1.05}.eval-score small{font-size:12px;font-weight:700}
.eval-score.g-ok{background:#D5F0E0;color:#0F5A3A}.eval-score.g-mid{background:#FFF0B8;color:#6B5200}.eval-score.g-low{background:#FFD3D8;color:#8E1F30}
.eval-table td{padding:5px}
.rcell{width:100%;min-height:74px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;border:2px solid #dbe5ec;background:#fff;border-radius:11px;padding:9px 10px;font-size:13px;color:#33495c;line-height:1.3}
.rcell b{font-size:14px;color:#1f3448}

   El <body> lleva «secondary-edition tele-edition»: hereda toda la estructura de Secundaria y aquí

const CATALOGO={"fuente":"SEP (2024). Programa de Estudio para la Educación Secundaria: Programa Sintético de la Fase 6.","fase":6,"alcances":{"esp":[{"c":"La diversidad de lenguas y su uso en la comunicación familiar, escolar y comunitaria.","g":{"1":["Reconoce la riqueza lingüística de México y el mundo, a partir de obras literarias procedentes de distintas culturas."],"2":["Comprende las características y recursos lingüísticos de la lengua española, para usarlos y valorarlos como parte de la riqueza pluricultural de México y del mundo."],"3":["Analiza y reconoce algunas variantes lingüísticas de la lengua española, para valorarla como riqueza cultural."]}},{"c":"La diversidad étnica, cultural y lingüística de México a favor de una sociedad intercultural.","g":{"1":["Comprende las ideas centrales y secundarias de textos relacionados con la diversidad étnica, cultural y lingüística, que favorecen una sociedad intercultural, para comentarlas en forma oral y escrita."],"2":["Compara y contrasta textos sobre las tensiones y conflictos en las sociedades contemporáneas y manifiesta, de manera oral o escrita, la necesidad de practicar la comunicación asertiva.","Analiza textos sobre las sociedades multiculturales y expresa la función que tiene el diálogo intercultural para la construcción democrática y la interacción en sociedad."],"3":["Practica la comunicación asertiva y el diálogo intercultural en interacción con otras personas.","Comparte una propuesta creativa propia en la que valore y promueva textos en español a favor de una sociedad intercultural."]}},{"c":"Las lenguas como manifestación de la identidad y del sentido de pertenencia.","g":{"1":["Describe en un texto cómo el lenguaje oral manifiesta las identidades personal y colectiva, para reconocer lo común y lo diferente."],"2":["Comprende y redacta textos narrativos sobre la construcción de la identidad y el sentido de pertenencia, a partir del análisis de variantes del español."],"3":["Elabora textos argumentativos acerca de la interculturalidad crítica, para reconocer el valor de las lenguas, a fin de promoverlas y fortalecerlas."]}},{"c":"El dinamismo de las lenguas y su relevancia como patrimonio cultural.","g":{"1":["Identifica y expresa la relevancia de valorar las lenguas como legado de la comunidad."],"2":["Reconoce cambios temporales y geográficos del español en la comunidad, el país o el mundo hispano."],"3":["Analiza en textos literarios neologismos, juegos de lenguajes, caló, jerga, préstamos lingüísticos y extranjerismos como parte del dinamismo de la lengua española."]}},{"c":"La función creativa del español en la expresión de necesidades e intereses comunitarios.","g":{"1":["Identifica una situación problemática de la comunidad, haciendo uso del pensamiento crítico, para plantear diversas formas creativas de resolverla, por ejemplo, con un cuento."],"2":["Expresa, mediante un ensayo, una postura crítica sobre necesidades, intereses y problemas de la comunidad."],"3":["Crea textos literarios de distintos géneros para ofrecer una propuesta de solución a problemas de la comunidad."]}},{"c":"Los elementos y los recursos estéticos de la lengua española en la literatura oral y escrita.","g":{"1":["Reconoce los recursos estéticos en textos literarios líricos, orales y escritos, y disfruta de poemas, canciones y juegos de palabras, entre otros."],"2":["Analiza las características y recursos estéticos de los textos narrativos, e interpreta y disfruta de cuentos y novelas."],"3":["Usa creativa e intencionalmente las características y los recursos estéticos de textos dramáticos, para escenificar situaciones vinculadas con la comunidad."]}},{"c":"Textos literarios escritos en español o traducidos.","g":{"1":["Reconoce el valor estético de diversos géneros literarios en textos de su elección, para elaborar comentarios y promover su lectura."],"2":["Analiza diversos textos literarios de su elección para expresar un juicio estético y lo comparte en la comunidad."],"3":["Elabora un ensayo acerca del tratamiento de un tema de su elección, con base en algún género literario de su preferencia, para argumentar un juicio estético sobre éste."]}},{"c":"Creaciones literarias tradicionales y contemporáneas.","g":{"1":["Recupera y clasifica creaciones literarias de la comunidad o de un lugar de interés, como mitos, leyendas, fábulas, epopeyas, cantares de gesta, refranes, coplas, canciones, corridos y juegos de palabras, para promover de manera creativa su lectura."],"2":["Valora textos literarios tradicionales y contemporáneos, como cuentos, novelas, poemas y textos dramáticos; los adapta a otros lenguajes para sensibilizar a la comunidad acerca de la relevancia social y cultural de la literatura."],"3":["Crea textos narrativos, poéticos, dramáticos y guiones para audiovisuales, entre otros, a partir del uso de recursos literarios, para exponer una situación real o ficticia."]}},{"c":"Recursos literarios en lengua española para expresar sensaciones, emociones, sentimientos e ideas vinculados con las familias, la escuela y la comunidad.","g":{"1":["Identifica recursos literarios en lengua española y los emplea en la elaboración de cartas personales y biografías, para expresar sensaciones, emociones, sentimientos e ideas que experimenta en su entorno familiar, escolar o comunitario."],"2":["Analiza recursos literarios en lengua española para expresar sensaciones, emociones, sentimientos e ideas al elaborar una autobiografía con respecto a los vínculos consigo mismo y con el entorno familiar, escolar o comunitario."],"3":["Recupera recursos literarios de la lengua española para crear un texto libre que describa los vínculos con el entorno familiar, escolar o comunitario."]}},{"c":"Los géneros periodísticos y sus recursos para comunicar sucesos significativos familiares, escolares, comunitarios y sociales.","g":{"1":["Identifica sucesos significativos familiares, escolares, comunitarios y sociales que forman parte de la memoria colectiva y los comunica haciendo uso de las características de los géneros periodísticos informativos."],"2":["Investiga un evento familiar, escolar o comunitario significativo de la memoria colectiva, para comunicarlo utilizando las características de los géneros periodísticos de opinión."],"3":["Analiza los sucesos más significativos de la comunidad y los comunica empleando las características de los géneros periodísticos de interpretación, para preservar la memoria colectiva."]}},{"c":"Comunicación asertiva y dialógica para erradicar expresiones de violencia.","g":{"1":["Realiza, de manera colectiva, una propuesta oral o por escrito, para promover acciones que posibiliten erradicar la violencia en las familias y la escuela.","Elabora solicitudes de gestión de espacios y recursos para dar a conocer la propuesta."],"2":["Participa en un debate acerca de algunas expresiones de violencia -como la de género y la sexual- para argumentar una postura de rechazo.","Elabora invitaciones a expertos y redacta oficios de gestión para obtener recursos y espacios donde tendrá lugar el encuentro."],"3":["Discute de forma colectiva y diseña una estrategia sobre la importancia de sensibilizar a la comunidad acerca de la violencia.","Redacta un texto informativo acerca de la importancia de erradicar la violencia y realiza de manera formal las gestiones necesarias para compartirlo con la comunidad."]}},{"c":"Mensajes para promover una vida saludable, expresados en medios comunitarios o masivos de comunicación.","g":{"1":["Identifica las características y recursos de mensajes que promueven una vida saludable a través de los diferentes medios comunitarios o masivos de comunicación impresos o audiovisuales."],"2":["Elabora un mensaje impreso empleando imágenes, textos, colores y otros recursos gráficos, para favorecer una vida saludable, y lo comparte en la comunidad."],"3":["Construye narrativas acerca de una vida saludable, haciendo uso del lenguaje audiovisual y las transmite por medios comunitarios o masivos de comunicación."]}},{"c":"Textos de divulgación científica.","g":{"1":["Identifica las características del texto de divulgación científica y elabora uno."],"2":["Analiza las características del texto de divulgación científica, para elaborar y dar a conocer diversos textos científicos orales o escritos que traten sobre un tema de interés personal o colectivo."],"3":["Elabora una propuesta de divulgación científica, con la participación de la comunidad escolar, para fomentar el conocimiento de las ciencias."]}},{"c":"Manifestaciones culturales y artísticas que favorecen una sociedad incluyente.","g":{"1":["Reconoce manifestaciones culturales y artísticas creadas o ejecutadas por personas con alguna discapacidad, para distinguir sus valores estéticos y creativos y las comparte en forma oral o escrita con la comunidad."],"2":["Elabora un texto oral o escrito acerca de las manifestaciones culturales y artísticas que promuevan una sociedad incluyente."],"3":["Crea un texto literario que aborde un tema que promueva una sociedad incluyente."]}}],"lim":[{"c":"La diversidad de lenguas indígenas y su uso en la comunicación familiar, escolar y comunitaria.","g":{"1":["Reconoce la diversidad de lenguas indígenas existentes en México y América Latina."],"2":["Comprende las características culturales (cosmovisión) de la lengua indígena de su contexto y de otras lenguas indígenas nacionales, utilizando la relación lengua-cultura."],"3":["Analiza y reconoce procesos de pérdida o desplazamiento de la lengua indígena de su contexto, de otras lenguas indígenas nacionales y compara con la situación de otras lenguas indígenas de América Latina y el mundo."]}},{"c":"La diversidad étnica, cultural y lingüística de México en peligro.","g":{"1":["Comprende las ideas centrales y secundarias de textos relacionados con el análisis del racismo y las relaciones interétnicas en la sociedad mexicana, para comentarlas en forma oral y escrita en la lengua indígena (variante lingüística) de su contexto."],"2":["Analiza textos que aborden críticamente el racismo, así como las relaciones entre los Estados nacionales y los pueblos indígenas de México, para comparar con la situación de otros pueblos en América Latina y el mundo.","Utiliza diversos portadores de texto o recursos audiovisuales para compartir las reflexiones en torno al racismo existente en México y América Latina."],"3":["Comprende analíticamente distintas visiones en torno al diálogo intercultural y la construcción de relaciones equitativas de convivencia entre culturas, así como el papel del conflicto y su resolución como base de la construcción de paz.","Comparte una propuesta creativa propia en la que valore y promueva textos en la lengua indígena de su contexto, a favor de una sociedad intercultural."]}},{"c":"Las lenguas indígenas como manifestación de la identidad y del sentido de pertenencia.","g":{"1":["Describe cómo el lenguaje oral manifiesta las identidades personal y colectiva, para reconocer procesos de transmisión o ruptura de la lengua indígena (variante lingüística) de su contexto en su árbol genealógico."],"2":["Comprende y redacta textos narrativos sobre la construcción de su identidad personal y familiar, así como el sentido de pertenencia, a partir de las tensiones entre el español y la lengua (variante lingüística) indígena de su contexto."],"3":["Elabora textos argumentativos sobre la situación de las lenguas indígenas en relación con el español y propone acciones para reconstruir la lealtad lingüística en las y los adolescentes indígenas."]}},{"c":"El dinamismo de las lenguas indígenas y su relevancia como patrimonio cultural.","g":{"1":["Analiza, en textos orales y/o escritos en la lengua indígena de su contexto, neologismos, juegos de lenguajes, caló, jerga, préstamos lingüísticos y extranjerismos, como parte del dinamismo de las lenguas indígenas."],"2":["Reconoce cambios temporales y geográficos en la lengua indígena (variante lingüística) de su contexto en la comunidad y el país.","Registra estos cambios a través de videos, audios, textos, poemas, cantos, entre otros."],"3":["Identifica y expresa el trayecto histórico que ha tenido la lengua indígena (variante lingüística) de su contexto y la relevancia de valorarla como legado de la comunidad.","Comparte este legado usando un lenguaje artístico."]}},{"c":"Creaciones literarias tradicionales y contemporáneas en la lengua indígena (variante lingüística) de su contexto.","g":{"1":["Recupera y clasifica creaciones literarias de la comunidad o de un lugar de interés, como poemas, mitos, leyendas, fábulas, epopeyas, cantares de gesta, refranes, coplas, canciones, corridos y juegos de palabras, entre otras, para promover de manera creativa su lectura."],"2":["Valora textos literarios tradicionales y contemporáneos, como cuentos, novelas, poemas y textos dramáticos; los adapta a otros lenguajes para sensibilizar a la comunidad acerca de la relevancia social y cultural de la literatura en lenguas indígenas."],"3":["Crea textos narrativos, poéticos, dramáticos y guiones para audiovisuales, entre otros, a partir del uso de recursos literarios, para exponer una situación real o ficticia en la lengua indígena (variante lingüística) de su contexto."]}},{"c":"Estudio de la lengua indígena (variante lingüística) del contexto a través de prácticas sociales relacionadas con el territorio como espacio vital I.","g":{"1":["Comprende las prácticas sociales en torno a la tierra como madre y como territorio y el uso de la lengua indígena (variante lingüística) del contexto en tales prácticas."],"2":["Redacta textos o graba audios en torno a las prácticas sociales relacionadas con el territorio y el uso de la lengua indígena (variante lingüística) del contexto en tales prácticas."],"3":["Crea textos literarios de distintos géneros o grabación de estos, en torno a las prácticas sociales relacionadas con el territorio y el uso de la lengua indígena (variante lingüística) en tales textos."]}},{"c":"Estudio de la lengua indígena (variante lingüística) del contexto a través de prácticas sociales relacionadas con la tierra como madre y como territorio II.","g":{"1":["Reconoce las relaciones entre elementos del territorio y el uso de la lengua indígena (variante lingüística) del contexto para narrarlos en textos orales de distintos géneros."],"2":["Identifica y analiza las características y los recursos estéticos de la lengua indígena (variante lingüística) del contexto, en la producción de textos orales de distintos géneros en torno a la tierra como madre y como territorio."],"3":["Comprende las prácticas sociales en torno a la Madre Tierra como elemento simbólico y al territorio, y el uso de la lengua indígena (variante lingüística) del contexto para recrearlas y producir nuevas."]}},{"c":"Estudio de la lengua indígena (variante lingüística) del contexto a través de prácticas sociales relacionadas con el trabajo comunitario (tequio) como construcción de relaciones sociales I.","g":{"1":["Reconoce el uso de la lengua indígena (variante lingüística) del contexto en torno al trabajo comunitario (tequio), para realizar narraciones en textos orales de distintos géneros."],"2":["Analiza el uso de la lengua indígena (variante lingüística) del contexto en el trabajo comunitario (tequio), para caracterizar las relaciones sociales y redactar los resultados de su análisis."],"3":["Elabora un ensayo en la lengua indígena (variante lingüística) del contexto sobre el trabajo comunitario (tequio)."]}},{"c":"Estudio de la lengua indígena (variante lingüística) del contexto a través de prácticas sociales relacionadas con el trabajo comunitario (tequio) como construcción de relaciones sociales II.","g":{"1":["Recupera y clasifica mitos, leyendas, fábulas, epopeyas, consejos, dichos, coplas, canciones, corridos y juegos de palabras, entre otros, en torno al trabajo comunitario para promover el uso de la lengua indígena (variante lingüística) del contexto."],"2":["Analiza el plano semántico de la lengua indígena (variante lingüística) del contexto en mitos, leyendas, fábulas, epopeyas, consejos, dichos, coplas, canciones, corridos y juegos de palabras, entre otros, en torno al trabajo comunitario."],"3":["Produce textos como canciones, corridos y juegos de palabras, entre otros, en torno al trabajo comunitario en la lengua indígena (variante lingüística) del contexto."]}},{"c":"Estudio de la lengua indígena (variante lingüística) del contexto a través de prácticas sociales en torno a la milpa como sistema de significación material y simbólico.","g":{"1":["Reconoce el uso de la lengua indígena (variante lingüística) del contexto en relación con la milpa, para realizar narraciones en textos orales de distintos géneros."],"2":["Identifica y analiza las características y mecanismos de funcionamiento de la milpa para producir textos orales o escritos en la lengua indígena (variante lingüística) del contexto."],"3":["Produce textos orales o escritos en la lengua indígena (variante lingüística) del contexto, en torno a la dimensión simbólicacosmogónica de la milpa."]}},{"c":"Estudio de la lengua indígena (variante lingüística) del contexto a través de prácticas sociales relacionadas con la ritualidad como expresión comunal.","g":{"1":["Reconoce el uso de la lengua indígena (variante lingüística) del contexto en torno a la ritualidad como expresión comunal, para realizar narraciones en textos orales de distintos géneros."],"2":["Analiza el lenguaje ritual como género discursivo y sus diferencias con el uso cotidiano de la lengua indígena (variante lingüística) del contexto, para redactar textos de distintos géneros, como poemas, cuentos o ensayos."],"3":["Produce y pone en marcha dramatizaciones de textos escritos en la lengua indígena (variante lingüística) del contexto, en torno al lenguaje ritual (teatro comunitario)."]}},{"c":"Estudio de la lengua indígena (variante lingüística) del contexto a través de prácticas sociales relacionadas con la fiesta como expresión comunal.","g":{"1":["Reconoce las relaciones entre las fiestas comunales y la construcción de la identidad colectiva, mediante el uso de la lengua indígena (variante lingüística) del contexto, para narrarlas en textos orales."],"2":["Analiza el uso de la lengua indígena (variante lingüística) del contexto en torno a la fiesta como expresión comunal y redacta los resultados de su análisis."],"3":["Elabora una historieta, cómic o manga en la lengua indígena (variante lingüística) del contexto sobre las fiestas de su pueblo como expresión comunal."]}},{"c":"Estudio de la lengua indígena (variante lingüística) del contexto a través de prácticas sociales que se consideren relevantes.","g":{"1":["Conoce y usa la lengua indígena (variante lingüística) del contexto."],"2":["Reconoce y analiza la práctica social relevante en la lengua indígena (variante lingüística) del contexto."],"3":["Produce y recrea textos en la lengua indígena (variante lingüística) del contexto sobre la práctica social relevante."]}},{"c":"Estudio de la lengua indígena (variante lingüística) del contexto en sus componentes estructurales.","g":{"1":["Conoce y reflexiona sobre los componentes de la lengua indígena (variante lingüística) del contexto en los planos: fonético-fonológico, morfológico, sintáctico, semántico y pragmático de la lengua indígena."],"2":["Conoce y reflexiona sobre los componentes de la lengua indígena (variante lingüística) del contexto en los planos: fonético-fonológico, morfológico, sintáctico, semántico y pragmático de la lengua indígena."],"3":["Conoce y reflexiona sobre los componentes de la lengua indígena (variante lingüística) del contexto en los planos: fonético-fonológico, morfológico, sintáctico, semántico y pragmático de la lengua indígena."]}}],"lis":[{"c":"La diversidad lingüística y sus formas de expresión en México y el mundo.","g":{"1":["Hace uso del alfabeto, los números y las expresiones básicas de la lengua indígena (variante lingüística) del contexto, para nombrar y recuperar datos factuales y características básicas de lenguas indígenas en México y el mundo."],"2":["Comprende textos narrativos y biográficos en la lengua indígena (variante lingüística) del contexto sobre vida cotidiana, formas de interacción y comportamiento de hablantes de diversas lenguas de México y el mundo en el pasado, expresados en organizadores gráficos."],"3":["Utiliza diversos tipos de texto y medios de comunicación, para expresar y difundir en lengua indígena (variante lingüística), prácticas culturales y lingüísticas diversas de sociedades en México y el mundo."]}},{"c":"La identidad y cultura de la lengua indígena (variante lingüística) del contexto escolar.","g":{"1":["Recupera información para llevar a cabo presentaciones orales y escritas en la lengua indígena (variante lingüística) del contexto, para describir rasgos étnicos, culturales e identitarios de los hablantes de esa lengua, como sus abuelos y abuelas."],"2":["Elabora fichas informativas en la lengua indígena (variante lingüística) del contexto, sobre rasgos identitarios de pueblos indígenas de México y el mundo (acento, grafía, vestimenta, comida, tradiciones y costumbres, entre otros)."],"3":["Construye una propuesta de comunicación oral y escrita en la lengua indígena (variante lingüística) del contexto, en la que contraste, valore y promueva rasgos de una sociedad intercultural."]}},{"c":"Las manifestaciones culturales, lingüísticas y artísticas en la lengua indígena (variante lingüística) del contexto, a favor de la interculturalidad.","g":{"1":["Elabora una historieta, cómic o manga en la lengua indígena (variante lingüística) que aborde situaciones donde se rescata la importancia de la interculturalidad."],"2":["Interpreta juegos de roles en la lengua indígena (variante lingüística) que planteen situaciones que favorezcan la comunicación asertiva."],"3":["Elabora guiones en la lengua indígena (variante lingüística) que traten sobre situaciones de conflicto resueltos mediante la comunicación asertiva e intercultural, y los dramatiza."]}},{"c":"El uso de la lengua indígena (variante lingüística) del contexto para expresar necesidades, intereses y problemas de la comunidad.","g":{"1":["Investiga en textos soluciones implementadas a problemas de una comunidad e informa de manera oral o escrita sus hallazgos en la lengua indígena (variante lingüística) del contexto."],"2":["Elabora escritos argumentativos en la lengua indígena (variante lingüística) del contexto que propongan acciones colectivas y que posibiliten la solución de problemas de una comunidad."],"3":["Organiza una campaña en la lengua indígena (variante lingüística) del contexto sobre soluciones a problemas de la comunidad."]}},{"c":"Creaciones literarias tradicionales y contemporáneas en la lengua indígena (variante lingüística) de su contexto.","g":{"1":["Selecciona textos literarios en la lengua indígena (variante lingüística) de su contexto que aborden temas de la comunidad o de algún lugar de interés, los resume y difunde por distintos medios."],"2":["Investiga en textos literarios sobre pueblos indígenas y/o afrodescendientes de México o el mundo.","Elabora por escrito en la lengua indígena (variante lingüística) de su contexto una apreciación sobre la relevancia y el valor social y cultural de los pueblos indígenas y/o afrodescendientes de México o el mundo."],"3":["Crea textos breves en la lengua indígena (variante lingüística) de su contexto, para exponer una situación o tema de interés con recursos narrativos, poéticos, visuales, escénicos o musicales."]}},{"c":"La lengua indígena (variante lingüística) de su contexto para expresar sensaciones, emociones, sentimientos e ideas vinculados con las familias, la escuela y la comunidad.","g":{"1":["Lleva a cabo juegos del lenguaje en la lengua indígena (variante lingüística) de su contexto para expresar sensaciones, emociones, sentimientos e ideas sobre las familias y la escuela."],"2":["Realiza entrevistas en la lengua indígena (variante lingüística) de su contexto para recuperar opiniones acerca de emociones, sentimientos e ideas sobre la escuela y la comunidad."],"3":["Investiga y recupera manifestaciones culturales y artísticas de su comunidad indígena de origen para difundirlas en la lengua indígena (variante lingüística) de su contexto."]}},{"c":"Comunicación asertiva y dialógica en la lengua indígena (variante lingüística) de su contexto, para sensibilizar sobre la erradicación del racismo y la discriminación.","g":{"1":["Recupera, de distintas fuentes, expresiones de racismo presentes en su entorno.","Reflexiona y comunica de forma oral y escrita una postura de rechazo al racismo en la lengua indígena (variante lingüística) de su contexto, mediante la comunicación asertiva y dialógica."],"2":["Participa en un panel en la lengua indígena (variante lingüística) de su contexto, sobre la importancia de la comunicación asertiva y dialógica, a fin de consensuar propuestas de acción para sensibilizar sobre la erradicación del racismo."],"3":["Diseña y difunde en la lengua indígena (variante lingüística) de su contexto propuestas escritas, para sensibilizar a la comunidad acerca de la importancia de erradicar el racismo."]}},{"c":"El uso de la lengua indígena (variante lingüística) de su contexto, en la construcción de mensajes a favor de la inclusión.","g":{"1":["Investiga en diversas fuentes sobre las características de los mensajes que presentan información a favor de la interacción, sensibilización y empatía con la diversidad y expone su punto de vista en la lengua indígena (variante lingüística) de su contexto."],"2":["Analiza las características y recursos empleados de la comunicación asertiva y sugiere su uso en un texto pequeño escrito en la lengua indígena (variante lingüística) de su contexto, para favorecer una sociedad incluyente."],"3":["Construye un proyecto en la lengua indígena (variante lingüística) de su contexto, para valorar la diversidad y fomentar la inclusión social en su entorno."]}},{"c":"El uso de la lengua indígena (variante lingüística) de su contexto, en las manifestaciones culturales y artísticas que favorecen la construcción de una sociedad incluyente.","g":{"1":["Elabora semblanzas en la lengua indígena (variante lingüística) de su contexto sobre personas indígenas destacadas por contribuir a la cultura y las artes, y las difunde."],"2":["Investiga, reflexiona y expone en la lengua indígena (variante lingüística) de su contexto, sobre las acciones de la sociedad y del gobierno que deben favorecer la construcción de una sociedad incluyente."],"3":["Crea en la lengua indígena (variante lingüística) de su contexto, alguna manifestación artística que aborde las acciones que la sociedad y el gobierno deben hacer para favorecer la construcción de una sociedad incluyente."]}},{"c":"La lengua indígena (variante lingüística) del contexto a través de una práctica cultural que se considere relevante, ya sea de la comunidad de origen o de nuevas prácticas I.","g":{"1":["Entrevista a personas de la comunidad y narra sucesos significativos en torno a la práctica cultural relevante en la lengua indígena (variante lingüística) del contexto."],"2":["Investiga en torno a la práctica cultural relevante en la lengua indígena (variante lingüística) del contexto."],"3":["Recuperar acontecimientos históricos en torno a la práctica cultural relevante de la lengua indígena (variante lingüística) del contexto."]}},{"c":"La lengua indígena (variante lingüística) del contexto a través de una práctica cultural que se considere relevante, ya sea de la comunidad de origen o de nuevas prácticas II.","g":{"1":["Obtiene información en torno a las prácticas culturales de la lengua indígena (variante lingüística) del contexto."],"2":["Indaga y construye propuestas para valorar la práctica cultural relevante de la lengua indígena (variante lingüística) del contexto."],"3":["Participa en debates en la lengua indígena (variante lingüística) del contexto respecto a la práctica cultural que se considera relevante."]}},{"c":"La lengua indígena (variante lingüística) del contexto a través de una práctica cultural que se considere relevante, ya sea de la comunidad de origen o de nuevas prácticas III.","g":{"1":["Realiza una lectura crítica y emite su opinión en la lengua indígena (variante lingüística) del contexto respecto a la práctica cultural relevante."],"2":["Investiga y difunde en lengua indígena (variante lingüística) del contexto su lectura crítica de la práctica cultural relevante."],"3":["Crea textos breves en la lengua indígena (variante lingüística) del contexto, en torno a la práctica cultural que se considera relevante."]}},{"c":"La lengua indígena (variante lingüística) del contexto a través de una práctica cultural que se considere relevante, ya sea de la comunidad de origen o de nuevas prácticas IV.","g":{"1":["Entrevista a personas y narra sucesos significativos en torno a las prácticas culturales de la lengua indígena (variante lingüística) del contexto."],"2":["Investiga y narra sucesos significativos en torno a las prácticas culturales de la lengua indígena (variante lingüística) del contexto."],"3":["Recupera acontecimientos históricos en torno a las prácticas culturales de la lengua indígena (variante lingüística) del contexto."]}}],"ing":[{"c":"La diversidad lingüística y sus formas de expresión en México y el mundo.","g":{"1":["Hace uso del alfabeto, los números y las expresiones básicas en inglés, para nombrar y recuperar datos factuales y características básicas de lenguas reconocidas en México y el mundo."],"2":["Comprende textos narrativos y biográficos en inglés sobre la vida cotidiana, formas de interacción y comportamiento de hablantes de diversas lenguas de México y el mundo en el pasado, y lo expresa en organizadores gráficos, infografías u otras formas de presentación escrita y oral."],"3":["Utiliza diversos tipos de texto y medios de comunicación para expresar y difundir en inglés prácticas culturales y lingüísticas diversas de sociedades en México y el mundo."]}},{"c":"La identidad y cultura de pueblos de habla inglesa.","g":{"1":["Recupera información para llevar a cabo presentaciones en inglés, orales y escritas, que describan rasgos étnicos, culturales e identitarios de hablantes de lengua inglesa."],"2":["Elabora fichas informativas en inglés sobre rasgos identitarios de pueblos de habla inglesa (acento, grafía, vestimenta, comida, tradiciones, costumbres, entre otros)."],"3":["Construye una propuesta de comunicación en inglés, oral y escrita, donde contraste, valore y promueva rasgos de una sociedad intercultural identificados en pueblos de habla inglesa."]}},{"c":"Las manifestaciones culturales, lingüísticas y artísticas en inglés a favor de la interculturalidad.","g":{"1":["Elabora un cómic o manga en inglés sobre situaciones donde se rescata la importancia de la interculturalidad."],"2":["Interpreta juegos de roles en inglés sobre situaciones que favorezcan la comunicación asertiva."],"3":["Elabora guiones en inglés que aborden situaciones de conflicto resueltas mediante la comunicación asertiva e intercultural, y los dramatiza."]}},{"c":"Uso de diversos textos en inglés que promueven la preservación y conservación de las lenguas.","g":{"1":["Recupera estrategias acerca de la conservación y preservación de las lenguas, planteadas en textos informativos y científicos en inglés, y las difunde."],"2":["Indaga y construye propuestas en inglés para conservar y preservar las lenguas, como legado y sentido de pertenencia, y las difunde por algún medio de comunicación."],"3":["Participa en un debate en inglés sobre los cambios lingüísticos y culturales de las lenguas en el transcurso del tiempo, y su impacto en la conformación de nuevas prácticas sociales."]}},{"c":"El uso del inglés para expresar necesidades, intereses y problemas de la comunidad.","g":{"1":["Investiga en textos en inglés soluciones implementadas sobre problemas de una comunidad, e informa de manera oral o escrita sus hallazgos."],"2":["Elabora escritos argumentativos en inglés sobre acciones colectivas que posibiliten la solución de problemas de una comunidad."],"3":["Organiza una campaña en inglés sobre soluciones a problemas de la comunidad."]}},{"c":"Elementos y recursos estéticos del inglés.","g":{"1":["Recupera de distintos tipos de textos literarios en inglés, expresiones, elementos y recursos estéticos y elabora un glosario."],"2":["Identifica y explica el uso de expresiones, elementos y recursos estéticos en manifestaciones culturales y artísticas de países de habla inglesa."],"3":["Emplea algunas figuras retóricas, elementos y recursos estéticos, para construir un texto literario corto, oral y escrito, para difundirlo en la comunidad escolar."]}},{"c":"Manifestaciones artísticas y culturales del inglés.","g":{"1":["Realiza una lectura crítica y emite su opinión en inglés sobre diversas manifestaciones culturales y artísticas de pueblos de habla inglesa."],"2":["Selecciona alguna manifestación artística o cultural y la difunde en inglés, mediante diversos elementos y recursos artísticos."],"3":["Crea poemas cortos a partir del uso de recursos estéticos del inglés en producciones orales y escritas, para difundirse en la comunidad escolar."]}},{"c":"Creaciones literarias tradicionales y contemporáneas en inglés.","g":{"1":["Selecciona textos literarios en inglés que aborden temas de la comunidad o de algún lugar de interés, los resume y difunde por distintos medios."],"2":["Investiga en textos literarios en inglés sobre pueblos indígenas y/o afrodescendientes de México o el mundo.","Elabora por escrito una apreciación sobre la relevancia y el valor social y cultural de los pueblos indígenas y/o afrodescendientes de México o el mundo."],"3":["Crea textos breves en inglés para exponer una situación o tema de interés, con recursos narrativos, poéticos, visuales, escénicos o musicales."]}},{"c":"El inglés para expresar sensaciones, emociones, sentimientos e ideas vinculados con las familias, la escuela y la comunidad.","g":{"1":["Lleva a cabo juegos del lenguaje en inglés para expresar sensaciones, emociones, sentimientos e ideas sobre las familias y la escuela."],"2":["Realiza entrevistas en inglés para recuperar opiniones acerca de emociones, sentimientos e ideas sobre la escuela y la comunidad."],"3":["Investiga y recupera manifestaciones culturales y artísticas de su comunidad, para difundirlas en inglés."]}},{"c":"Relatos en inglés para expresar sucesos significativos familiares, escolares, comunitarios y sociales.","g":{"1":["Entrevista y narra en inglés sucesos significativos familiares, escolares, comunitarios o sociales recuperados de la memoria colectiva."],"2":["Investiga un acontecimiento familiar, escolar o comunitario significativo, recuperado de la memoria colectiva, para redactar una reflexión en inglés."],"3":["Recupera un acontecimiento histórico comunitario y elabora un texto oral y escrito en inglés, para expresar su postura, haciendo uso de recursos visuales o auditivos."]}},{"c":"Comunicación asertiva y dialógica en inglés, para sensibilizar sobre la erradicación de la violencia en las familias y la escuela.","g":{"1":["Recupera de distintos textos en inglés, expresiones de violencia presentes en las familias y las escuelas.","Reflexiona y comunica de forma oral y escrita una postura de rechazo a la violencia, mediante la comunicación asertiva y dialógica."],"2":["Participa en un panel o debate en inglés, sobre la importancia de la comunicación asertiva y dialógica, a fin de consensuar propuestas de acción para sensibilizar sobre la erradicación de la violencia en las familias y la escuela."],"3":["Diseña y difunde en inglés propuestas escritas para sensibilizar a la comunidad acerca de la importancia de erradicar la violencia."]}},{"c":"Mensajes en inglés en medios de comunicación masiva, que promuevan una vida saludable.","g":{"1":["Recupera en inglés mensajes que promuevan una vida saludable y los difunde de manera oral o escrita, a través de distintos medios de comunicación."],"2":["Investiga en diversas fuentes en inglés sobre una vida saludable, para construir un texto informativo y difundirlo a través de medios de comunicación."],"3":["Cuenta historias en inglés sobre ejemplos de vida saludable y las difunde mediante el uso de medios de comunicación, para sensibilizar a la comunidad."]}},{"c":"El uso del inglés en la construcción de mensajes a favor de la inclusión.","g":{"1":["Investiga en diversas fuentes en inglés las características de los mensajes que presentan información a favor de la interacción, sensibilización y empatía con la diversidad y expone su punto de vista."],"2":["Analiza las características y recursos empleados en la comunicación asertiva en inglés, y sugiere su uso para favorecer una sociedad incluyente."],"3":["Construye un proyecto en inglés para valorar la diversidad y fomentar la inclusión social en su entorno."]}},{"c":"El uso del inglés en las manifestaciones culturales y artísticas que favorecen la construcción de una sociedad incluyente.","g":{"1":["Elabora semblanzas en inglés sobre personas en condición de discapacidad, destacadas por contribuir a la cultural y las artes, y las difunde."],"2":["Investiga, reflexiona y expone en inglés acerca de los sistemas alternativos y aumentativos que favorecen el tránsito a una sociedad incluyente."],"3":["Crea en inglés alguna manifestación artística que aborde cómo los sistemas alternativos y aumentativos favorecen sociedades incluyentes."]}}],"art":[{"c":"Diversidad de lenguajes artísticos en la riqueza pluricultural de México y del mundo.","g":{"1":["Reconoce en manifestaciones artísticas de México y del mundo el uso del cuerpo, del espacio y del tiempo, para valorarlas como parte de la riqueza pluricultural."],"2":["Explora la creación de secuencias y patrones al identificar el uso de formas, colores, movimientos y sonidos, entre otros elementos de las artes, en manifestaciones artísticas de México y del mundo, para apreciar la riqueza pluricultural."],"3":["Experimenta con características de algunos estilos de los lenguajes artísticos, para representar la riqueza pluricultural de México y del mundo."]}},{"c":"Manifestaciones culturales y artísticas que conforman la diversidad étnica, cultural y lingüística.","g":{"1":["Identifica diferentes manifestaciones culturales y artísticas de pueblos indígenas y afrodescendientes de México y del mundo, para interpretar significados que permitan fomentar una sociedad intercultural."],"2":["Compara el uso de formas, colores, movimientos y sonidos, entre otros elementos de las artes, en manifestaciones culturales y artísticas de diferentes épocas y orígenes culturales, para fomentar una sociedad intercultural."],"3":["Presenta una propuesta creativa, usando intencionalmente el cuerpo, espacio y tiempo, entre otros elementos de las artes, para valorar y promover la diversidad étnica, cultural y lingüística, a favor de una sociedad intercultural."]}},{"c":"Identidad y sentido de pertenencia en manifestaciones artísticas.","g":{"1":["Aprecia la intención expresiva en diversas manifestaciones artísticas, para la construcción crítica de las identidades personal y colectiva."],"2":["Reflexiona sobre la manera en que las artes fortalecen la identidad, dan sentido de pertenencia y resultan esenciales para favorecer la interculturalidad crítica."],"3":["Crea propuestas artísticas utilizando intencionalmente características de algunos estilos artísticos, a favor de la interculturalidad crítica, para fortalecer las identidades personal y colectiva."]}},{"c":"Patrimonio cultural de la comunidad en manifestaciones artísticas que fomentan la identidad y el sentido de pertenencia.","g":{"1":["Interpreta manifestaciones artísticas del patrimonio cultural de la comunidad y de México, para fomentar las identidades personal y colectiva, así como el sentido de pertenencia."],"2":["Expresa, mediante lenguajes artísticos, la relevancia de valorar, conservar y preservar el patrimonio cultural, como legado que le otorga identidad y sentido de pertenencia."],"3":["Reinterpreta de manera respetuosa manifestaciones artísticas del patrimonio cultural, para valorar su identidad y sentido de pertenencia."]}},{"c":"Los lenguajes artísticos en la expresión de problemas de la comunidad.","g":{"1":["Usa intencionalmente formas, colores, movimientos y sonidos, entre otros elementos de las artes, para recrear una situación problemática de su contexto y manifestar una postura crítica."],"2":["Investiga propuestas artísticas colectivas de entornos rurales y urbanos a favor de la inclusión, para presentar una postura crítica sobre un problema de la comunidad."],"3":["Experimenta con técnicas artísticas y elige una que implemente en un proyecto escolar creativo, para imaginar y proponer posibles soluciones a problemas de la comunidad."]}},{"c":"Elementos de las artes y recursos estéticos apreciados en el entorno natural y social, así como en diversas manifestaciones artísticas.","g":{"1":["Identifica el uso intencional del cuerpo, del espacio y del tiempo en manifestaciones artísticas, para apreciar e interpretar sus sentidos y significados.","Percibe cualidades estéticas en el entorno natural y social, para interpretar sus sentidos y significados."],"2":["Analiza el uso intencional de elementos de las artes y recursos estéticos como ritmo, repetición, armonía, contraste y variación, en manifestaciones artísticas, para emplearlos en una creación personal.","Reinterpreta los sentidos y significados de las cualidades estéticas del entorno natural y social en creaciones artísticas personales."],"3":["Usa intencionalmente figuras retóricas como metáforas, hipérboles, sinécdoques, aliteraciones, en creaciones artísticas colectivas, para representar situaciones vinculadas a la comunidad.","Interviene el entorno natural y social, mediante el uso de los lenguajes artísticos, para expresar un mensaje a favor del cuidado del medioambiente."]}},{"c":"Valor estético de la naturaleza, de la vida cotidiana y de diferentes manifestaciones culturales y artísticas.","g":{"1":["Disfruta de manifestaciones culturales y artísticas de la comunidad y de otros lugares, para reconocer sus gustos e intereses estéticos.","Disfruta los valores estéticos presentes en la naturaleza para apreciarla y expresarla."],"2":["Investiga diversas manifestaciones culturales y artísticas para expresar un juicio estético y lo difunde en la comunidad escolar.","Emite un juicio estético sobre un episodio significativo de la vida cotidiana y lo difunde en la comunidad escolar."],"3":["Identifica algunas categorías estéticas como lo bello, lo sublime, lo grotesco, lo trágico, lo cómico y lo siniestro, al apreciarlas en manifestaciones culturales y artísticas, para argumentar sus juicios estéticos y difundirlos en la comunidad.","Identifica algunas categorías estéticas como lo bello, lo sublime, lo grotesco, lo trágico, lo cómico y lo siniestro, al apreciarlas en la naturaleza y en la vida cotidiana, para compartir sus juicios estéticos y difundirlos en la comunidad."]}},{"c":"Creaciones artísticas que tienen su origen en textos literarios.","g":{"1":["Explora con formas, colores, movimientos, sonidos, entre otros elementos de las artes, para reinterpretar textos literarios de la comunidad u otros lugares, haciendo uso de diversos lenguajes artísticos."],"2":["Adapta textos literarios provenientes de culturas indígenas o afrodescendientes, experimentando con elementos de las artes y recursos estéticos como la repetición, ritmo, armonía, contraste y variación, para sensibilizar a la comunidad sobre las formas de expresión de los pueblos originarios."],"3":["Construye una narrativa personal o colectiva, a partir de un texto literario de su interés, empleando en forma artística cuerpo, espacio y tiempo."]}},{"c":"Expresión artística de sensaciones, emociones, sentimientos e ideas, a partir de experiencias familiares, escolares o comunitarias.","g":{"1":["Recrea lúdicamente sensaciones, emociones, sentimientos e ideas, mediante el uso del cuerpo, del espacio y del tiempo, para expresar la relación con su entorno familiar."],"2":["Explora con técnicas artísticas y elige una para apreciar, simbolizar y compartir sensaciones, emociones, sentimientos e ideas relacionados con el entorno escolar."],"3":["Usa intencionalmente características y funciones de algunos géneros artísticos, para crear una obra original que simbolice sus vínculos con la comunidad."]}},{"c":"Memoria colectiva representada por medios artísticos, para registrar experiencias comunitarias.","g":{"1":["Recupera de la memoria colectiva acontecimientos significativos de las familias, escuela o comunidad, para representarlos de manera creativa."],"2":["Reinterpreta, mediante características de algunos géneros artísticos, un acontecimiento familiar, escolar o comunitario significativo de la memoria colectiva."],"3":["Manifiesta una postura crítica sobre la memoria colectiva, acerca de un acontecimiento relevante para la comunidad, al hacer uso de los lenguajes artísticos."]}},{"c":"Procesos creativos que ponen en práctica la comunicación dialógica como estrategia para erradicar expresiones de violencia.","g":{"1":["Expresa, mediante elementos de las artes como las formas, colores, movimientos y sonidos, la relevancia del diálogo como una alternativa a las manifestaciones de violencia presentes en la familia, escuela y comunidad."],"2":["Imagina y comparte propuestas artísticas de acción para contribuir en la erradicación de la violencia en la familia, escuela y comunidad, haciendo uso de una comunicación abierta, respetuosa y empática con la diversidad."],"3":["Presenta al público una propuesta artística respetuosa y empática con la diversidad, a fin de sensibilizar a la comunidad acerca de la importancia del diálogo para erradicar la violencia en el entorno."]}},{"c":"Vida saludable expresada a través de mensajes construidos con elementos de las artes, para difundirlos por distintos medios de comunicación.","g":{"1":["Emplea intencionalmente formas, colores, movimientos, sonidos, entre otros elementos de las artes, para representar una vida saludable y la difunde por un medio de comunicación escolar."],"2":["Crea mensajes que promuevan una vida saludable, utilizando artísticamente formas, colores, movimientos y sonidos, entre otros elementos de las artes, para difundirlos por distintos medios de comunicación."],"3":["Construye una narrativa a favor de una vida saludable, mediante el uso artístico de distintos formatos como fotografía, historieta, secuencia corporal, secuencia sonora, entre otros, y la difunde por distintos medios de comunicación."]}},{"c":"Sistemas alternativos y aumentativos de comunicación como herramientas creativas que favorecen la inclusión.","g":{"1":["Identifica algunas características sensoriales de la Lengua de Señas Mexicana, el código Braille, los tableros de comunicación y otros sistemas alternativos y aumentativos, para fomentar la interacción, sensibilización y empatía con la diversidad."],"2":["Experimenta con sistemas alternativos y aumentativos de comunicación al usar artísticamente el cuerpo, espacio, tiempo, entre otros elementos de las artes, en una propuesta comunitaria que visibilice la diversidad y fomente la inclusión social."],"3":["Crea códigos que favorezcan la inclusión, a través del uso artístico de formas, colores, texturas, movimientos, gestos, sonidos, entre otros recursos que incorporen características de los sistemas alternativos y aumentativos."]}},{"c":"Manifestaciones artísticas que emplean sistemas alternativos y aumentativos de comunicación, elaboradas por personas en condición de discapacidad y/o diseñadas para ellas.","g":{"1":["Reconoce los valores estéticos y creativos de las manifestaciones artísticas realizadas por personas con alguna discapacidad, para fomentar la inclusión."],"2":["Aprecia y reflexiona acerca del uso de sistemas alternativos y aumentativos en manifestaciones artísticas diseñadas para personas en condición de discapacidad, a fin de favorecer el tránsito a una sociedad incluyente."],"3":["Presenta una creación artística en la que experimente con sistemas alternativos y aumentativos de comunicación, para favorecer el tránsito a una sociedad incluyente."]}}],"mat":[{"c":"Expresión de fracciones como decimales y de decimales como fracciones.","g":{"1":["Usa diversas estrategias al convertir números fraccionarios a decimales y viceversa."]}},{"c":"Extensión de los números a positivos y negativos y su orden.","g":{"1":["Reconoce la necesidad de los números negativos a partir de usar cantidades que tienen al cero como referencia.","Compara y ordena números con signo (enteros, fracciones y decimales) en la recta numérica y analiza en qué casos se cumple la propiedad de densidad."]}},{"c":"Extensión del significado de las operaciones y sus relaciones inversas.","g":{"1":["Reconoce el significado de las cuatro operaciones básicas y sus relaciones inversas al resolver problemas que impliquen el uso de números con signo.","Comprueba y argumenta si cada una de estas operaciones cumple las propiedades: conmutativa, asociativa y distributiva.","Identifica y aplica la jerarquía de operaciones y símbolos de agrupación al realizar cálculos."],"2":["Usa criterios de divisibilidad y números primos al resolver problemas que implican calcular el máximo común divisor y el mínimo común múltiplo.","Calcula potencias con exponente entero y la raíz cuadrada. Usa la notación científica.","Usa la notación científica al realizar cálculos con cantidades muy grandes o muy pequeñas."]}},{"c":"Regularidades y Patrones.","g":{"1":["Representa algebraicamente una sucesión con progresión aritmética de figuras y números."],"2":["Representa algebraicamente una sucesión con progresión cuadrática de figuras y números."]}},{"c":"Introducción al álgebra.","g":{"1":["Interpreta y plantea diversas situaciones del lenguaje común al lenguaje algebraico y viceversa.","Representa algebraicamente perímetros de figuras."],"2":["Representa algebraicamente áreas que generan una expresión cuadrática.","Identifica y usa las propiedades de los exponentes al resolver distintas operaciones algebraicas."],"3":["Representa algebraicamente áreas y volúmenes de cuerpos geométricos y calcula el valor de una variable en función de las otras."]}},{"c":"Ecuaciones lineales y cuadráticas.","g":{"1":["Resuelve ecuaciones de la forma Ax=B, Ax+B=C, Ax+B=Cx+D con el uso de las propiedades de la igualdad.","Modela y resuelve problemas cuyo planteamiento es una ecuación lineal.","Resuelve problemas de porcentajes en diversas situaciones."],"2":["Resuelve desigualdades con expresiones algebraicas.","Modela y soluciona sistemas de dos ecuaciones lineales con dos incógnitas por algún método para dar respuesta a un problema."],"3":["Resuelve ecuaciones de la forma Ax2+Bx+C=0 por factorización y fórmula general.","Resuelve problemas cuyo planteamiento es una ecuación cuadrática."]}},{"c":"Funciones.","g":{"1":["Relaciona e interpreta relaciones proporcional y no proporcional a partir de su representación tabular, gráfica y con diagramas.","Modela y resuelve diversas situaciones a través de ecuaciones proporcionales con constante positiva y negativa."],"2":["Relaciona e interpreta la proporcionalidad inversa de dos magnitudes o cantidades, además usa una tabla, gráfica o representación algebraica en diversos contextos."],"3":["Relaciona e interpreta la variación de dos cantidades a partir de su representación tabular, gráfica y algebraica.","Explora diversos procedimientos para resolver problemas de reparto proporcional."]}},{"c":"Rectas y ángulos.","g":{"1":["Explora las figuras básicas como rectas y ángulos y su notación.","Encuentra y calcula los ángulos que se forman al intersecar dos segmentos."],"2":["Identifica y usa las relaciones entre los ángulos, lados y diagonales para construir a escala triángulos, cuadriláteros y polígonos regulares o irregulares."]}},{"c":"Construcción y propiedades de las figuras planas y cuerpos.","g":{"1":["Utiliza la regla y el compás para trazar: punto medio, mediatriz de un segmento, segmentos y ángulos congruentes, bisectriz de un ángulo, rectas perpendiculares y rectas paralelas.","Identifica y traza las rectas notables en triángulos y cuadriláteros.","Construye y clasifica triángulos y cuadriláteros a partir del análisis de distinta información."],"2":["Construye con regla y compás polígonos regulares con distinta información.","Identifica y usa las relaciones entre figuras en la construcción de teselados."],"3":["Aplica las propiedades de la congruencia y semejanza de triángulos al construir y resolver problemas.","Reconoce las propiedades de los sólidos.","Explora la generación de sólidos de revolución a partir de figuras planas.","Explora y construye desarrollos planos de diferentes figuras tridimensionales, cilindros, pirámides y conos."]}},{"c":"Circunferencia, círculo y esfera.","g":{"1":["Identifica y traza las rectas notables en la circunferencia y las relaciones entre ellas.","Investiga figuras relacionadas con círculos y propiedades de los círculos.","Construye circunferencias a partir de distinta información.","Verifica los criterios de existencia y unicidad de estas figuras."],"2":["Determina la medida de ángulos inscritos y centrales, así como de arcos de circunferencia.","Explora las intersecciones entre círculos y figuras al calcular perímetros y áreas."],"3":["Explora y construye desarrollos planos de esferas.","Indaga la generación de esferas a partir de figuras planas.","Encuentra relaciones de volumen de la esfera, el cono y el cilindro."]}},{"c":"Medición y cálculo en diferentes contextos.","g":{"1":["Introduce la idea de distancia entre dos puntos como la longitud del segmento que los une.","Encuentra la distancia de un punto a una recta y la distancia entre dos rectas paralelas.","Explora la desigualdad del triángulo.","Obtiene y aplica fórmulas o usa otras estrategias para calcular el perímetro y el área de polígonos regulares e irregulares y del círculo."],"2":["Resuelve problemas que implican conversiones en múltiplos y submúltiplos del metro, litro, kilogramo y de unidades del sistema inglés (yarda, pulgada, galón, onza y libra).","Utiliza estrategias diversas para determinar el perímetro y el área de figuras compuestas."],"3":["Usa diferentes estrategias para calcular el volumen de prismas, pirámides y cilindros.","Formula, justifica y usa el teorema de Pitágoras al resolver problemas.","Resuelve problemas utilizando las razones trigonométricas seno, coseno y tangente."]}},{"c":"Obtención y representación de información.","g":{"1":["Usa tablas, gráficas de barras y circulares para el análisis de información."],"2":["Recolecta, registra, lee y comunica información mediante histogramas, gráficas poligonales y de línea."],"3":["Lee, interpreta y comunica información de cualquier tipo de gráficas."]}},{"c":"Interpretación de la información a través de medidas de tendencia central y de dispersión.","g":{"1":["Determina e interpreta la frecuencia absoluta, la frecuencia relativa, la media, la mediana y la moda en un conjunto de datos.","Usa e interpreta las medidas de tendencia central (moda, media aritmética y mediana) y el rango de un conjunto de datos, y justifica con base en ellas sus decisiones."],"2":["Usa e interpreta las medidas de tendencia central (moda, media aritmética y mediana) y de dispersión (rango y la desviación media) de un conjunto de datos, y justifica con base en ellas sus decisiones.","Identifica tendencias en los datos centrándose en sus valores representativos y sus variaciones."],"3":["Determina y compara las medidas de tendencia central (media, mediana y moda) y de dispersión (rango y desviación media) de dos conjuntos de datos para tomar decisiones."]}},{"c":"Azar y probabilidad","g":{"1":["Compara cualitativamente dos o más eventos a partir de sus resultados posibles, usa relaciones como: “es más probable que…”, “es menos probable que…”.","Identifica eventos en los que interviene el azar, determina el espacio muestral y experimenta.","Identifica diversos procedimientos de conteo y resuelve problemas."],"2":["Realiza experimentos aleatorios y registra los resultados en una tabla de frecuencia como la transición de la probabilidad frecuencial a la teórica.","Analiza las características de la medida de la probabilidad y su equivalencia y representación en números decimales, fraccionarios y porcentajes."],"3":["Resuelve problemas donde se analicen las características de eventos complementarios y eventos mutuamente excluyentes e independientes.","Resuelve problemas donde se calcule la probabilidad de ocurrencia de dos eventos mutuamente excluyentes y de eventos complementarios (regla de la suma).","Resuelve problemas donde se calcule la probabilidad de ocurrencia de dos eventos independientes (regla del producto).","Indaga las condiciones necesarias para que un juego de azar sea justo, con base en la noción de resultados equiprobables y no equiprobables."]}}],"bio":[{"c":"Funcionamiento del cuerpo humano coordinado por los sistemas nervioso y endocrino.","g":{"1":["Explica la participación de los sistemas nervioso y endocrino en la coordinación de las funciones del cuerpo humano; reconoce el papel general de las hormonas y sus efectos en la maduración sexual y en la reproducción.","Explica los efectos del consumo de sustancias adictivas en el sistema nervioso y en el funcionamiento integral del cuerpo humano; argumenta la importancia de evitar su consumo a partir del análisis de sus implicaciones en la salud, la sexualidad, la economía y la sociedad; comparte sus aprendizajes por distintos medios."]}},{"c":"Salud sexual y reproductiva: prevención de infecciones de transmisión sexual y del embarazo en adolescentes.","g":{"1":["Compara las maneras en que la cultura influye en el concepto de sexualidad; reconoce que todas las culturas tienen maneras distintas de comprender el género, la sexualidad y la reproducción; y reflexiona acerca de que el inicio de la actividad sexual debe ser de manera consensuada.","Cuestiona creencias, estereotipos y costumbres que impactan negativamente la salud sexual y reproductiva de niñas y mujeres; reconoce la importancia de la igualdad de género y la responsabilidad compartida del hombre y la mujer en la prevención del embarazo en la adolescencia como base para la toma de decisiones.","Compara la efectividad de los métodos anticonceptivos como apoyo para planificar el embarazo desde la perspectiva del proyecto de vida, con acompañamiento de los servicios amigables; valora la efectividad del condón por su doble protección: para prevenir el embarazo en adolescentes y disminuir el riesgo de infecciones de transmisión sexual."]}},{"c":"Prevención de enfermedades relacionadas con la alimentación y el consumo de alimentos ultraprocesados.","g":{"1":["Identifica causas de la obesidad y la diabetes relacionadas con la dieta y el sedentarismo, a fin de formular su proyecto de vida saludable; incluye factores protectores y propone acciones para reducir factores de riesgo, incluyendo su entorno familiar y comunitario.","Formula hipótesis acerca de las consecuencias de carencia o exceso de nutrimentos en la dieta; interpreta datos que muestran la correlación entre la incidencia de enfermedades como la caries e hipertensión y el consumo de exceso de sal, azúcar y grasas saturadas."]}},{"c":"La diversidad de saberes e intercambio de conocimientos acerca de los seres vivos y las relaciones con el medio ambiente.","g":{"1":["Reconoce la importancia de los conocimientos, prácticas e innovaciones de los pueblos originarios acerca de los seres vivos; intercambia vivencias y experiencias asociadas al aprovechamiento y la protección como el uso de la herbolaria, la milpa o la conservación de
