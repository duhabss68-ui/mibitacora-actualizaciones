 los bosques.","Explica por qué los saberes de los pueblos originarios han aportado al aprovechamiento de los recursos naturales en el ecosistema local; analiza sus contribuciones a la agricultura, el pastoreo y la pesca sustentables; comunica sus hallazgos usando diferentes lenguajes y representaciones."]}},{"c":"Los procesos vitales de los seres vivos: nutrición, relación con el medio y reproducción.","g":{"1":["Compara las características comunes de los seres vivos; identifica que todos tienen estructuras especializadas asociadas a la nutrición, la relación con el medio y la reproducción y los distingue como rasgos adaptativos que favorecen la sobrevivencia de las especies.","Clasifica organismos de acuerdo con características comunes asociadas a la nutrición y reproducción; propone hipótesis en torno a posibles relaciones de parentesco entre ellos y las contrasta con fuentes de consulta; reconoce que todas las clasificaciones tienen alcances y limitaciones."]}},{"c":"La biodiversidad como expresión del cambio de los seres vivos en el tiempo.","g":{"1":["Analiza información acerca del estado de la biodiversidad local a partir de fuentes directas, orales, escritas, audiovisuales o Internet, expone razones sobre su importancia cultural, biológica, estética y ética; propone acciones para su cuidado.","Indaga las principales aportaciones de Darwin y Wallace, las identifica como una de las explicaciones más fundamentadas acerca del origen de la biodiversidad y reflexiona acerca de cómo han cambiado; reconoce que los conocimientos científicos son un proceso en construcción permanente."]}},{"c":"El calentamiento global como una consecuencia de la alteración de los ciclos biogeoquímicos en los ecosistemas.","g":{"1":["Representa la transferencia de materia y energía entre los organismos de un ecosistema mediante redes y pirámides tróficas; elabora explicaciones, inferencias y predicciones consistentes con los modelos generados acerca de la pérdida o incremento de organismos en los eslabones.","Identifica interacciones de competencia e interdependencia en el ecosistema local y explica cómo regulan el funcionamiento y mantenimiento en la dinámica general del ecosistema.","Analiza las prácticas de consumo que han alterado los ciclos biogeoquímicos del carbono y el nitrógeno, sus efectos asociados al calentamiento global y sus impactos en el medio ambiente y la salud."]}},{"c":"Importancia del microscopio para el conocimiento de la unidad y la diversidad de los seres vivos.","g":{"1":["Compara cómo han cambiado las primeras observaciones microscópicas respecto de las actuales; valora el avance en el conocimiento de las bacterias, las células y los virus.","Describe las estructuras y funciones básicas de la célula a partir de modelos; explica la participación de la membrana y el citoplasma en las funciones de nutrición y relación, y del núcleo en la reproducción y la herencia.","Formula preguntas y contrasta explicaciones acerca de la manipulación genética; comparte sus hallazgos respecto de sus beneficios y riesgos en los ámbitos de la salud y el medio ambiente; participa en debates en los que defiende su postura."]}},{"c":"Las vacunas: su relevancia en el control de algunas enfermedades infecciosas.","g":{"1":["Describe las características generales de las bacterias y los virus; formula hipótesis en torno al por qué de la rápida propagación de las enfermedades infecciosas que causan, y las contrasta con evidencias reportadas en fuentes con sustento científico.","Valora la importancia y la necesidad de proteger la salud con el uso de las vacunas para el control de algunas enfermedades infecciosas; evalúa sus riesgos y beneficios sociales y económicos; reconoce la interacción de los conocimientos científicos y tecnológicos, sus alcances y limitaciones."]}}],"fis":[{"c":"El pensamiento científico, una forma de plantear y solucionar problemas y su incidencia en la transformación de la sociedad.","g":{"2":["Describe problemas comunes de la vida cotidiana explicando cómo se procede para buscarles solución; conoce y caracteriza el pensamiento científico para plantearse y resolver problemas en la escuela y su cotidianeidad.","Indaga en diferentes fuentes de consulta las aportaciones de mujeres y hombres en el desarrollo de la Física y su contribución al conocimiento científico y tecnológico a nivel nacional e internacional para valorar su influencia en la sociedad actual."]}},{"c":"Unidades y medidas utilizados en Física.","g":{"2":["Identifica las unidades de medición que se ocupan en su entorno escolar, familiar y en su comunidad.","Identifica cuáles son, cómo se definen y cuál es la simbología de las unidades básicas y derivadas del Sistema Internacional de Unidades.","Conoce los instrumentos de medición y realiza conversiones con los múltiplos y submúltiplos al referirse a una magnitud."]}},{"c":"Estructura, propiedades y características de la materia.","g":{"2":["Indaga sobre los saberes y prácticas del uso de materiales y sus propiedades y características para construcción, vestimenta y artefactos de uso común.","Relaciona e interpreta las teorías sobre estructura de la materia, a partir de los modelos atómicos y de partículas y los fenómenos que les dieron origen.","Explora algunos avances recientes en la comprensión de la constitución de la materia y reconoce el proceso histórico de construcción de nuevas teorías."]}},{"c":"Estados de agregación de la materia.","g":{"2":["Experimenta e interpreta los modelos atómicos y de partículas al proponer hipótesis que expliquen los tres estados de la materia, sus propiedades físicas como la temperatura de fusión, ebullición, densidad, entre otros.","Interpreta la temperatura y el equilibrio térmico con base en el modelo de partículas."]}},{"c":"Interacciones en fenómenos relacionados con la fuerza y el movimiento.","g":{"2":["Experimenta e interpreta las interacciones de la fuerza y el movimiento relacionados con las Leyes de Newton para explicar actividades cotidianas.","Identifica los elementos y los diferentes tipos de movimiento relacionados con la velocidad y aceleración y realiza experimentos sencillos.","Identifica y describe la presencia de fuerzas en interacciones cotidianas (fricción y fuerzas en equilibrio)."]}},{"c":"Principios de Pascal y de Arquímedes.","g":{"2":["Experimenta e interpreta las interacciones de la fuerza y el movimiento relacionados con los principios de Pascal y de Arquímedes, para explicar actividades cotidianas.","Identifica algunos dispositivos de uso cotidiano en los cuales se aplica el Principio de Pascal (sistemas de frenos hidráulicos, elevadores y gatos hidráulicos) y de Arquímedes (flotación de barcos, submarinos y globos aerostáticos, entre otros); colabora en equipo para proponer actividades experimentales y resolver problemas sencillos relativos a las propiedades de los fluidos."]}},{"c":"Saberes y prácticas para el aprovechamiento de energías y la sustentabilidad.","g":{"2":["Analiza las características de la energía mecánica (cinética y potencial) y describe casos donde se conserva.","Relaciona al calor como una forma de energía y describe los motores que funcionan con energía calorífica, los efectos del calor disipado y los gases expelidos y valora sus efectos en la atmósfera.","Identifica saberes, prácticas y artefactos sobre el aprovechamiento de las diversas formas de energía renovables y no renovables, su empleo y origen en su comunidad (solar, eólica, hidráulica, geológica, mareomotriz y nuclear) y valora sus beneficios.","Realiza experimentos en donde se aproveche la energía del Sol ya sea considerando las propiedades de la luz (energía solar) o las de la materia (convección)."]}},{"c":"Interacciones de la electricidad y el magnetismo.","g":{"2":["Experimenta e interpreta algunas manifestaciones y aplicaciones de la electricidad e identifica los cuidados que requiere su uso al revisar protocolos de seguridad.","Relaciona e interpreta fenómenos comunes del magnetismo y experimenta con la interacción entre imanes.","Experimenta e interpreta el comportamiento de la luz como resultado de la interacción entre electricidad y magnetismo.","Explica el funcionamiento de aparatos tecnológicos de comunicación, a partir de las ondas electromagnéticas."]}},{"c":"Composición del Universo y el Sistema Solar.","g":{"2":["Indaga algunos avances recientes en la comprensión sobre la evolución del Universo y su composición.","Indaga cómo se lleva a cabo la exploración de los cuerpos celestes, por medio de la detección y procesamiento de las ondas electromagnéticas que emiten.","Relaciona e interpreta las características y dinámica del Sistema Solar con la gravitación y el movimiento de los planetas, en particular el caso de la Tierra y la Luna."]}},{"c":"Fenómenos, procesos y factores asociados al cambio climático.","g":{"2":["Formula hipótesis que relacionan la actividad humana con el aumento de temperatura en el planeta y la emisión de gases de efecto invernadero; diferencia entre calor, radiación y temperatura al explicar los procesos que lo originan.","Diferencia entre calor, radiación y temperatura al explicar los procesos que originan el efecto invernadero.","Explica cómo la emisión de ciertos gases contribuye al efecto invernadero.","Indaga sobre fenómenos meteorológicos extremos como olas de calor, ciclones tropicales, sequías y lluvias torrenciales; representa y explica su distribución en el mundo.","Propone medidas de mitigación y adaptación, encaminadas al cuidado del medio ambiente y el bienestar común, viables para su aplicación en su escuela y comunidad."]}}],"qui":[{"c":"Los hitos que contribuyeron al avance del conocimiento científico y tecnológico en el ámbito nacional e internacional, así como su relación en la satisfacción de necesidades humanas y sus implicaciones en la naturaleza.","g":{"3":["Reconoce los aportes de saberes de diferentes pueblos y culturas en la satisfacción de necesidades humanas en diversos ámbitos (medicina, construcción, artesanías, textiles y alimentos).","Indaga en fuentes de consulta orales y escritas las aportaciones de mujeres y hombres en el desarrollo del conocimiento científico y tecnológico, para valorar su influencia en la sociedad actual.","Reflexiona acerca de los hábitos de consumo responsable a partir del análisis de las actividades relacionadas con el cuidado del medio ambiente a nivel personal, familiar y social, como base para la toma de decisiones orientadas a la sustentabilidad."]}},{"c":"Las propiedades extensivas e intensivas, como una forma de identificar sustancias y materiales de uso común, así como el aprovechamiento en actividades humanas.","g":{"3":["Formula hipótesis para diferenciar propiedades extensivas e intensivas mediante actividades experimentales y, con base en el análisis de resultados, elabora conclusiones.","Reconoce la importancia del uso de instrumentos de medición para identificar y diferenciar propiedades de sustancias y materiales cotidianos."]}},{"c":"Composición de las mezclas y su clasificación en homogéneas y heterogéneas, así como métodos de separación (evaporación, decantación, filtración, extracción, sublimación, cromatografía y cristalización) aplicados en diferentes contextos.","g":{"3":["Describe los componentes de una mezcla (soluto–disolvente; fase dispersa y fase dispersante) mediante actividades experimentales y las clasifica en homogéneas y heterogéneas en materiales de uso cotidiano.","Analiza la concentración de sustancias de una mezcla expresadas en porcentajes en masa y en volumen de distintos productos (higiene personal, alimentos y limpieza, entre otros) como base para la toma de decisiones orientadas al cuidado de la salud y al consumo responsable.","Deduce métodos para separar mezclas (evaporación, decantación, filtración, extracción, sublimación, cromatografía y cristalización) mediante actividades experimentales con base en las propiedades físicas de las sustancias involucradas, así como su funcionalidad en actividades humanas."]}},{"c":"Importancia de la concentración de sustancias en mezclas de productos de uso cotidiano.","g":{"3":["Analiza la concentración de sustancias de una mezcla expresadas en porcentaje en masa y porcentaje en volumen en productos de higiene personal, alimentos y limpieza, entre otros, para la toma de decisiones orientadas al cuidado de la salud y al consumo responsable.","Relaciona la concentración de una mezcla con la efectividad o composición de diversos productos de uso cotidiano."]}},{"c":"Presencia de contaminantes y su concentración, relacionada con la degradación y contaminación ambiental en la comunidad.","g":{"3":["Indaga situaciones problemáticas relacionadas con la degradación y contaminación en la comunidad, vinculadas con el uso de productos y procesos químicos.","Sistematiza la información de diferentes fuentes de consulta, orales y escritas, acerca de la concentración de contaminantes (partes por millón <ppm>) en aire, agua y suelo.","Diseña y lleva a cabo proyectos comunitarios con la intención de proponer medidas preventivas o alternativas de solución, factibles y sustentables para el cuidado de la salud y el medio ambiente."]}},{"c":"Mezclas, compuestos y elementos representados con el modelo corpuscular de la materia en sólidos, líquidos y gases, así como su caracterización mediante actividades experimentales.","g":{"3":["Explica semejanzas y diferencias de mezclas, compuestos y elementos, a partir de actividades experimentales y los clasifica en materiales de uso cotidiano.","Construye modelos corpusculares de mezclas, compuestos y elementos, a fin de comprender la estructura interna de los materiales en diferentes estados de agregación."]}},{"c":"La Tabla periódica: criterios de clasificación de los elementos químicos y sus propiedades (electronegatividad, energía de ionización y radio atómico).","g":{"3":["Reconoce la presencia y predominancia de algunos elementos químicos que conforman a los seres vivos, la Tierra y el Universo, así como su ubicación en la Tabla periódica: metales, no metales y semimetales.","Interpreta la información de la Tabla periódica ordenada por el número atómico, así como por grupos y periodos e identifica las propiedades periódicas de elementos representativos que permita inferir su comportamiento químico.","Construye modelos atómicos de Bohr –distribución de electrones en órbitas– con base en el número atómico de los primeros elementos químicos, con la intención de representar su conformación: protones, neutrones y electrones.","Representa los electrones de valencia de átomos de diferentes elementos químicos por medio de diagramas de Lewis y los relaciona con el grupo al que pertenecen en la Tabla periódica."]}},{"c":"Los compuestos iónicos y moleculares: propiedades y estructura, así como su importancia en diferentes ámbitos.","g":{"3":["Experimenta y diferencia los compuestos iónicos y moleculares, a partir de las propiedades identificadas en actividades experimentales; elabora conclusiones, inferencias y predicciones con base en la evidencia obtenida.","Analiza la formación y estructura de compuestos iónicos y moleculares, a partir de las propiedades de la Tabla periódica.","Valora el aprovechamiento de propiedades de compuestos iónicos y moleculares en el cuerpo humano y en diferentes ámbitos."]}},{"c":"Los alimentos como fuente de energía química: carbohidratos, proteínas y lípidos.","g":{"3":["Reconoce los saberes de pueblos y culturas acerca de la diversidad de los alimentos y su importancia en el diseño de menús orientados a una dieta saludable acorde al contexto.","Explica cómo obtiene la energía el cuerpo humano a partir de los nutrimentos e identifica los alimentos que los contienen.","Valora la importancia de vitaminas, minerales y agua simple potable, para el adecuado funcionamiento del cuerpo humano e identifica los impactos de su deficiencia.","Analiza el aporte energético de los alimentos y lo relaciona con las actividades físicas personales, a fin de tomar decisiones vinculadas a una dieta saludable."]}},{"c":"Las reacciones químicas: manifestaciones, propiedades e interpretación de las ecuaciones químicas con base en la Ley de conservación de la materia, así como la absorción o desprendimiento de energía en forma de calor.","g":{"3":["Reconoce distintas reacciones químicas en su entorno y en actividades experimentales, a partir de sus manifestaciones y el cambio de propiedades de reactivos a productos.","Representa reacciones mediante modelos tridimensionales y ecuaciones químicas, con base en el lenguaje científico y la Ley de la conservación de la materia.","Explica y representa intercambios de materia y energía –endotérmicas y exotérmicas– de reactivos a productos y su aprovechamiento en actividades humanas.","Explica lo que cambia y lo que permanece en una reacción química y valora su importancia para producir nuevas sustancias y satisfacer necesidades humanas, así como solucionar problemas relacionados con la salud y el medio ambiente."]}},{"c":"Propiedades de ácidos y bases, reacciones de neutralización y modelo de Arrhenius.","g":{"3":["Distingue las propiedades de ácidos y bases en su entorno a partir de indicadores e interpreta la escala de acidez y basicidad.","Deduce los productos de reacciones de neutralización sencillas con base en el modelo de Arrhenius, mediante actividades experimentales.","Diseña y lleva a cabo reacciones de neutralización a fin de obtener productos útiles en la vida cotidiana, así como para el tratamiento de residuos.","Evalúa los beneficios y riesgos a la salud y al medio ambiente de ácidos y bases, en diversos ámbitos a través del pensamiento crítico."]}},{"c":"Las reacciones de óxido-reducción (redox): identificación del número de oxidación y de agentes oxidantes y reductores.","g":{"3":["Identifica reacciones de redox en su entorno y comprende su importancia en diferentes ámbitos.","Analiza la transferencia de electrones entre reactivos y productos en reacciones de redox con base en el cambio del número de oxidación, a partir de actividades experimentales.","Valora los beneficios y el costo ambiental de procesos y productos derivados de las reacciones redox, por medio de debates y argumentando su postura a favor de la sustentabilidad."]}}],"geo":[{"c":"El espacio geográfico como una construcción social y colectiva.","g":{"1":["Comprende que el espacio geográfico se conforma de interrelaciones sociedad-naturaleza.","Reconoce que el patrimonio biocultural es resultado de la relación entre las formas de organización económico-social, la cultura y la biodiversidad a través del tiempo.","Distingue la distribución de las principales regiones bioculturales principales en México y el mundo."]}},{"c":"Las categorías de análisis espacial y representaciones del espacio geográfico.","g":{"1":["Reconoce saberes ancestrales acerca del espacio geográfico, formas de ubicación y representaciones en México y el mundo.","Comprende las categorías de análisis espacial para explicar las características del espacio geográfico: lugar, región, paisaje y territorio.","Utiliza los conceptos de localización, distribución, diversidad, temporalidad y cambio e interacción para el estudio del espacio geográfico."]}},{"c":"La distribución y dinámica de las aguas continentales y oceánicas en la Tierra.","g":{"1":["Analiza la distribución de las aguas continentales en México y el mundo: principales ríos, lagos, aguas subterráneas, llanuras inundables y humedales.","Reconoce la importancia de las cuencas hidrográficas como un sistema para el desarrollo económico en México, así como para la conservación del agua y la tierra.","Valora el mar territorial, la zona económica exclusiva de México y sus litorales, como recursos que contribuyen al desarrollo del país, lo que fortalece la conciencia marítima."]}},{"c":"La relación de las placas tectónicas con el relieve, la sismicidad y el vulcanismo.","g":{"1":["Identifica qué son las placas tectónicas, cuáles son sus características y dinámica.","Argumenta la relación entre las placas tectónicas con las regiones sísmicas y volcánicas en México y el mundo, para fortalecer la cultura de la prevención.","Relaciona los movimientos de las placas tectónicas con la distribución del relieve de la superficie terrestre y reconoce otros agentes que lo modelan."]}},{"c":"Los riesgos de desastre, su relación con los procesos naturales y la vulnerabilidad de la población en lugares específicos.","g":{"1":["Identifica que los desastres pueden ser originados por procesos naturales o por las actividades humanas.","Relaciona los efectos ambientales, sociales y económicos de los desastres recientes en México y el mundo, tomando en cuenta la vulnerabilidad de la población.","Valora la importancia de consolidar una cultura de prevención de desastres con la participación de instituciones, organismos y la sociedad."]}},{"c":"Crecimiento, distribución, composición y migración de la población.","g":{"1":["Analiza las implicaciones sociales, ambientales y económicas del crecimiento, distribución y composición de la población en diferentes países, con base en información estadística y cartográfica.","Emplea las nociones de concentración y dispersión de la población para explicar los rasgos y problemas del espacio urbano y el rural.","Distingue la movilidad como un derecho humano, los tipos de migración y principales flujos migratorios para comprender los efectos socioeconómicos y culturales en los lugares de atracción y expulsión de población."]}},{"c":"Los procesos productivos y sus consecuencias ambientales y sociales en la comunidad, México y el mundo.","g":{"1":["Compara procesos productivos y espacios económicos en México y el mundo, para reconocer sus implicaciones sociales, económicas y ambientales.","Analiza y relaciona distintos procesos productivos sustantivos en la conformación social, económica y espacial de las sociedades a nivel mundial, para identificar sus contradicciones y desigualdades."]}},{"c":"Las prácticas de producción, distribución y consumo sustentables como alternativas para preservar el medio ambiente y asegurar el bienestar de las generaciones presentes y futuras.","g":{"1":["Comprende qué es la sustentabilidad e identifica prácticas de producción, distribución y consumo sustentables.","Argumenta sobre prácticas sustentables de producción, distribución y consumo que pueden contribuir al bienestar de la comunidad y de México.","Propone alternativas sustentables de desarrollo social para la preservación del medio ambiente y el bienestar de las generaciones presentes y futuras."]}},{"c":"Las desigualdades socioeconómicas en México y el mundo, y sus efectos en la calidad de vida de las personas.","g":{"1":["Comprende qué son las desigualdades socioeconómicas e identifica sus efectos y repercusiones en la vida de las personas.","Argumenta las desigualdades socioeconómicas en México y el mundo, mediante la interpretación del Índice de Desarrollo Humano (IDH) y el Índice para una vida mejor, para explicar sus efectos en la calidad de vida.","Propone acciones para reducir las desigualdades socioeconómicas en la comunidad, México y el mundo."]}},{"c":"Los conflictos territoriales actuales en México y el mundo, y sus implicaciones ambientales y sociales.","g":{"1":["Debate acerca de la multicausalidad de los conflictos territoriales en México y el mundo, la importancia de la ubicación geográfica de las partes involucradas y las consecuencias ambientales, sociales, económicas y políticas en México y el mundo.","Promueve alternativas de resolución justas y pacíficas a los conflictos territoriales que afectan a la comunidad, a México y al mundo."]}},{"c":"Los retos sociales y ambientales en la comunidad, en México y el mundo.","g":{"1":["Reconoce cómo las problemáticas sociales y ambientales afectan a la comunidad.","Asume responsabilidad como agente de cambio para encontrar soluciones a las problemáticas sociales y ambientales de la comunidad."]}},{"c":"La diversidad de grupos sociales y culturales en México.","g":{"1":["Reconoce la diversidad de pueblos originarios, afromexicanos, migrantes, grupos urbanos, grupos sociales en México, como parte de la identidad nacional pluricultural y la compara con la diversidad social y cultural en el mundo.","Valora la importancia del espacio en la conformación de las identidades juveniles."]}},{"c":"El suelo, recurso estratégico para la seguridad alimentaria y la vida en el planeta.","g":{"1":["Indaga sobre el origen, los usos y los problemas del suelo en la localidad.","Reflexiona acerca de la contradicción que existe entre los países con suelo de vocación agrícola y la poca productividad asociada con los problemas del suelo (sobreexplotación, degradación, pérdida, entre otros).","Comparte alternativas para la protección y recuperación del suelo y colabora de manera organizada y solidaria en acciones comunitarias orientadas a ese fin en la localidad donde vive."]}},{"c":"El reto del cambio climático.","g":{"1":["Reconoce las relaciones e interacciones entre los elementos y los factores del clima como base para comprender, de manera general, la distribución de las regiones naturales en la Tierra y analizar la biodiversidad en el mundo.","Indaga y analiza de manera crítica los cambios ocurridos en el clima, sus causas y consecuencias en México y el mundo.","Asume una postura crítica y activa ante los fenómenos derivados del calentamiento global y el cambio climático."]}}],"his":[{"c":"Los albores de la humanidad: los pueblos antiguos del mundo y su devenir.","g":{"1":["Busca, localiza y estudia con sus pares fuentes que dan cuenta de mitos fundacionales de pueblos antiguos.","Reflexiona acerca de la importancia de las fuentes históricas para la interpretación de hechos y procesos.","Compara y encuentra lo común y lo diverso entre mitos fundacionales de pueblos antiguos de México y de otras partes del mundo.","Reflexiona y toma postura en torno a las teorías que explican el poblamiento original de América.","Distingue y clasifica evidencias históricas que le permiten acercarse al conocimiento del poblamiento original de América.","Investiga acerca de restos fósiles humanos encontrados en lo que hoy es el territorio de nuestro país.","Reflexiona en torno al caso del llamado Hombre de Tepexpan y la necesidad de una historia inclusiva que recupere las aportaciones de las mujeres.","Reconoce que la Historia es una reconstrucción científica del pasado que se hace desde el presente y que al igual que en otras ciencias, la ideología y la metodología del historiador determinan su mirada del pasado.","Conoce sistemas que tienen como propósito abordar la historia de los primeros pueblos en el territorio de lo que ahora es nuestro país.","Emplea alguno de estos sistemas para ubicar en el espacio y en el tiempo aspectos de la vida cotidiana de los pueblos antiguos que surgieron en Mesoamérica, Aridoamérica y Oasisamérica.","Vincula y compara sus representaciones e ideas sobre el nacimiento, la vida o la muerte con las que construyeron los antiguos pueblos de México.","Pone en juego su capacidad de convertirse en integrante de una cultura mesoamericana para exponer la razón y el sentido de los sacrificios rituales.","Desarrolla teóricamente el entramado de causas de diverso tipo que dieron lugar a la agricultura mesoamericana y el impacto civilizatorio de ésta en las sociedades que la practicaron.","Reconoce el significado en su vida de la práctica histórica del cultivo del maíz como una consecuencia de larga duración.","Reconstruye aspectos de la vida cotidiana en los ámbitos de la economía, la cultura, la sociedad y la política de los pueblos de Mesoamérica.","Recopila información histórica sobre los pueblos aridoamericanos y oasisamericanos y la organiza en un friso cronológico.","Compara el desarrollo histórico de pueblos originarios de Norteamérica y Sudamérica y comprende sus semejanzas y diferencias."],"3":["Recupera las explicaciones de Charles Darwin acerca del origen y evolución de la biodiversidad y particulariza en el caso del ser humano.","Investiga acerca de restos fósiles de homínidos encontrados en todo el mundo y organiza la información.","Explica cómo se construye la representación de la prehistoria a través de la manufactura de artefactos o estructuras.","Aplica el eje organizador uso y gestión del agua y su impacto para analizar el desarrollo histórico de las antiguas civilizaciones mesopotámica, egipcia, hindú y china.","Indaga a partir de la noción de espacio ecúmene aplicada a los antiguos pueblos fenicio, egipcio, cretense, cartaginés, griego y romano en la cuenca del mar mediterráneo, como una forma temprana de integración de la economía, la sociedad, la cultura y la política.","Analiza el proceso de integración de los antiguos pueblos de la Cuenca del Mar Mediterráneo para explicarse las tensiones y conflictos entre persas y griegos.","Genera hipótesis e interpretaciones propias sobre el esplendor de la Cultura Romana mediante el análisis de los conceptos: trabajo esclavo, ocupación militar de territorios y organización política.","Problematiza la relación germánicos-romanos y la desintegración del Imperio Romano de Occidente.","Establece relaciones de cambio, continuidad y/o ruptura en el surgimiento de los estados feudales y su generalización en Europa.","Estructura a partir del espacio y el tiempo en que se desarrolló, formas para organizar y dar cuenta del desarrollo histórico de las sociedades feudales.","Problematiza acerca de las causas, los fundamentos y el impacto del Imperio Musulmán en el mundo."]}},{"c":"La conformación de las metrópolis y los sistemas de dominación.","g":{"1":["Formula preguntas, recopila información y comparte sus hallazgos en torno a los pueblos originarios de México: ¿Cuántos pueblos son? ¿Dónde están? ¿De dónde llegaron? ¿Cómo vivían antes? ¿Cómo viven ahora? ¿Qué permanece? ¿Qué cambió? ¿Se reconoce en él?","Construye una línea del tiempo con la historia de algún pueblo originario que le sea entrañable.","Indaga los orígenes de la población afromexicana, sus aportaciones sociales y a la cultura de nuestro país.","Identifica representaciones asumidas de los pueblos indígenas y afromexicanos sobre el nacimiento, la vida, la muerte, la tierra, la naturaleza, el agua, el territorio en su comunidad.","Investiga el arribo de otros pueblos del mundo a nuestro país a largo de la historia y lo expone a sus pares en la organización cronológica que considere más adecuada."],"2":["Indaga acerca del desarrollo del comercio y su impacto en la geografía y la navegación en Europa y Asia en el Siglo XV.","Explica la consolidación del Reino Español alrededor de Isabel I de Castilla y Fernando II de Aragón como personajes históricos en este proceso.","Busca información acerca de la expedición de 1492 de Cristóbal Colón y el descubrimiento de América.","Revisa desde una perspectiva fundada en valores universales, como la libertad, la justicia, el respeto y la tolerancia, el contenido de las Bulas Alejandrinas y el Tratado de Tordesillas.","Registra y extrae conclusiones con respecto al arribo de los españoles al nuevo mundo y la colonización de las Antillas.","Indaga acerca de las tensiones y alianzas políticas entre los señoríos mesoamericanos, previo al arribo de los colonizadores españoles al territorio de lo que hoy es nuestro país.","Revisa y contextualiza las campañas militares que Hernán Cortés llevó a cabo para someter a la población indígena.","Problematiza sobre los factores políticos, económicos, culturales, tecnológicos, militares y religiosos que predominaban en los pueblos indígenas en el momento de su enfrentamiento con los españoles.","Elabora teorías de posibles desenlaces a partir de una articulación diferente de los factores que se conjugaron en este evento histórico.","Ubica a la Conquista como un momento de ruptura en la historia de nuestro país, que generó cambios en la sociedad y en la vida cotidiana de las personas.","Describe las formas de exacción a las que fueron sometidos la población y los territorios indígenas con el establecimiento del Virreinato de la Nueva España.","Identifica elementos de las culturas indígenas que persistieron en la época colonial dentro del proceso de cohesión política de nuestro país.","Problematiza el interés de la corona española en el desarrollo e intensificación de la minería en la Nueva España.","Distingue las características de la forma de gobierno, la economía, la cultura y la sociedad en la Nueva España.","Reflexiona y emite su opinión acerca del uso del trabajo esclavo de personas africanas y afrodescendientes en la Nueva España.","Reflexiona sobre las implicaciones sociales del sistema de castas que se estableció en la sociedad novohispana."],"3":["Indaga sobre el desarrollo de las ciudades en Italia y Flandes durante los siglos XII y XIII.","Asocia la transmutación del sistema feudal con el desarrollo del Humanismo, en el marco del surgimiento de los estados nacionales y las monarquías absolutas.","Reflexiona acerca de las causas que ocasionaron la búsqueda de rutas comerciales marítimas y su propagación y generalización durante los siglos XV y XVI.","Analiza la disputa entre los países hegemónicos por la posesión de territorios en América, África y Asia.","Caracteriza las colonizaciones realizadas por españoles, portugueses, ingleses, franceses y holandeses en América y en Asia.","Relaciona la expoliación de los recursos humanos y naturales de los territorios colonizados en América con la práctica de una política económica institucional de las naciones colonizadoras.","Revisa las causas y obtiene conclusiones de la concentración de la actividad colonizadora de diferentes potencias ultramarinas como en la Cuenca del Mar Caribe y el Sudeste Asiático.","Obtiene información y formula conclusiones acerca del tráfico de pieles y su incremento durante la colonización del noreste de Norteamérica.","Analiza las causas que llevaron a la intensificación del tráfico de esclavos y al uso del trabajo de éstos en los territorios colonizados de América.","Investiga los lugares de origen y de destino de la población africana reducida a la esclavitud en este periodo.","Problematiza la vida cotidiana de la población africana reducida a la esclavitud en América.","Caracteriza el establecimiento de las colonias inglesas en América.","Reflexiona y emite opiniones acerca de las relaciones de todo tipo que los colonos ingleses establecieron con la población indígena.","Compara y obtiene conclusiones acerca de la composición social que se conformó en las colonias inglesas en el Continente Americano."]}},{"c":"Las gestas de resistencia y los movimientos independentistas.","g":{"1":["Indaga sobre rebeliones y levantamientos de pueblos indígenas y afromexicanos en la historia de nuestro país y se acerca a comprender sus causas.","Emite juicios acerca de agravios o crímenes a los que han sido sujetos los pueblos indígenas y afromexicanos."],"2":["Relaciona la Revolución de Independencia de 1810 en nuestro país con el agotamiento del imperio español para mantener la cohesión de sus colonias ultramarinas.","Comprende la confluencia de procesos (por ejemplo, las reformas borbónicas) y hechos (como la invasión napoleónica en España) en la configuración de la lucha por la Independencia de la Nueva España.","Aplica conceptos organizadores para dar cuenta de las etapas en que se desarrolló la lucha por la Independencia de la Nueva España.","Identifica los cambios de ritmo y de dirección en las diferentes etapas de la lucha por la Independencia de la Nueva España y teoriza al respecto.","Reconoce la impronta que la participación popular o la ausencia de ésta le dio a la lucha por la Independencia.","Caracteriza la consumación de la Independencia y el surgimiento del Primer Imperio.","Comprende el acontecimiento de la Revolución de Independencia como parte de un proceso de la formación de un Estado nacional.","Analiza las tensiones entre federalistas y centralistas con el advenimiento de la República durante la primera mitad del siglo XIX.","Explica la debilidad estructural de la joven República mexicana para enfrentar el asedio de los Estados Unidos y Francia: Independencia de Texas, Primera Invasión Francesa e Invasión Estadounidense de 1846-1848."],"3":["Elabora una cronología de las luchas de independencia de los países de Latinoamérica; incorpora datos, fechas, nombres, lugares y personajes históricos; aspectos sincrónicos y diacrónicos, aspectos que permanecen o cambian y la duración."]}},{"c":"Las revoluciones modernas y sus tendencias","g":{"2":["Establece las características y el contexto en que se desarrolla la dictadura de Antonio López de Santa Anna y obtiene conclusiones.","Identifica causas y consecuencias de corta y larga duración de la Revolución de Ayutla de 1854.","Analiza las Leyes de Reforma expedidas entre 1859 y 1861; opina sobre ellas y estima su valor en la actualidad.","Problematiza la relación liberales-conservadores en este periodo de la historia de México.","Elabora una cronología con los acontecimientos más importantes que sucedieron durante la Guerra de Reforma; incorpora la información necesaria para su comprensión puntual.","Pone en juego su capacidad de convertirse en un liberal o en un conservador y se posiciona documentadamente.","Demuestra la intervención interesada de gobiernos extranjeros en la vida interna de México en esta etapa de la historia (tratados McLane-Ocampo y Mon-Almonte, Alianza Tripartita y Convención de Londres).","Comprende la relevancia histórica de la Segunda Invasión Francesa para nuestra vida actual.","Identifica desde su imaginario la relevancia histórica de la Batalla del 5 de mayo de 1862.","Elabora una cronología con los acontecimientos más importantes que sucedieron durante la restauración de la República y Porfiriato; incorpora la información necesaria para su comprensión puntual; e identifica cambios y permanencias en ambos procesos y los puntos de inflexión.","Genera interpretaciones del Porfiriato a partir de comparar el desarrollo económico y el desarrollo social generados durante este periodo histórico.","Elabora hipótesis que explican el trato que Porfirio Díaz dio a la oposición política, a la prensa, al movimiento campesino y obrero y a los pueblos indígenas."],"3":["Ubica la confluencia de causas para que la primera Revolución Industrial suceda en Inglaterra y se desarrolle el sistema capitalista.","Explica la relevancia histórica de la Revolución Industrial en nuestras vidas.","Analiza y comprende por separado la causalidad y el sentido de la Independencia de los Estados Unidos y de la Revolución Francesa y el impacto que tuvieron en su momento en el mundo; identifica los elementos en común y los que marcan diferencias; construye una narrativa de estos procesos.","Problematiza la irrupción de estas revoluciones con el uso de conceptos como cambios, permanencias, ruptura, viejo régimen, soberanía popular, esclavitud, igualdad, propiedad privada.","Relaciona los que a su juicio son aportes relevantes de estas revoluciones.","Analiza la Declaración de los Derechos del Hombre y del Ciudadano y genera hipótesis acerca de la ausencia explícita de las mujeres en el texto.","Analiza la consolidación de Francia como nación moderna y capitalista y relaciona el aporte a este proceso de las campañas militares que llevó a cabo Napoleón Bonaparte.","Explica cómo en el proceso de ascenso y consolidación del sistema capitalista y de la burguesía como clase dominante hubo segmentos sociales con una perspectiva diferente: socialistas utópicos, comunistas y anarquistas.","Analiza el proceso de expansión territorial de los Estados Unidos y los modelos de desarrollo económico de los estados del norte y del sur.","Identifica desde qué perspectiva estaba planteada la abolición de la esclavitud impulsada por los estados del norte.","Analiza los resultados de la Guerra Civil Estadounidense y determina la perspectiva histórica de esta nación.","Reflexiona qué tanto se modificaron las condiciones de vida de la población de origen africano en los Estados Unidos de América.","Relaciona la creciente industrialización de los países capitalistas y la colonización de África en la segunda mitad del siglo XIX.","Analiza y comprende la causalidad de los procesos de integración nacional de Italia y Alemania y comprende cómo estos se convierten en causas de hechos más complejos.","Reconoce en el establecimiento de la Comuna de París en 1871 la expresión de una forma de gobierno alternativo al de la burguesía."]}},{"c":"Las tensiones en el siglo XX.","g":{"2":["Analiza y comprende la causalidad de la Revolución Mexicana de 1910; identifica la heterogeneidad en su composición y demandas.","Pondera las demandas sociales que la orientaron y la participación de los diferentes grupos sociales en su conducción en diferentes momentos.","Diseña periodos espaciotemporales y los organiza cronológicamente para dar cuenta del proceso revolucionario.","Construye narrativas de los personajes históricos y los reconoce como expresión identitaria de grupos sociales en particular.","Analiza y caracteriza el suceso conocido como la Decena Trágica.","Argumenta desde el presente la relevancia que tiene para su vida la Revolución Mexicana y sus aportes.","Recaba información de los eventos relevantes de los gobiernos postrevolucionarios y caracteriza el periodo conocido como Maximato.","Analiza las causas, el origen, el lugar y el tiempo de la rebelión cristera.","Reúne información acerca de las principales políticas de gobierno de Lázaro Cárdenas (reforma agraria, intervención del Estado en la economía, nacionalización de industrias, educación socialista, apoyos a campesinos y reorganización del movimiento obrero) y la utiliza para estructurar una narrativa.","Vincula desde el tiempo cronológico las acciones concretas del gobierno cardenista (por ejemplo, la Expropiación Petrolera) y las relaciona con eventos pasados o simultáneos acerca del mismo tópico (por ejemplo, la expedición de la Ley del Petróleo del 24 de diciembre de 1901, que reconoce que los dueños de los predios pueden explotar hidrocarburos sin necesidad de concesión alguna) para dimensionar la cualidad del tiempo histórico.","Ubica en el gobierno de Manuel Ávila Camacho el origen y las circunstancias de la política de unidad nacional, las contextualiza internacionalmente y reconoce en esta política un elemento para la institucionalización y legitimación del Estado mexicano durante el siglo XX.","Reúne información acerca de las prioridades que impulsó el gobierno de Miguel Alemán Valdés y la contrasta con las representaciones sociales contenidas en la obra fílmica de Alejandro Galindo.","Explica las características, las prioridades y los sucesos importantes de los gobiernos de la época del desarrollo estabilizador.","Dimensiona el tiempo histórico (vincula hechos pasados o simultáneos con los que tiene relación) del derecho de las mujeres a votar y ser votadas en las elecciones de 1955.","Reconoce los costos sociales del Milagro Mexicano y el carácter autoritario y represor con el que actuó el Estado mexicano ante las demandas del movimiento magisterial (1958), la huelga ferrocarrilera (1959) y el movimiento médico (1964-1965).","Indaga acerca de la influencia de la Revolución Cubana en México y evidencia su impacto.","Recupera información de crónicas y narrativas de participantes del movimiento estudiantil de 1968, la analiza y construye hipótesis propias sobre sus causas y consecuencias.","Reflexiona a partir de su condición de estudiante, acerca de la perspectiva histórica de las y los jóvenes que participaron en este movimiento.","Emite juicios acerca del trato y la respuesta que el gobierno de Gustavo Díaz Ordaz dio al movimiento estudiantil de 1968.","Analiza y caracteriza las políticas de los gobiernos del periodo de las crisis económicas de 1970 a 1982; ubica cambios y permanencias con relación a los gobiernos anteriores.","Identifica cambios que incorporaron los gobiernos neoliberales entre 1982 y 2000 en la política, la economía y la sociedad, con respecto a las políticas de los gobiernos del Nacionalismo Revolucionario.","Explica las causas y el contexto en que se instauró el neoliberalismo en México.","Describe cómo el neoliberalismo implica progreso para algunos segmentos sociales y retroceso para otros; asume una posición desde sus condiciones de vida.","Reconoce cómo se gestan formas de organización alternativa en un escenario dominado por políticas neoliberales: la respuesta solidaria de la gente después del sismo de 1985 y la articulación del movimiento urbano popular; la movilización popular después del proceso electoral de 1988 y el movimiento magisterial de 1989.","Revisa la evolución de la política del Estado mexicano hacia los pueblos indígenas desde el exterminio y el despojo (siglo XIX) hasta la integración y la cultura dominante del mestizaje (siglo XX).","Resignifica, visibiliza y reconoce la presencia de los pueblos indígenas y asume prácticas de convivencia inclusivas e igualitarias.","Comprende la noción de territorio y naturaleza que poseen los pueblos indígenas, así como sus demandas por la autonomía, el autogobierno y la democracia.","Analiza y comprende las causas del levantamiento zapatista de 1994 en Chiapas y sus repercusiones en los ámbitos nacional e internacional."],"3":["Analiza y comprende las causas y consecuencias de la Segunda Revolución Industrial y su aporte a la consolidación del capitalismo como sistema económico mundial.","Explica las causas de la Primera Guerra Mundial y las vincula históricamente con hechos o procesos pasados o que suceden simultáneamente con los que están relacionados.","Amplía el alcance de este tiempo histórico al vincular las causas con hechos o sucesos posteriores con los que tengan relación.","Elabora una cronología de los eventos que abarca la Primera Guerra Mundial y la utiliza de base para entramar los hechos contenidos con las consecuencias de este conflicto bélico.","Compara la situación en que se colocaron los países participantes al final de la guerra.","Aborda la Revolución Rusa de 1917 como un punto de ruptura en la historia de esta nación y del mundo.","Genera hipótesis acerca del surgimiento de la Unión Soviética como contrapeso del sistema capitalista.","Explica la lógica en la que se desarrolla la crisis de 1929 y describe sus efectos.","Problematiza acerca del surgimiento del fascismo y las características que adquirió en Alemania, Italia y España.","Recaba información y genera hipótesis acerca de la Guerra Civil Española.","Valora la actitud del gobierno de Lázaro Cárdenas al recibir al exilio español y el impacto de este en la sociedad mexicana.","Explica las causas de la Segunda Guerra Mundial y las vincula históricamente con causas o consecuencias de la Primera Guerra Mundial.","Diseña un organizador cronológico de los eventos que abarca la Segunda Guerra Mundial y lo utiliza para dar cuenta del desarrollo del conflicto.","Establece similitudes y diferencias entre las consecuencias de la Primera y la Segunda Guerra Mundial.","Indaga las causas de la incorporación de México en el conflicto y la forma en que lo hizo.","Genera hipótesis acerca del periodo histórico conocido como posguerra; usa conceptos como mundo bipolar, conformación de bloques, Guerra Fría, sistemas de alianzas y conflictos regionales.","Analiza el proceso en que los comunistas chinos toman el poder en este país y su inserción en el ámbito internacional.","Indaga acerca de la descolonización de África y advierte cómo se insertan en este proceso las tensiones de la posguerra.","Analiza las causas y el sentido de la carrera armamentista nuclear desatada después de la Segunda Guerra Mundial y advierte sus implicaciones en el presente.","Indaga causas, desarrollo y desenlace de la guerra de Corea y establece su vinculación con la Guerra Fría.","Indaga causas, desarrollo y desenlace de la guerra de Vietnam; reflexiona y obtiene conclusiones respecto de la intervención de Francia y Estados Unidos en este conflicto.","Genera hipótesis e interpretaciones de la postura estadounidense acerca de la Revolución Cubana y las razones para mantener un bloqueo económico sobre la isla desde 1962.","Elabora un organizador cronológico de la carrera espacial e inserta este proceso en el contexto del mundo bipolar.","Analiza y comprende las causas de la desintegración del bloque socialista; interpreta el simbolismo de la caída del muro de Berlín.","Ubica causas, desarrollo y desenlace de la guerra del Golfo Pérsico (1990- 1991) y la contextualiza en un escenario unipolar.","Analiza la elección de Nelson Mandela como presidente de Sudáfrica el 10 de mayo de 1994.","Analiza y comprende las causas de la creación de la Unión Europea."]}},{"c":"La construcción histórica de las ideas sobre las juventudes e infancias.","g":{"1":["Identifica las ideas y representaciones de las personas de acuerdo con su edad en diversos momentos históricos.","Comprende los cambios y permanencias en las características y tareas que las sociedades asignan a las personas, de acuerdo con su edad.","Explica, con base en fuentes, las actividades asignadas a las personas según su edad en sociedades y momentos históricos diversos."]}},{"c":"Las mujeres y sus historias.","g":{"1":["Revisa fuentes históricas para identificar la participación de las mujeres en la sociedad en diversos momentos históricos.","Indaga sobre el protagonismo social de las mujeres en diferentes procesos históricos, para reconocer la relevancia de su participación.","Contrasta fuentes históricas para identificar cambios y permanencias en la participación de las mujeres en diversos momentos históricos.","Analiza los testimonios producidos por las mujeres en distintos momentos históricos.","Argumenta las causas de los principales cambios históricos que ha tenido la participación social de las mujeres.","Argumenta cómo el “deber ser” de las mujeres ha cambiado a través del tiempo."]}},{"c":"Las luchas de las mujeres por sus derechos.","g":{"1":["Identifica los orígenes históricos de movimientos y organizaciones de mujeres en la lucha por la igualdad y el reconocimiento de sus derechos.","Comprende los cambios y permanencias en las luchas de las mujeres por una vida igualitaria y libre de violencia.","Analiza las causas de los movimientos feministas y reconoce el marco normativo nacional e internacional que protege los derechos de las mujeres."]}},{"c":"Relaciones de poder y lucha por los derechos de grupos históricamente discriminados o subrepresentados.","g":{"1":["Identifica las problemáticas de violencia hacia pueblos originarios, afrodescendientes, migrantes y comunidad LGBTT- TIQ+ en distintos procesos históricos.","Argumenta sobre los cambios y permanencias en la lucha por erradicar la violencia hacia pueblos originarios, afrodescendientes, migrantes y comunidad LGBTT- TIQ+ en distintos procesos históricos."]}},{"c":"Discriminación, racismo, sexismo y prejuicios como construcciones históricas.","g":{"1":["Identifica las causas históricas del racismo y la xenofobia y las relaciona críticamente con sus consecuencias.","Analiza la relevancia histórica del racismo en la justificación de actos que atentaron contra la vida de personas o grupos.","Comprende las causas y consecuencias históricas del racismo y propone acciones en su vida cotidiana y en la de su comunidad escolar para combatirlo."]}},{"c":"Movilidades humanas, migraciones y nuevos escenarios para la vida.","g":{"1":["Comprende procesos históricos relevantes en los que grupos humanos se desplazaron por los territorios a lo largo del tiempo.","Explica procesos históricos relevantes en los que grupos humanos se desplazaron por territorios en periodos de tiempo de corta o larga duración"]}},{"c":"Amor, amistad, familias y relaciones entre las personas en la historia.","g":{"1":["Comprende que la forma en la que las personas piensan y actúan en relación con el amor, la amistad y las familias se construye en la sociedad y cambia históricamente.","Explica los cambios que las concepciones sobre el amor, la amistad y las familias han tenido a lo largo del tiempo y en diversos contextos sociales y geográficos."]}}],"fce":[{"c":"Grupos sociales y culturales en la conformación de las identidades juveniles.","g":{"1":["Valora la diversidad de grupos e identidades juveniles en la escuela y en la comunidad y fortalece el respeto a formas de ser, pensar y expresarse en el marco de los derechos humanos."],"2":["Argumenta sobre el derecho a pertenecer a una cultura, grupo social, económico, ideológico, sexual o de género, entre otros, para exigir el respeto a las identidades juveniles."],"3":["Promueve espacios de participación juvenil, presenciales o virtuales, para construir comunidades que promuevan la colaboración, el respeto y el ejercicio de los derechos de niñas, niños y adolescentes."]}},{"c":"Los derechos humanos en México y en el mundo como valores compartidos por las sociedades actuales.","g":{"1":["Asume una postura crítica acerca de la vigencia de los derechos humanos como valores compartidos por distintas sociedades del mundo."],"2":["Propone acciones orientadas a fortalecer la igualdad de derechos, el bienestar colectivo y el respeto a la dignidad humana en poblaciones históricamente marginadas y vulneradas."],"3":["Debate acerca de la importancia de defender y exigir el respeto a los derechos humanos, como un reto de las sociedades actuales para vivir con dignidad, libertad, justicia e inclusión."]}},{"c":"Movimientos sociales y políticos por los derechos humanos en el mundo y en México.","g":{"1":["Asume una postura ética acerca de los movimientos sociales y políticos que originaron los derechos humanos en el mundo y su influencia en México."],"2":["Explica la trascendencia de los movimientos sociales y políticos en México y América Latina, para garantizar el ejercicio de derechos económicos, políticos y sociales de las personas y sociedades."],"3":["Asume una postura ética sobre los movimientos sociales y políticos en la actualidad y participa en acciones para promover y defender los derechos humanos."]}},{"c":"Consecuencias de la desigualdad en la calidad de vida de las personas y comunidades.","g":{"1":["Analiza las causas que dan origen a las diferencias en la calidad de vida de la población en México y el mundo y las compara con su derecho a la igualdad sustantiva y a una vida digna."],"2":["Explica las consecuencias de la desigualdad socioeconómica en la calidad de vida de la población y propone acciones que garanticen el derecho a una vida digna y justa."],"3":["Actúa éticamente para reducir las desigualdades, fomentando el respeto y la solidaridad en los pueblos más vulnerados en su comunidad, México y América Latina."]}},{"c":"Normas, leyes, instituciones y organizaciones encargadas de proteger, defender y exigir la aplicación de los derechos humanos en la convivencia diaria.","g":{"1":["Aprecia los beneficios de participar en la construcción y aplicación de normas y leyes para garantizar la convivencia y el ejercicio de los derechos humanos en la comunidad y el país."],"2":["Participa en la creación y transformación de normas y leyes que aplican en distintos contextos, orientadas a favorecer la igualdad, la libertad, la justicia y los derechos humanos."],"3":["Analiza la función de instituciones y organizaciones nacionales e internacionales, para demandar la aplicación de normas y leyes que defienden y exigen respeto a los derechos humanos."]}},{"c":"El conflicto en la convivencia humana desde la cultura de paz.","g":{"1":["Analiza distintos tipos de conflictos en sus espacios de convivencia, su estructura y formas de solucionarlos desde la cultura de paz como una oportunidad de crecimiento personal y social."],"2":["Propone distintas formas de resolver conflictos sociales y políticos ocurridos en México y América Latina, para generar estrategias de mediación desde la cultura de paz."],"3":["Valora la resolución pacífica de conflictos sociales y políticos en México y el mundo y gestiona estrategias de participación y transformación social hacia una cultura de paz."]}},{"c":"La cultura de paz y la creación de ambientes que garanticen el respeto a la vida y la dignidad del ser humano.","g":{"1":["Comprende la influencia que tiene la cultura de paz en la convivencia escolar, familiar y comunitaria, para favorecer ambientes libres de discriminación y racismo."],"2":["Aplica la cultura de paz para tomar decisiones responsables en contextos presenciales y virtuales que promuevan el respeto a la dignidad, la diversidad, la inclusión y la interculturalidad."],"3":["Colabora con personas de la escuela, la comunidad, el país y el mundo, para rechazar y denunciar la violencia, así como fortalecer el tejido social mediante acciones orientadas hacia una cultura de paz."]}},{"c":"Personas, grupos y organizaciones a favor de la cultura de paz.","g":{"1":["Aprecia las acciones de personas, grupos u organizaciones en México a favor de la cultura de paz para promover ambientes libres de violencia."],"2":["Analiza las acciones de personas, grupos u organizaciones realizadas en México y América Latina para promover actitudes, valores y comportamientos basados en una cultura de paz."],"3":["Valora las acciones que personas, grupos u organizaciones han realizado en México y América Latina para resolver los conflictos territoriales, políticos y sociales de manera no violenta y a favor de la cultura de paz."]}},{"c":"Principios éticos como referentes para un desarrollo sustentable.","g":{"1":["Reflexiona éticamente acerca de la relación de las comunidades con su contexto socionatural para impulsar acciones que promuevan el desarrollo sustentable, así como actitudes de cuidado y respeto a otros seres vivos."],"2":["Evalúa la contribución de la ética en las prácticas de producción, distribución y consumo de bienes y servicios, para generar alternativas de desarrollo sustentables."],"3":["Implementa acciones de colaboración, reciprocidad, solidaridad y de participación igualitaria como valores para un desarrollo sustentable."]}},{"c":"Igualdad sustantiva en el marco de la interculturalidad, la inclusión y la perspectiva de género.","g":{"1":["Aprecia la interculturalidad y el respeto al derecho a la igualdad sustantiva para establecer relaciones incluyentes y respetuosas de la diversidad, rechazando la discriminación y el racismo."],"2":["Elabora juicios éticos sobre problemas de injusticia y discriminación que afectan la igualdad sustantiva y realiza propuestas congruentes con el respeto a la inclusión, la interculturalidad y la perspectiva de género."],"3":["Participa en acciones dirigidas a reducir brechas de desigualdad para promover y fortalecer la interculturalidad, la inclusión y la perspectiva de género."]}},{"c":"Medidas de protección y mecanismos de denuncia en el rechazo a la violencia de género, sexual y la trata de personas.","g":{"1":["Analiza situaciones de violencia escolar, de género, sexual y la trata de personas, con base en la perspectiva de género y demanda la aplicación de medidas de prevención y protección para garantizar el derecho a una vida libre de violencia."],"2":["Compara los tipos de violencia escolar, de género y la trata de personas e identifica medidas de protección y mecanismos de denuncia, así como acciones de organizaciones e instituciones que buscan garantizar el derecho a una vida libre de violencia."],"3":["Propone acciones de denuncia en contextos presenciales y en las redes sociales para garantizar el derecho a una vida libre de violencia de género, sexual y la trata de personas."]}},{"c":"Principios y valores de la cultura democrática como forma de gobierno y de vida.","g":{"1":["Aprecia en los principios y valores de la democracia una forma de vida y de gobierno, para tomar decisiones que fortalezcan la convivencia en los espacios donde participa."],"2":["Propone acciones para fortalecer en su entorno los rasgos del Estado de derecho democrático como el imperio de la ley, la división de poderes, los contrapesos de poder y el respeto a los derechos humanos."],"3":["Participa de manera activa, responsable e informada en la promoción, defensa y reivindicación de los principios y valores de la democracia."]}},{"c":"Proyectos como un recurso para atender problemáticas de la comunidad desde una ciudadanía democrática.","g":{"1":["Participa en actividades y proyectos en su entorno escolar y social, en donde aplica mecanismos de participación democrática y los rasgos de la ciudadanía responsable y crítica."],"2":["Elabora proyectos orientados a resolver necesidades y problemas relacionados con la violencia escolar y de género, aprovechando los recursos de la ciudadanía digital."],"3":["Colabora en proyectos con la comunidad para responder a necesidades colectivas en sus dimensiones política, civil y social, así como para transformar las condiciones que atentan contra los derechos humanos y la cultura democrática en diversos contextos."]}},{"c":"Instituciones, organizaciones y mecanismos de representación democrática.","g":{"1":["Aprecia la función de las instituciones y organizaciones sociales y políticas, así como de los mecanismos de participación y representación ciudadana, que fortalecen la vida democrática."],"2":["Destaca la importancia de la participación ciudadana, organizaciones sociales y partidos políticos en México, para evaluar los alcances y límites del gobierno democrático."],"3":["Valora los retos que enfrenta la democracia en México y el mundo para involucrarse en su fortalecimiento."]}},{"c":"Defensa del derecho al acceso a la protección de datos personales, a la información, la transparencia y la rendición de cuentas en un gobierno democrático.","g":{"1":["Destaca la importancia de que las servidoras y los servidores públicos y representantes populares desempeñen sus funciones con apego a la ley de manera honesta, transparente y limitada, utilizando los recursos públicos para beneficio de la sociedad."],"2":["Aprecia la participación ciudadana para exigir a las autoridades que cumplan sus funciones y administren los recursos públicos con honestidad, transparencia y legalidad."],"3":["Analiza el actuar de partidos políticos, organizaciones, gobiernos y las servidoras y los servidores públicos, mediante el acceso a la información, transparencia y rendición de cuentas, para exigir una gestión que proteja los datos personales de la ciudadanía y fortalezca la cultura de la legalidad en México."]}},{"c":"El derecho a la salud y la prevención en el consumo de drogas.","g":{"1":["Reconoce que el consumo de drogas afecta el derecho a la dignidad y la salud de las personas, y demanda la aplicación de medidas que contribuyan a la prevención y protección."],"2":["Promueve valores y habilidades para desarrollar la autoestima, la autorregulación, el autocuidado y el asertividad para prevenir el consumo de drogas y demanda el derecho a la salud integral."],"3":["Toma decisiones autónomas, responsables y comprometidas para prevenir el consumo de drogas y denuncia situaciones que atentan contra la salud."]}}],"tec":[{"c":"Herramientas, máquinas e instrumentos, como extensión corporal, en la satisfacción continua de intereses y necesidades humanas.","g":{"1":["Explora las posibilidades corporales y la delegación de funciones en herramientas, máquinas, instrumentos y formas de organización para identificar sus funciones y procesos de cambio técnico, en la satisfacción de intereses y necesidades de diversas sociedades."],"2":["Analiza las herramientas, máquinas, instrumentos y formas de organización, como una extensión de las posibilidades corporales para solucionar problemas en diversos contextos."],"3":["Amplía sus posibilidades corporales por medio del conocimiento y habilidades en el manejo de herramientas, máquinas, instrumentos y formas de organización en procesos técnicos comunitarios, para favorecer la inclusión y la sustentabilidad."]}},{"c":"Materiales, procesos técnicos y comunidad.","g":{"1":["Distingue el origen, transformación y características tecnológicas de los materiales que comparten técnicas similares, para utilizarlos desde una perspectiva local, eficiente y sustentable."],"2":["Explora el uso y transformación de los materiales, de acuerdo con sus características en los procesos técnicos de distintas comunidades, para prevenir daños sociales o a la naturaleza."],"3":["Implementa alternativas a situaciones que, por el origen, transformación, uso o desecho de los materiales, ponen en riesgo el entorno de la comunidad, para favorecer el desarrollo sustentable."]}},{"c":"Usos e implicaciones de la energía en los procesos técnicos.","g":{"1":["Comprende la función de la energía en los sistemas técnicos y sus implicaciones en el desarrollo tecnológico para la toma de decisiones responsables, que permitan prever y disminuir riesgos personales, sociales y naturales."],"2":["Explora las principales fuentes de energía en los procesos técnicos para su uso óptimo, así como las alternativas de prevención de riesgos personales, sociales y naturales."],"3":["Analiza diversas fuentes de energía en los procesos técnicos para considerar posibles alternativas sustentables en su funcionamiento."]}},{"c":"Factores que inciden en los procesos técnicos.","g":{"1":["Comprende la satisfacción de necesidades como la base de la creación e innovación técnica para reflexionar acerca de la influencia de intereses, prejuicios, estereotipos y aspiraciones, que favorecen o limitan la igualdad de oportunidades, en el desarrollo de procesos técnicos."],"2":["Analiza factores sociales, económicos, culturales y naturales a tomar en cuenta en la definición de criterios para el desarrollo de soluciones técnicas que mejoran la calidad de vida."],"3":["Implementa técnicas, procesos o formas de organización en la /* CSV con BOM UTF-8 (Excel lo abre con acentos) y neutralización de fórmulas */
function csvDownload(name,rows){
  const content='﻿'+rows.map(r=>r.map(v=>{let t=String(v??'');if(/^[=+@\-]/.test(t)&&typeof v==='string')t="'"+t;return '"'+t.replaceAll('"','""')+'"'}).join(',')).join('\r\n');
  download(name,new Blob([content],{type:'text/csv;charset=utf-8'}));
}

/* SHA-256 propio (síncrono, sin depender de crypto.subtle ni de contexto seguro) */
const SHA_K=new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function sha256Hex(str){
  const data=new TextEncoder().encode(str),l=data.length,bitLen=l*8,total=((l+9+63)>>6)<<6,buf=new Uint8Array(total);
  buf.set(data);buf[l]=0x80;
  const dv=new DataView(buf.buffer);dv.setUint32(total-8,Math.floor(bitLen/4294967296));dv.setUint32(total-4,bitLen>>>0);
  const H=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]),W=new Uint32Array(64);
  const rotr=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<total;o+=64){
    for(let t=0;t<16;t++)W[t]=dv.getUint32(o+t*4);
    for(let t=16;t<64;t++){const s0=rotr(W[t-15],7)^rotr(W[t-15],18)^(W[t-15]>>>3),s1=rotr(W[t-2],17)^rotr(W[t-2],19)^(W[t-2]>>>10);W[t]=(W[t-16]+s0+W[t-7]+s1)>>>0}
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let t=0;t<64;t++){
      const S1=rotr(e,6)^rotr(e,11)^rotr(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+SHA_K[t]+W[t])>>>0;
      const S0=rotr(a,2)^rotr(a,13)^rotr(a,22),mj=(a&b)^(a&c)^(b&c),t2=(S0+mj)>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }
    H[0]+=a;H[1]+=b;H[2]+=c;H[3]+=d;H[4]+=e;H[5]+=f;H[6]+=g;H[7]+=h;
  }
  return [...H].map(x=>x.toString(16).padStart(8,'0')).join('');
}

/* Color */
function hexToRgb(h){h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16))}
function rgbToHex(r){return '#'+r.map(v=>Math.round(v).toString(16).padStart(2,'0')).join('').toUpperCase()}
function tint(hex,p){return rgbToHex(hexToRgb(hex).map(v=>v+(255-v)*p))}   /* mezcla con blanco */
function isDark(hex){const [r,g,b]=hexToRgb(hex);return (0.299*r+0.587*g+0.114*b)<150}
function textOn(hex){return isDark(hex)?'#FFFFFF':'#1F2D3D'}

/* ===== 30_state.js — estado, validación, migración y guardado ===== */
const SCHEMA=9;
const ID_RE=/^[A-Za-z0-9_-]{1,64}$/;
const DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
const TIME_RE=/^([01]\d|2[0-3]):[0-5]\d$/;
const ATT_CODES=['P','F','FJ','FI'];
let loadWarning='';

/* v0.9: una rúbrica (o lista de cotejo). Lanza Error si no es válida.
   {id,name,kind:'rubrica'|'cotejo',levels:[{n,p}],criteria:[{id,n,w,d:[texto por nivel],pda}]} */
function normalizeRubric(r){
  const fail=m=>{throw new Error(m)},isObj=o=>o&&typeof o==='object'&&!Array.isArray(o),str=(v,max)=>typeof v==='string'?v.trim().slice(0,max):'';
  if(!isObj(r)||typeof r.id!=='string'||!ID_RE.test(r.id))fail('Una rúbrica tiene un identificador no válido.');
  const kind=r.kind==='cotejo'?'cotejo':'rubrica';
  let levels;
  if(kind==='cotejo')levels=copy(COTEJO_LEVELS);
  else{
    if(!Array.isArray(r.levels)||r.levels.length<2||r.levels.length>6)fail('La rúbrica «'+str(r.name,60)+'» debe tener de 2 a 6 niveles.');
    levels=r.levels.map((l,i)=>{const p=Number(isObj(l)?l.p:NaN);if(!Number.isFinite(p)||p<0||p>100)fail('Un nivel tiene un puntaje no válido.');return {n:str(l.n,40)||('Nivel '+(i+1)),p:round2(p)}});
    if(!(Math.max(...levels.map(l=>l.p))>0))fail('Al menos un nivel debe valer más de cero.');
  }
  if(!Array.isArray(r.criteria)||!r.criteria.length||r.criteria.length>30)fail('La rúbrica «'+str(r.name,60)+'» debe tener de 1 a 30 criterios.');
  const ids=new Set();
  const criteria=r.criteria.map((c,i)=>{
    if(!isObj(c))fail('Un criterio no es válido.');
    const id=typeof c.id==='string'&&ID_RE.test(c.id)&&!ids.has(c.id)?c.id:'c'+(i+1)+'_'+Math.random().toString(36).slice(2,6);ids.add(id);
    const w=Number(c.w);if(!Number.isFinite(w)||w<=0||w>100)fail('El criterio «'+str(c.n,60)+'» debe valer entre 0.1 y 100.');
    const d=levels.map((_,j)=>str(Array.isArray(c.d)?c.d[j]:'',400));
    return {id,n:str(c.n,200)||('Criterio '+(i+1)),w:round2(w),d,pda:typeof c.pda==='string'&&ID_RE.test(c.pda)?c.pda:''};
  });
  return {id:r.id,name:str(r.name,100)||'Rúbrica',kind,levels,criteria};
}

/* Valida y normaliza cualquier estado (datos locales o respaldos). Lanza Error con un mensaje claro si es inválido.
   Todos los identificadores deben ser seguros porque se insertan en atributos HTML. */
function normalizeState(raw,opt={}){
  const strict=!!opt.strict,fail=m=>{throw new Error(m)},isObj=o=>o&&typeof o==='object'&&!Array.isArray(o);
  const okId=v=>typeof v==='string'&&ID_RE.test(v),str=(v,max=200)=>typeof v==='string'?v.trim().slice(0,max):'';
  if(!isObj(raw))fail('El archivo no contiene datos de '+APP_NAME+'.');
  if(!Array.isArray(raw.groups))fail('Faltan los grupos en los datos.');
  const s={schema:SCHEMA},groupIds=new Set(),studentIds=new Set();
  s.groups=raw.groups.map(g=>{
    if(!isObj(g)||!okId(g.id))fail('Un grupo tiene un identificador no válido.');
    if(groupIds.has(g.id))fail('Hay dos grupos con el mismo identificador.');groupIds.add(g.id);
    if(g.level&&g.level!==EDITION&&strict)fail('Este archivo corresponde a la edición '+g.level+'. Usa un respaldo de '+EDITION+'.');
    const ng={id:g.id,name:str(g.name,80)||'Grupo',level:EDITION,archived:!!g.archived,students:[]};
    ng.grade=gradeOk(g.grade)?String(Number(g.grade)):gradeFromName(ng.name);   /* v0.14 */
    for(const st of (Array.isArray(g.students)?g.students:[])){
      if(!isObj(st)||!okId(st.id))fail('Un alumno tiene un identificador no válido.');
      if(studentIds.has(st.id))continue;studentIds.add(st.id);
      const name=str(st.name,130);if(!name)continue;
      ng.students.push({id:st.id,name,...(st.inactive?{inactive:true}:{})});
    }
    ng.students.sort((a,b)=>a.name.localeCompare(b.name,'es',{sensitivity:'base'}));
    if(IS_SEC)ng.disciplines=[...new Set((Array.isArray(g.disciplines)?g.disciplines:[]).filter(d=>DISCIPLINAS.some(x=>x.id===d)))];
    return ng;
  });
  const gOk=id=>groupIds.has(id);
  /* Asistencia: 'idGrupo|AAAA-MM-DD' -> {idAlumno: P|F|FJ|FI} */
  s.attendance={};
  if(isObj(raw.attendance))for(const [k,v] of Object.entries(raw.attendance)){
    const [g,d,...rest]=k.split('|');if(rest.length||!gOk(g)||!DATE_RE.test(d||'')||!isObj(v))continue;
    const rec={};for(const [sid,st] of Object.entries(v))if(okId(sid)&&ATT_CODES.includes(st))rec[sid]=st;
    s.attendance[k]=rec;
  }
  /* v0.8: dentro de una lista guardada, quien no tenga registro se interpreta como en v0.7 (Falta) para no cambiar datos viejos */
  if((Number(raw.schema)||0)<8){
    for(const [k,rec] of Object.entries(s.attendance)){const g=s.groups.find(x=>x.id===k.split('|')[0]);if(!g)continue;for(const st of g.students)if(!st.inactive&&rec[st.id]===undefined)rec[st.id]='F'}
  }
  /* v0.9: PDA por grupo y campo/disciplina: 'idGrupo|idAlcance' -> [{id,t}] */
  s.pdas={};const pdaIds=new Set();
  if(isObj(raw.pdas))for(const [k,list] of Object.entries(raw.pdas)){
    const [g,sc,...r]=k.split('|');if(r.length||!gOk(g)||!okId(sc)||!Array.isArray(list))continue;

  /* v0.14: proyectos por grupo y campo/disciplina, con sus contenidos y PDA */
  s.projects=[];const projIds=new Set();

  /* v0.12 (Primaria) y v0.13 (Secundaria): rubros por grupo y campo formativo o disciplina: 'idGrupo|idAlcance' -> {pct, items:[{id,name,w}]}.
     Si un grupo/alcance aún no tiene lista se usan los rubros por omisión (Actividad, Proyecto, Examen) con ids fijos.
     Las ponderaciones antiguas (weights: Actividad/Proyecto/Examen) se convierten en rubros con porcentaje. */
  s.rubros={};
  const scopeOk=sc=>EDITION==='Primaria'?CAMPOS.some(c=>c.id===sc):DISCIPLINAS.some(d=>d.id===sc);
  {
    const normR=v=>{
      if(!isObj(v)||!Array.isArray(v.items))return null;const ids=new Set(),names=new Set(),items=[];
      for(const it of v.items.slice(0,12)){if(!isObj(it)||!okId(it.id)||ids.has(it.id))continue;const name=str(it.name,40);if(!name||names.has(normName(name)))continue;

    /* v0.25: rubros por trimestre ('g|sc|p'). Las listas antiguas de todo el ciclo ('g|sc') se copian a los 3 trimestres;

    const legacy=[];
    if(isObj(raw.rubros))for(const [k,v] of Object.entries(raw.rubros)){const [g,sc,...r]=k.split('|');if(!gOk(g)||!scopeOk(sc))continue;const n=normR(v);if(!n)continue;
      if(!r.length){legacy.push([g,sc,n]);continue}
      if(r.length!==1||!['1','2','3'].includes(r[0]))continue;if(r[0]==='1')delete n.nr;s.rubros[k]=n}
    legacy.forEach(([g,sc,n])=>put3(g,sc,n));
    if(isObj(raw.weights))for(const [k,v] of Object.entries(raw.weights)){const [g,sc,...r]=k.split('|');if(r.length||!gOk(g)||!scopeOk(sc)||s.rubros[k+'|1']||!isObj(v))continue;
      const d=defaultRubros();d.items.forEach(it=>{const n=Number(v[RUBRO_FROM_TIPO_NAME[it.id]]);it.w=Number.isFinite(n)&&n>=0&&n<=100?n:0});d.pct=Math.abs(d.items.reduce((a,x)=>a+x.w,0)-100)<0.01;put3(g,sc,d)}

  const rubroListOf=(g,sc,p)=>{for(let q=Number(p)||1;q>=1;q--){const R=s.rubros[g+'|'+sc+'|'+q];if(R)return R.items}return defaultRubros().items};
  /* Actividades (las antiguas sin campo/disciplina se conservan para reasignarlas) */

  s.activities=(Array.isArray(raw.activities)?raw.activities:[]).filter(a=>isObj(a)&&okId(a.id)&&okId(a.groupId)&&gOk(a.groupId)&&!actIds.has(a.id)&&Number.isFinite(Number(a.max))&&Number(a.max)>0).map(a=>{
    actIds.add(a.id);
    const scope=(typeof a.scopeId==='string'&&ID_RE.test(a.scopeId))?a.scopeId:'';
    const na={id:a.id,groupId:a.groupId,name:str(a.name,120)||'Actividad',date:DATE_RE.test(a.date||'')?a.date:todayISO(),max:Number(a.max),
      type:TIPOS.includes(a.type)?a.type:'Actividad',scopeId:scope,

    if(okId(a.projectId)&&projOk(a.projectId,a.groupId,scope))na.projectId=a.projectId;   /* v0.14 */
    {   /* cada actividad pertenece a un rubro de su campo o disciplina */
      const list=rubroListOf(a.groupId,scope,na.period);let rid=typeof a.rubro==='string'&&list.some(x=>x.id===a.rubro)?a.rubro:'';
      if(!rid){const byName=list.find(x=>normName(x.name)===normName(na.type));rid=(byName||list.find(x=>x.id===TIPO_TO_RUBRO[na.type])||list[0]).id}

    }

      try{na.rubric=normalizeRubric(a.rubric);na.rubric.criteria.forEach(c=>{if(c.pda&&!pdaOk(a.groupId,scope,c.pda))c.pda=''});na.rubricFrom=str(a.rubricFrom,100)}
      catch(e){na.mode='num'}   /* una rúbrica dañada no tumba los demás datos: la columna queda como número, sin notas */
