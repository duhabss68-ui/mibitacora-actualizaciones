  });
  const actById=Object.fromEntries(s.activities.map(a=>[a.id,a]));
  s.grades={};
  if(isObj(raw.grades))for(const [k,v] of Object.entries(raw.grades)){const [a,st,...r]=k.split('|');if(r.length||!actIds.has(a)||actById[a].mode!=='num'||!okId(st))continue;const n=Number(v);if(Number.isFinite(n)&&n>=0)s.grades[k]=n}
  /* v0.9: marcas (✓ ◐ ✗ o niveles), rúbricas calificadas y observaciones escritas */
  s.marks={};
  if(isObj(raw.marks))for(const [k,v] of Object.entries(raw.marks)){const [a,st,...r]=k.split('|');const act=actById[a];if(r.length||!act||!okId(st))continue;
    if((act.mode==='icon'&&ICON_MARKS.some(m=>m.c===v))||(act.mode==='level'&&LEVEL_MARKS.some(m=>m.c===v)))s.marks[k]=v}
  s.rscores={};
  if(isObj(raw.rscores))for(const [k,v] of Object.entries(raw.rscores)){const [a,st,...r]=k.split('|');const act=actById[a];if(r.length||!act||act.mode!=='rubric'||!okId(st)||!isObj(v))continue;
    const rec={};for(const c of act.rubric.criteria){const n=v[c.id];if(Number.isInteger(n)&&n>=0&&n<act.rubric.levels.length)rec[c.id]=n}
    if(Object.keys(rec).length)s.rscores[k]=rec}
  s.obs={};
  if(isObj(raw.obs))for(const [k,v] of Object.entries(raw.obs)){const [a,st,...r]=k.split('|');const act=actById[a];if(r.length||!act||act.mode!=='text'||!okId(st))continue;const t=str(v,300);if(t)s.obs[k]=t}
  s.extra={};
  if(isObj(raw.extra))for(const [k,v] of Object.entries(raw.extra)){const [g,st,...r]=k.split('|');if(r.length||!gOk(g)||!okId(st))continue;const n=Number(v);if(Number.isFinite(n)&&Number.isInteger(n))s.extra[k]=n}
  s.weights={};
  if(isObj(raw.weights))for(const [k,v] of Object.entries(raw.weights)){const [g,sc,...r]=k.split('|');if(r.length||!gOk(g)||!okId(sc)||!isObj(v))continue;const w={};let good=true;for(const t of TIPOS){const n=Number(v[t]);if(!Number.isFinite(n)||n<0||n>100)good=false;w[t]=n}if(good)s.weights[k]=w}
  /* Perfil y horario */
  const p=isObj(raw.profile)?raw.profile:{};
  s.profile={...defaultProfile(),teacher:str(p.teacher,120),school:str(p.school,160),cct:str(p.cct,20),sector:str(p.sector,20),zona:str(p.zona,20),cycle:str(p.cycle,20),shift:SHIFTS.includes(p.shift)?p.shift:'',grade:str(p.grade,20),
    group:okId(p.group)&&gOk(p.group)?p.group:'',period:['1','2','3'].includes(String(p.period))?String(p.period):'1',schedule:[]};
  /* Asistente de bienvenida: sólo para quien aún tiene únicamente el grupo de demostración sin uso */
  const pristine=raw.groups.length===1&&['g1','g2','g3'].includes(raw.groups[0].id)&&!(Array.isArray(raw.activities)&&raw.activities.length)&&!Object.keys(isObj(raw.attendance)?raw.attendance:{}).length&&!s.profile.teacher;
  s.profile.onboarded=p.onboarded===true||!pristine;
  for(const x of (Array.isArray(p.schedule)?p.schedule:[])){
    if(!isObj(x)||!DAYS.includes(x.day)||!okId(x.groupId)||!gOk(x.groupId)||!okId(x.scopeId)||!TIME_RE.test(x.start||'')||!TIME_RE.test(x.end||'')||x.start>=x.end)continue;
    s.profile.schedule.push({id:okId(x.id)?x.id:gid(),day:x.day,groupId:x.groupId,scopeId:x.scopeId,start:x.start,end:x.end});
  }
  /* Equipos guardados */
  s.teamSets={};

    if(!gOk(g)||!Array.isArray(list))continue;
    s.teamSets[g]=list.filter(x=>isObj(x)&&okId(x.id)&&Array.isArray(x.teams)).map(x=>({id:x.id,name:str(x.name,80)||'Equipos',date:DATE_RE.test(x.date||'')?x.date:todayISO(),mode:x.mode==='manual'?'manual':'auto',
      teams:x.teams.filter(isObj).map((t,i)=>({name:str(t.name,60)||('Equipo '+(i+1)),students:(Array.isArray(t.students)?t.students:[]).filter(okId)}))}));

  const st=isObj(raw.settings)?raw.settings:{};
  s.settings={bigText:st.bigText===true,sheetDensity:['compact','normal','wide'].includes(st.sheetDensity)?st.sheetDensity:(matchMedia('(pointer:coarse)').matches?'normal':'compact')   /* v0.19: en tableta, casillas más grandes */,attRule:st.attRule==='withJustified'?'withJustified':'strict',alertPct:Number.isFinite(Number(st.alertPct))&&Number(st.alertPct)>=1&&Number(st.alertPct)<=100?Math.round(Number(st.alertPct)):80,
    levelCuts:(()=>{const c=isObj(st.levelCuts)?st.levelCuts:{},ne=Number(c.ne),ep=Number(c.ep);return Number.isFinite(ne)&&Number.isFinite(ep)&&ep>=0&&ne<=10&&ep<=ne?{ne:round2(ne),ep:round2(ep)}:{ne:8,ep:6}})(),

    /* v0.10: tema de colores (la validación usa literales: este código corre antes de cargar 47_theme.js) */
    theme:['default','alegre','oscuro','custom'].includes(st.theme)?st.theme:'default',
    custom:(()=>{const c=isObj(st.custom)?st.custom:{},d=defaultCustom(),hx=v=>typeof v==='string'&&/^#[0-9A-Fa-f]{6}$/.test(v)?v.toUpperCase():null;return {accent:hx(c.accent)||d.accent,bg:hx(c.bg)||d.bg,base:c.base==='dark'?'dark':'light'}})()};

  if(isObj(raw.notebookFilter))for(const [g,v] of Object.entries(raw.notebookFilter)){if(!gOk(g))continue;s.notebookFilter[g]=Array.isArray(v)?v.filter(okId):null}
  /* v0.9: biblioteca de rúbricas del docente y observaciones generales por alumno y periodo */
  s.rubrics=[];const rubIds=new Set();

/* Carga: v0.7 -> v0.6 -> v0.5 -> v0.4. Las claves antiguas NUNCA se borran (sirven de copia de seguridad).
   Si algo está dañado se conserva el texto original aparte y se avisa; no se descarta en silencio. */
function loadState(){
  const keys=[KEY,...['v08','v07','v06','v05','v04'].map(v=>KEY.replace('v09',v))];
  for(const k of keys){
    let raw=null;try{raw=localStorage.getItem(k)}catch(e){}
    if(!raw)continue;
    try{
      const s=normalizeState(JSON.parse(raw));
      if(k!==KEY)loadWarning='';
      return s;
    }catch(e){
      try{localStorage.setItem(KEY+'_dañado_'+Date.now(),raw)}catch(_){}
      loadWarning='Se encontraron datos guardados que no se pudieron leer ('+e.message+'). Se conservó una copia aparte y se inició con datos de ejemplo. Si tienes un respaldo, restáuralo en «Más › Copias de seguridad».';
    }
  }
  return normalizeState(copy(seed));
}
let state=loadState();
let storageOk=true;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state));storageOk=true;if(typeof abSchedule==='function')abSchedule()}
  catch(e){storageOk=false;if(typeof notify==='function')notify('No se pudo guardar en este navegador. Descarga una copia de seguridad ahora.','error',{ms:30000});if(!window.__saveAlerted){window.__saveAlerted=1;alert('No se pudo guardar en este navegador (almacenamiento lleno o bloqueado). Guarda una copia en «Más › Copias de seguridad» antes de continuar.')}}
}
/* Contadores para mensajes de confirmación */
function countsOf(s){return {groups:s.groups.length,students:s.groups.reduce((n,g)=>n+g.students.length,0),activities:s.activities.length}}

/* ===== 40_core.js — variables de interfaz, alcances (campo/disciplina) y promedios ===== */
let active='inicio',selectedGroup='',currentDate=todayISO(),currentPeriod=state.profile.period||'1',scopeByGroup={},gradeActivityId='';
let editingActivity='',attRange={from:'',to:''},studentQuery='';
let rouletteBusy=false,rouletteAngle=0,rouletteWinner=null,rouletteRemaining={};

function activeGroups(){return state.groups.filter(g=>!g.archived)}
function roster(g){return g?g.students.filter(s=>!s.inactive):[]}
function group(){return state.groups.find(g=>g.id===selectedGroup&&!g.archived)}
function liveActivities(){return state.activities.filter(a=>!a.archived)}
function groupNameTaken(name,exceptId){const n=normName(name);return state.groups.some(g=>!g.archived&&g.id!==exceptId&&normName(g.name)===n)}

function scopesForGroup(g){if(!g)return[];return g.level==='Primaria'?CAMPOS:DISCIPLINAS.filter(d=>(g.disciplines||[]).includes(d.id))}
function scopeId(g){const list=scopesForGroup(g);let id=scopeByGroup[g?.id];if(!list.some(x=>x.id===id)){id=list[0]?.id||'';if(g)scopeByGroup[g.id]=id}return id}
function scopeName(g,id){return scopesForGroup(g).find(x=>x.id===id)?.name||'Sin clasificar'}
function scopeArea(g,id){if(!g)return'';return g.level==='Primaria'?'':CAMPOS.find(c=>c.id===DISCIPLINAS.find(d=>d.id===id)?.campo)?.name||''}
/* v0.25: en las tres ediciones se dice «Trimestre» (Primer, Segundo y Tercer Trimestre) */
function periodLabel(g){return 'Trimestre'}
const PERIOD_ORD={'1':'Primer','2':'Segundo','3':'Tercer'};
function periodName(n){return (PERIOD_ORD[String(n)]||String(n))+' Trimestre'}
/* v0.18.2: las actividades se agrupan por rubro, en el orden de «Rubros y porcentajes»; dentro de cada rubro,
   en el orden en que se crearon. Así un trabajo nuevo queda junto a los otros trabajos, no después del proyecto. */
function scopedActivities(g,scope=scopeId(g),period=currentPeriod){
  const arr=liveActivities().filter(a=>a.groupId===g?.id&&a.scopeId===scope&&String(a.period||'1')===period);
  if(!g||arr.length<2)return arr;
  const items=rubrosOf(g,scope,period).items,pos=a=>{const i=items.findIndex(x=>x.id===a.rubro);return i<0?items.length:i};
  return arr.map((a,i)=>[pos(a),i,a]).sort((x,y)=>x[0]-y[0]||x[1]-y[1]).map(x=>x[2]);
}
/* Grupos consecutivos por rubro (para pintar la franja de rubros sobre las columnas) */
function rubroGroups(arr){const out=[];arr.forEach(a=>{const n=rubroName(a),l=out[out.length-1];if(l&&l.rid===(a.rubro||n))l.n++;else out.push({rid:a.rubro||n,name:n,n:1,first:a.id})});return out}
function pendingActivities(g){return state.activities.filter(a=>a.groupId===g?.id&&!a.scopeId&&!a.archived)}

/* ---------- Promedio provisional (documentado en docs/CALCULO_DE_PROMEDIOS.md) ----------
   · Cada calificación se lleva a escala 0–10: nota / máximo × 10.
   · Sólo cuentan las actividades CALIFICADAS; una pendiente (casilla vacía) NO es cero; un 0 escrito sí cuenta.
   · Sin ponderaciones: promedio simple de las actividades calificadas.
   · Con ponderaciones: promedio de cada tipo con notas, combinado con su peso; los tipos sin notas
     (o con peso 0) se excluyen y los pesos restantes se normalizan.
   · Sin calificaciones => null (se muestra «Sin calificaciones»). */
/* v0.9: cada actividad se califica de una de cinco formas (a.mode). scoreOf devuelve los puntos (0..máx) o undefined si está pendiente. */
function levelValue(code){const v=state.settings?.levelValues?.[code];return Number.isFinite(v)?v:LEVEL_DEFAULTS[code]}
function rubricMaxPts(r){return Math.max(...r.levels.map(l=>l.p))}
/* Rúbrica: nota = Σ(peso × puntos del nivel elegido) ÷ (Σ pesos × puntos del mejor nivel) × máximo. Sólo con TODOS los criterios marcados. */
function rubricResult(a,sid){
  const r=a.rubric,rec=state.rscores[a.id+'|'+sid]||{},mp=rubricMaxPts(r);let wsum=0,acc=0,done=0;
  for(const c of r.criteria){wsum+=c.w;const li=rec[c.id];if(li===undefined||!r.levels[li])continue;done++;acc+=c.w*r.levels[li].p/mp}
  /* v0.15.2: al exportar (ZERO_FILL) una rúbrica a medias cuenta los criterios que faltan como 0 */
  return {done,total:r.criteria.length,frac:wsum>0&&(done===r.criteria.length||(ZERO_FILL&&done>0))?acc/wsum:null};
}
function scoreOf(a,sid){
  const k=a.id+'|'+sid;
  if(a.mode==='icon'){const m=ICON_MARKS.find(x=>x.c===state.marks[k]);return m?m.pct*a.max:undefined}
  if(a.mode==='level'){const c=state.marks[k];return c?levelValue(c)/10*a.max:undefined}
  if(a.mode==='rubric'){const r=rubricResult(a,sid);return r.frac===null?undefined:r.frac*a.max}
  if(a.mode==='text')return undefined;
  const v=state.grades[k];return v===undefined?undefined:Number(v);
}
function countsInAverage(a){return a.mode!=='text'&&a.counts!==false}
function hasEvaluation(a,sid){const k=a.id+'|'+sid;return a.mode==='text'?!!state.obs[k]:a.mode==='rubric'?!!state.rscores[k]:(a.mode==='icon'||a.mode==='level')?!!state.marks[k]:state.grades[k]!==undefined}
function activityHasData(a){const pre=a.id+'|';return [state.grades,state.marks,state.rscores,state.obs].some(m=>Object.keys(m).some(k=>k.startsWith(pre)))}
function clearActivityData(id){const pre=id+'|';for(const m of [state.grades,state.marks,state.rscores,state.obs])for(const k of Object.keys(m))if(k.startsWith(pre))delete m[k]}
/* Texto corto para mostrar una casilla (cuaderno, ficha, Excel) */
function cellText(a,sid,long){
  const k=a.id+'|'+sid;
  if(a.mode==='icon'){const m=ICON_MARKS.find(x=>x.c===state.marks[k]);return m?(long?m.sym+' '+m.name:m.sym):''}
  if(a.mode==='level'){const m=LEVEL_MARKS.find(x=>x.c===state.marks[k]);return m?(long?m.name:m.sym):''}
  if(a.mode==='text')return state.obs[k]||'';
  if(a.mode==='rubric'){const r=rubricResult(a,sid);return r.frac!==null?numfmt(round2(r.frac*a.max)):(r.done?`${r.done} de ${r.total} criterios`:'')}
  const v=state.grades[k];return v===undefined?'':numfmt(v);
}
/* v0.15.2: al exportar, las casillas vacías de actividades que cuentan valen 0 (en pantalla siguen como «pendiente») */
let ZERO_FILL=false;
function withZeros(fn){const old=ZERO_FILL;ZERO_FILL=true;try{return fn()}finally{ZERO_FILL=old}}
function gradeOnTen(a,sid){const v=scoreOf(a,sid);if(v===undefined)return ZERO_FILL&&countsInAverage(a)?0:null;return v/Number(a.max)*10}
function averageInScope(g,scope,student,activities){
  const graded=activities.filter(a=>countsInAverage(a)&&(ZERO_FILL||scoreOf(a,student.id)!==undefined));
  if(!graded.length)return null;
  {   /* v0.12/v0.13: rubros del campo o disciplina, con o sin porcentaje */
    const R=rubrosOf(g,scope.id,periodOfActs(activities));
    if(!R.pct)return graded.reduce((x,a)=>x+gradeOnTen(a,student.id),0)/graded.length;
    let total=0,den=0;
    for(const it of R.items){
      const subset=graded.filter(a=>a.rubro===it.id);if(!subset.length||!(it.w>0))continue;
      total+=it.w*subset.reduce((x,a)=>x+gradeOnTen(a,student.id),0)/subset.length;den+=it.w;
    }
    return den?total/den:null;
  }
}
/* v0.24: promedio de un alumno en un rubro (0–10); con ZERO_FILL cuenta lo vacío como 0 */
function rubroAverage(st,acts,rid){const sub=acts.filter(a=>a.rubro===rid&&countsInAverage(a)&&(ZERO_FILL||scoreOf(a,st.id)!==undefined));return sub.length?sub.reduce((x,a)=>x+gradeOnTen(a,st.id),0)/sub.length:null}
function averageLabel(v){return v===null||v===undefined?'Sin calificaciones':numfmt(v)}
function meanOf(vals){const n=vals.filter(x=>x!==null&&x!==undefined);return n.length?n.reduce((a,b)=>a+b,0)/n.length:null}

/* Bloques del cuaderno (uno por campo/disciplina) con el filtro del docente aplicado */
function fullNotebookData(g){
  return scopesForGroup(g).map(scope=>({scope,color:scopeColor(scope.id),activities:scopedActivities(g,scope.id,currentPeriod)}));
}
function nbFilter(g){const f=state.notebookFilter?.[g?.id];return Array.isArray(f)?new Set(f):null}
function setNbFilter(g,set){state.notebookFilter[g.id]=set===null?null:[...set];save()}
function selectedScopeData(g){const all=fullNotebookData(g),f=nbFilter(g);return f?all.filter(x=>f.has(x.scope.id)):all}

/* ---------- v0.9: PDA (Procesos de Desarrollo de Aprendizaje) ----------
   Cada grupo guarda sus PDA por campo formativo o disciplina. Una actividad completa o un criterio de rúbrica pueden ligarse a un PDA.
   Avance de un alumno en un PDA = promedio (0–10) de todas sus evidencias ligadas; si un criterio de la rúbrica ya está ligado a ese PDA,
   la actividad completa no se cuenta otra vez para el mismo PDA. */
/* v0.14: PDA en las dos ediciones (en Primaria estaban ocultos desde la v0.12 hasta definir los Proyectos) */
function pdaEnabled(){return true}
/* PDA que evalúa una actividad: los suyos más los de su proyecto */
function projectOf(a){return a&&a.projectId?state.projects.find(p=>p.id===a.projectId):null}
function effectivePdas(a){const pr=projectOf(a);return [...new Set([...(a.pdas||[]),...(pr?pr.pdas:[])])]}
function pdaList(g,scope){return g&&pdaEnabled()?(state.pdas[g.id+'|'+scope]||[]):[]}
function pdaEvidence(pdaId,sid,acts){
  const vals=[];
  for(const a of acts){
    if(a.mode==='rubric'&&a.rubric.criteria.some(c=>c.pda===pdaId)){
      const rec=state.rscores[a.id+'|'+sid]||{},mp=rubricMaxPts(a.rubric);
      for(const c of a.rubric.criteria)if(c.pda===pdaId&&rec[c.id]!==undefined)vals.push(a.rubric.levels[rec[c.id]].p/mp*10);
    }else if(effectivePdas(a).includes(pdaId)){const v=gradeOnTen(a,sid);if(v!==null)vals.push(v)}
  }
  return vals;
}
function pdaLinked(pdaId,acts){return acts.filter(a=>effectivePdas(a).includes(pdaId)||(a.mode==='rubric'&&a.rubric.criteria.some(c=>c.pda===pdaId)))}
function pdaProgress(g,scope,acts){
  const ros=roster(g);
  return pdaList(g,scope).map(p=>{
    const per=Object.fromEntries(ros.map(st=>[st.id,meanOf(pdaEvidence(p.id,st.id,acts))]));
    return {pda:p,linked:pdaLinked(p.id,acts).length,per,group:meanOf(Object.values(per))};
  });
}

/* ---------- v0.12: rubros (Primaria; en Secundaria desde la v0.13) ---------- */
/* v0.25: los rubros son por grupo, campo o disciplina **y trimestre**: 'idGrupo|idAlcance|1..3'.
   Si un trimestre todavía no tiene su lista, usa la del trimestre anterior (o la de omisión).
   La lista se «materializa» (se guarda como propia) al revisarla, al guardarla o al crear actividades en ese trimestre.
   nr:true = el docente todavía no la revisa (se le avisa la primera vez que entra a ese trimestre). */
function rubroKey(g,sc,p=currentPeriod){return g.id+'|'+sc+'|'+String(p)}
function periodOfActs(acts){return String((acts&&acts[0]&&acts[0].period)||currentPeriod)}
function rubrosOwn(g,sc,p=currentPeriod){return state.rubros[rubroKey(g,sc,p)]||null}
function rubrosOf(g,sc,p=currentPeriod){
  if(!g)return defaultRubros();
  for(let q=Number(p)||1;q>=1;q--){const R=state.rubros[rubroKey(g,sc,q)];if(R)return R}
  return defaultRubros();
}
/* Guarda como propia la lista que hoy usa ese trimestre (copia del anterior). Devuelve la lista propia. */
function ensureRubros(g,sc,p=currentPeriod){
  const k=rubroKey(g,sc,p);if(state.rubros[k])return state.rubros[k];
  const src=rubrosOf(g,sc,p),R={pct:!!src.pct,items:copy(src.items)};if(String(p)!=='1')R.nr=true;
  state.rubros[k]=R;return R;
}
/* Antes de cambiar la lista de un trimestre, los trimestres siguientes que ya tienen actividades se quedan con la que usaban */
function freezeLaterRubros(g,sc,p){for(let q=Number(p)+1;q<=3;q++)if(!rubrosOwn(g,sc,q)&&state.activities.some(a=>a.groupId===g.id&&a.scopeId===sc&&String(a.period)===String(q)))ensureRubros(g,sc,q)}
function rubroName(a){const g=state.groups.find(x=>x.id===a.groupId);const it=g&&rubrosOf(g,a.scopeId,a.period).items.find(x=>x.id===a.rubro);return it?it.name:(a.type||'Actividad')}
/* Nombre del tipo de trabajo que se muestra: el rubro (en las dos ediciones desde la v0.13) */
function kindName(a){return rubroName(a)}

/* ---------- Avisos que no bloquean (reemplazan a alert) ---------- */
let toastLog=[];
function notify(msg,kind,opt){
  kind=kind||'info';opt=opt||{};toastLog.push({msg:String(msg),kind,t:Date.now()});
  let box=document.getElementById('toasts');
  if(!box){box=document.createElement('div');box.id='toasts';box.setAttribute('aria-live','polite');document.body.appendChild(box)}
  while(box.children.length>=4)box.firstChild.remove();
  const el=document.createElement('div');el.className='toast '+kind;el.setAttribute('role',kind==='error'?'alert':'status');
  const icon={success:'✓',error:'⚠',info:'ℹ'}[kind]||'ℹ',ic=document.createElement('span');ic.className='toast-ic';ic.textContent=icon;el.appendChild(ic);
  const span=document.createElement('span');span.className='toast-msg';span.textContent=msg;el.appendChild(span);
  if(opt.undo){const b=document.createElement('button');b.className='toast-undo';b.textContent='↶ Deshacer';b.onclick=()=>{el.remove();opt.undo()};el.appendChild(b)}
  const x=document.createElement('button');x.className='toast-x';x.setAttribute('aria-label','Cerrar aviso');x.textContent='×';x.onclick=()=>el.remove();el.appendChild(x);
  box.appendChild(el);setTimeout(()=>el.remove(),opt.ms||(kind==='error'?14000:8000));return el;
}
function warn(msg){notify(msg,'error')}
function lastNotice(){return toastLog.length?toastLog[toastLog.length-1].msg:''}

/* ---------- Deshacer ----------
   Las acciones que se pueden revertir (ocultar, retirar, rellenar notas…) se hacen al instante y ofrecen «Deshacer» 12 s.
   Lo irreversible (eliminar definitivamente, reemplazar datos) sigue pidiendo confirmación con el detalle exacto. */
function withUndo(label,fn){
  const snap=JSON.stringify(state);fn();save();render();
  notify(label,'success',{ms:12000,undo:()=>{state=normalizeState(JSON.parse(snap));save();if(typeof applyTheme==='function')applyTheme();render();notify('Listo, se deshizo: '+label,'info')}});
}

/* ---------- Confeti (se omite si la persona pidió menos animación) ---------- */
function confetti(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  document.getElementById('confetti')?.remove();
  const cv=document.createElement('canvas');cv.id='confetti';cv.setAttribute('aria-hidden','true');cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);
  const ctx=cv.getContext('2d'),cols=(typeof ROULETTE_COLORS!=='undefined'&&ROULETTE_COLORS.length)?ROULETTE_COLORS:['#FA704C','#FFBA61','#55C1B4','#A88BE7'];
  const el=document.getElementById('winnerName'),r=el?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/3,width:0,height:0},ox=r.left+r.width/2,oy=r.top+r.height/2;
  const P=Array.from({length:170},()=>{const a=-Math.PI/2+(Math.random()-.5)*2.4,v=6+Math.random()*10;return {x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:6+Math.random()*7,h:4+Math.random()*5,rot:Math.random()*6.28,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)],life:0}});
  let f=0;
  (function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);f++;
    for(const p of P){p.vy+=.32;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life++;
      ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,(200-p.life)/50));ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()}
    if(f<200&&document.getElementById('confetti')===cv)requestAnimationFrame(tick);else cv.remove();
  })();
}

/* ===== 47_theme.js — v0.10: temas de color (Predeterminado, Alegre, Oscuro y Personalizado) =====
   · «Predeterminado» no toca nada: es la identidad de cada edición.
   · Los demás ponen variables de color en <body> y clases (themed / theme-dark) que usa style_themes.css.
   · El tema oscuro solo se aplica en pantalla: todo lo que se imprime sale siempre en papel blanco.
   · Si el docente elige un color muy claro, los botones usan una versión más oscura del mismo color
     para que el texto blanco se lea (contraste mínimo 4.5 : 1). */
const HEX_RE=/^#[0-9A-Fa-f]{6}$/;
const THEMES=[
  {id:'default',name:'Predeterminado',desc:'Los colores de tu edición, tal como vienen.'},
  {id:'alegre',name:'Alegre',desc:'Morado, rosa y amarillo, con fondo de colores suaves.'},
  {id:'oscuro',name:'Oscuro',desc:'Fondo oscuro que cansa menos la vista en salones con poca luz o de noche.'},
  {id:'custom',name:'Personalizado',desc:'Tú eliges el color principal, el fondo y si es claro u oscuro.'}];
const THEME_IDS=THEMES.map(t=>t.id);
const ACCENT_SWATCHES=['#167F91','#2563EB','#7C3AED','#DB2777','#E8590C','#2F9E44','#B08900','#495057'];
const BG_SWATCHES=['#F3F6F9','#FFF4E6','#FDECF4','#EDF7EE','#EEF0FF','#F6F1E9'];
const ALEGRE={accent:'#7C3AED'};
const DARK_SURFACE='#18222C',DARK_PAGE='#10171E';
function defaultCustom(){return {accent:EDITION_ACCENT[EDITION].main.toUpperCase(),bg:EDITION==='Primaria'?'#FFF4E6':IS_TELE?'#FBF6F0':'#F3F6F9',base:'light'}}

/* --- color: luminancia y contraste (WCAG 2) --- */
function relLum(hex){return hexToRgb(hex).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}).reduce((a,v,i)=>a+v*[.2126,.7152,.0722][i],0)}
function contrast(a,b){const x=relLum(a),y=relLum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
function mix(a,b,p){const A=hexToRgb(a),B=hexToRgb(b);return rgbToHex(A.map((v,i)=>v+(B[i]-v)*p))}   /* p = cuánto de b */
function darkenFor(hex,against,min){let c=hex;for(let i=0;i<40&&contrast(c,against)<min;i++)c=mix(c,'#000000',.06);return c}
function lightenFor(hex,against,min){let c=hex;for(let i=0;i<40&&contrast(c,against)<min;i++)c=mix(c,'#FFFFFF',.08);return c}

/* Variables que se ponen en <body> según el tema; null = predeterminado (sin cambios) */
function themeVars(theme,custom){
  if(theme==='default')return null;
  const dark=theme==='oscuro'||(theme==='custom'&&custom.base==='dark');
  const src=theme==='alegre'?ALEGRE.accent:theme==='custom'?custom.accent:EDITION_ACCENT[EDITION].main;
  const accent=darkenFor(src,'#FFFFFF',4.5),accentDark=mix(accent,'#000000',.22);
  const v={'--brand':src,'--accent':accent,'--accent-dark':accentDark,'--nav-on':dark?mix(src,DARK_SURFACE,.72):mix(src,'#FFFFFF',.86)};
  v['--soft']=v['--nav-on'];
  if(dark){
    v['--accent-text']=lightenFor(src,DARK_SURFACE,4.5);
    v['--page-bg']=theme==='custom'?mix(custom.bg,DARK_PAGE,.9):DARK_PAGE;
    v['--welcome']=`linear-gradient(110deg,${accentDark},${accent})`;
  }else{
    v['--accent-text']=darkenFor(accentDark,'#FFFFFF',4.5);
    if(theme==='alegre'){v['--page-bg']='linear-gradient(135deg,#FFF3C4 0%,#FFE3EE 48%,#D9F6F0 100%)';v['--welcome']='linear-gradient(110deg,#6D28D9,#C026D3 52%,#E8590C)'}
    else{let bg=custom.bg;if(relLum(bg)<.72)bg=lightenFor(bg,'#000000',15.5);v['--page-bg']=bg;v['--welcome']=`linear-gradient(110deg,${accentDark},${accent})`}
  }
  v['--tint']=dark?DARK_PAGE:(theme==='custom'?custom.bg:'#FFF8E7');
  return {dark,vars:v};
}
let appliedVars=[];
function applyTheme(theme,custom){
  theme=theme||state.settings.theme;custom=custom||state.settings.custom;
  const b=document.body,t=themeVars(theme,custom);
  appliedVars.forEach(k=>b.style.removeProperty(k));appliedVars=[];
  b.classList.remove('themed','theme-dark','theme-alegre');
  b.dataset.theme=theme+(theme==='custom'?JSON.stringify(custom):'');
  if(!t)return;
  for(const [k,v] of Object.entries(t.vars)){b.style.setProperty(k,v);appliedVars.push(k)}
  b.classList.add('themed');if(t.dark)b.classList.add('theme-dark');if(theme==='alegre')b.classList.add('theme-alegre');
}
function setTheme(id){
  if(!THEME_IDS.includes(id))return;
  state.settings.theme=id;save();applyTheme();render();
  notify(`Tema «${THEMES.find(t=>t.id===id).name}» aplicado. Puedes cambiarlo cuando quieras.`,'success',{ms:4000});
}
function setCustom(key,val){
  const c=state.settings.custom;
  if(key==='base'){if(!['light','dark'].includes(val))return;c.base=val}
  else{if(!HEX_RE.test(val||''))return;c[key]=val.toUpperCase()}
  state.settings.theme='custom';save();applyTheme();
  /* sólo se redibuja el panel de colores para no perder el selector abierto */
  const box=document.getElementById('themeBox');if(box)box.outerHTML=themePanelHTML();
}
function resetCustom(){state.settings.custom=defaultCustom();state.settings.theme='custom';save();applyTheme();render();notify('Colores personalizados restablecidos.','info',{ms:4000})}

/* Miniatura de cada tema (dibujada con las mismas variables) */
function themeThumb(id){
  const t=themeVars(id,state.settings.custom),acc=t?t.vars['--accent']:EDITION_ACCENT[EDITION].main,dark=t&&t.dark;
  const page=t?t.vars['--page-bg']:(EDITION==='Primaria'?'linear-gradient(135deg,#FFF1E1,#F9F9FF 45%,#E9F9F4)':IS_TELE?'#FBF6F0':'#F0F5F8');
  const surf=dark?DARK_SURFACE:'#FFFFFF',line=dark?'#2F3E4D':'#DCE4EA',ink=dark?'#E4EBF2':'#203047';
  return `<span class="th-thumb" aria-hidden="true" style="background:${page}"><span class="th-bar" style="background:${surf};border-bottom:3px solid ${t?t.vars['--brand']:acc}"><i style="background:${acc}"></i><i style="background:${line}"></i><i style="background:${line}"></i></span><span class="th-card" style="background:${surf};border-color:${line}"><b style="background:${ink}"></b><span>${(dark?['#1C4A35','#4A3D10','#57222F']:['#D5F0E0','#FFF0B8','#FFD3D8']).map(c=>`<i style="background:${c}"></i>`).join('')}</span><em style="background:${acc}"></em></span></span>`;
}
function themePanelHTML(){
  const cur=state.settings.theme,c=state.settings.custom,t=themeVars('custom',c);
  const adj=t&&t.vars['--accent'].toUpperCase()!==c.accent.toUpperCase();
  return `<section class="panel section" id="themeBox"><h3>Colores de trabajo</h3><p class="muted">Elige cómo se ve tu programa. Solo cambia la pantalla de esta computadora: tus datos, tus archivos de Excel y lo que imprimes no cambian.</p>
  <div class="theme-grid" role="radiogroup" aria-label="Tema de colores">${THEMES.map(x=>`<button class="theme-card ${cur===x.id?'on':''}" role="radio" aria-checked="${cur===x.id}" data-theme-id="${x.id}" onclick="setTheme('${x.id}')">${themeThumb(x.id)}<b>${esc(x.name)}${cur===x.id?' ✓':''}</b><small>${esc(x.desc)}</small></button>`).join('')}</div>
  ${cur==='custom'?`<div class="custom-colors">
    <div class="cc-row"><b>Color principal</b><div class="swatches">${ACCENT_SWATCHES.map(h=>`<button class="sw ${c.accent===h?'on':''}" style="background:${h}" onclick="setCustom('accent','${h}')" aria-label="Color principal ${h}" aria-pressed="${c.accent===h}"></button>`).join('')}<label class="sw-pick">Otro <input type="color" id="ccAccent" value="${c.accent}" oninput="setCustom('accent',this.value)" aria-label="Elegir otro color principal"></label></div>
    ${adj?`<p class="helper">Tu color es claro: los botones usan un tono un poco más oscuro (<span class="sw-mini" style="background:${t.vars['--accent']}"></span>) para que su texto se lea bien.</p>`:''}</div>
    <div class="cc-row"><b>Fondo</b><div class="swatches">${BG_SWATCHES.map(h=>`<button class="sw bg ${c.bg===h?'on':''}" style="background:${h}" onclick="setCustom('bg','${h}')" aria-label="Fondo ${h}" aria-pressed="${c.bg===h}"></button>`).join('')}<label class="sw-pick">Otro <input type="color" id="ccBg" value="${c.bg}" oninput="setCustom('bg',this.value)" aria-label="Elegir otro color de fondo"></label></div></div>
    <div class="cc-row"><b>Base</b><div class="seg" role="radiogroup" aria-label="Base clara u oscura"><button class="seg-b ${c.base==='light'?'on':''}" role="radio" aria-checked="${c.base==='light'}" onclick="setCustom('base','light')">☀ Clara</button><button class="seg-b ${c.base==='dark'?'on':''}" role="radio" aria-checked="${c.base==='dark'}" onclick="setCustom('base','dark')">☾ Oscura</button></div></div>
    <div class="actions"><button class="secondary" onclick="resetCustom()">Restablecer mis colores</button><span class="helper">Los cambios se ven al momento y se guardan solos.</span></div></div>`:''}
  <p class="helper">Los colores de calificación (verde, amarillo y rojo) no cambian con el tema, para que siempre signifiquen lo mismo.</p></section>`;
}

/* ===== 50_views_a.js — navegación, Inicio, Grupos, Alumnos, Disciplinas, Asistencia, Historial ===== */

/* v0.12: Calificaciones = Calificar · Actividades · Cuaderno · Opciones del cuaderno (lo demás vive dentro de Opciones).
   v0.13: igual en Secundaria, que además conserva «Avance por PDA» como pestaña. */

const HUB_ALIAS=EDITION==='Primaria'?{rubricas:'opciones',rubros:'opciones',niveles:'opciones',pda:'proyectos',detallelibreta:'opciones',evaluar:'cuadricula'}:{rubricas:'opciones',rubros:'opciones',niveles:'opciones',detallelibreta:'opciones',evaluar:'cuadricula'};
HUBS[3]={tabs:EDITION==='Primaria'?[['cuadricula','🧮 Calificar'],['actividades','📝 Actividades'],['proyectos','📂 Proyectos'],['libreta','📒 Cuaderno'],['concentrado','📊 Concentrado'],['opciones','⚙️ Opciones del cuaderno']]
  :[['cuadricula','🧮 Calificar'],['actividades','📝 Actividades'],['proyectos','📂 Proyectos'],['libreta','📒 Cuaderno'],['concentrado','📊 Concentrado'],['pda','🎯 Avance por PDA'],['opciones','⚙️ Opciones del cuaderno']]};
function hubFor(v){return HUBS.find(h=>h.tabs.some(t=>t[0]===v||t[0]===HUB_ALIAS[v]))}
function subtabsHTML(hub){
  return `<nav class="subtabs" aria-label="Secciones">${hub.tabs.filter(t=>!t[2]||t[2]===EDITION||(t[2]==='Secundaria'&&IS_SEC)).map(([v,l])=>{const on=v===active||HUB_ALIAS[active]===v;return `<button class="subtab ${on?'on':''}" onclick="switchTo('${v}')" ${on?'aria-current="page"':''}>${ico(ICON_FOR_VIEW[v])} ${l.replace(/^\S+\s/,'')}</button>`}).join('')}</nav>`;
}
function highlightNav(){
  const top=NAV_TOP[active]||'more';
  document.querySelectorAll('.side > .nav[data-view]').forEach(x=>x.classList.toggle('on',x.dataset.view===top));
  const mb=document.getElementById('moreBtn');if(mb)mb.classList.toggle('on',top==='more');
  document.querySelectorAll('#moreMenu [data-view]').forEach(x=>x.classList.toggle('on',x.dataset.view===active||(x.dataset.view==='ruleta'&&active==='equipos')));
}
function setMenu(open){
  const m=document.getElementById('moreMenu'),b=document.getElementById('moreBtn');if(!m||!b)return;
  m.hidden=!open;b.setAttribute('aria-expanded',open?'true':'false');
}
function toggleMenu(){const m=document.getElementById('moreMenu');setMenu(m&&m.hidden)}
function switchTo(name){active=name;setMenu(false);highlightNav();render();window.scrollTo(0,0)}
function changeGroup(id){selectedGroup=id;gradeActivityId='';editingActivity='';render();setTimeout(periodRubrosCheck,0)}
function groupSelect(){
  const list=activeGroups();
  return `<select class="field" aria-label="Seleccionar grupo" onchange="changeGroup(this.value)">${list.map(g=>`<option value="${esc(g.id)}" ${selectedGroup===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select>`;
}
function title(a,b,c){document.getElementById('eyebrow').textContent=a;document.getElementById('page-title').textContent=b;document.getElementById('page-sub').textContent=c}
function emptyPanel(msg,btn){return `<section class="panel empty-state">${mascot(84)}<div class="empty">${msg}</div>${btn||''}</section>`}
const VIEWS={};
function render(){
  if(!activeGroups().some(g=>g.id===selectedGroup)){
    const pref=state.profile.group&&activeGroups().find(g=>g.id===state.profile.group);
    selectedGroup=pref?pref.id:(activeGroups()[0]?.id||'');
  }
  if(typeof applyTheme==='function'&&document.body.dataset.theme!==state.settings.theme+(state.settings.theme==='custom'?JSON.stringify(state.settings.custom):''))applyTheme();
  const c=document.getElementById('content'),g=group(),fn=VIEWS[active];
  if(!fn){active='inicio';return render()}
  document.body.dataset.view=active;
  document.querySelectorAll('.top .welcome-mini').forEach(x=>x.remove());
  fn(c,g);
  const hub=(active==='inicio')?null:hubFor(active);if(hub)c.insertAdjacentHTML('afterbegin',subtabsHTML(hub));
  highlightNav();if(typeof renderTopbar==='function')renderTopbar();if(!document.getElementById('quote'))renderQuoteBar();
}
function greeting(){const h=new Date().getHours();return h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches'}
function firstName(){
  const parts=(state.profile.teacher||'').split(/\s+/).filter(Boolean);
  while(parts.length>1&&/^(prof|profa|profr|mtro|mtra|lic|dr|dra|ing)\.?$/i.test(parts[0]))parts.shift();
  return parts[0]||'';
}

  else chip='<span class="chip warnchip">○ Lista de hoy: pendiente</span>';

  if(IS_SEC){
    const day=DAYS[(new Date().getDay()+6)%7],todays=state.profile.schedule.filter(x=>x.day===day).sort((a,b)=>a.start.localeCompare(b.start));

};
function createGroup(name){
  const gr={id:gid(),name,level:EDITION,archived:false,students:[],grade:gradeFromName(name)};if(IS_SEC)gr.disciplines=IS_TELE?teleDisciplinas(gr.grade):[];

  const g=state.groups.find(x=>x.id===id);if(!g)return;

  const g=state.groups.find(x=>x.id===id);if(!g)return;

function toggleDiscipline(id,on){
  const g=group();if(!g||g.level==='Primaria'||!DISCIPLINAS.some(d=>d.id===id))return;
  if(!on&&state.activities.some(a=>a.groupId===g.id&&a.scopeId===id)){warn('Esta disciplina ya tiene actividades guardadas (incluso ocultas). No se puede quitar hasta eliminarlas o pasarlas a otra.');render();return}
  if(!on&&state.profile.schedule.some(x=>x.groupId===g.id&&x.scopeId===id)){warn('Esta disciplina está en tu horario. Quita primero esas clases del horario.');render();return}
  g.disciplines=on?[...new Set([...g.disciplines,id])]:g.disciplines.filter(x=>x!==id);scopeByGroup[g.id]='';save();render();
}

  ${baja.length?`<details class="import-panel"><summary>Alumnos retirados (${baja.length})</summary><p class="helper">Conservan su historial de asistencia y calificaciones, pero ya no aparecen en listas, cuaderno ni reportes.</p>${baja.map(s=>`<div class="flex review-item"><b>${esc(s.name)}</b><button class="secondary" onclick="reactivateStudent('${s.id}')">Regresar al grupo</button><button class="danger" onclick="purgeStudent('${s.id}')">Borrar para siempre</button></div>`).join('')}</details>`:''}`:emptyPanel('Primero crea un grupo.',`<div class="actions"><button class="primary big" onclick="switchTo('grupos')">Crear mi primer grupo</button></div>`)}</section>`;

function filterStudents(q){
  studentQuery=q;const n=normName(q);let shown=0;
  document.querySelectorAll('#studentTable tbody tr[data-name]').forEach(tr=>{const hit=!n||tr.dataset.name.includes(n);tr.classList.toggle('hidden',!hit);if(hit)shown++});
  const cnt=document.getElementById('studentCount');if(cnt)cnt.textContent=(n?shown+' de ':'')+roster(group()).length+' alumnos';
  const nm=document.getElementById('studentNoMatch');if(nm)nm.classList.toggle('hidden',shown>0||!n);
}
function studentNameTaken(g,name,exceptId){const n=normName(name);return g.students.some(s=>s.id!==exceptId&&normName(s.name)===n)}
function sortRoster(g){g.students.sort((a,b)=>a.name.localeCompare(b.name,'es',{sensitivity:'base'}))}
function addStudent(){
  const g=group(),n=document.getElementById('studentName').value.trim().slice(0,130);
  if(!g||!n)return warn('Escribe el nombre del alumno.');
  if(studentNameTaken(g,n))return warn('Ese alumno ya está en este grupo (no importan mayúsculas ni acentos).');
  g.students.push({id:gid(),name:n});sortRoster(g);save();render();
  const f=document.getElementById('studentName');if(f)f.focus();
}
function renameStudent(id){
  const g=group(),s=g?.students.find(x=>x.id===id);if(!s)return;
  const n=prompt('Nombre del alumno:',s.name);if(n===null)return;
  const t=n.trim().slice(0,130);if(!t)return warn('El nombre no puede quedar vacío.');
  if(studentNameTaken(g,t,id))return warn('Ya hay otro alumno con ese nombre en este grupo.');
  s.name=t;sortRoster(g);save();render();notify('Nombre corregido. Sus notas y asistencias se conservan.','success');   /* el id no cambia */
}
/* Agrega varios nombres evitando repetidos; devuelve {added, skipped[]} */
function addStudentsBulk(g,names){
  const seen=new Set(g.students.map(x=>normName(x.name)));let added=0;const skipped=[];
  for(const raw of names){
    const name=String(raw).trim().replace(/\s+/g,' ');if(!name)continue;
    if(name.length>130){skipped.push(name.slice(0,30)+'…');continue}
    const k=normName(name);if(seen.has(k)){skipped.push(name);continue}
    g.students.push({id:gid(),name});seen.add(k);added++;
  }
  sortRoster(g);return {added,skipped};
}
function pasteStudents(){
  const g=group(),raw=document.getElementById('studentsPaste')?.value||'';if(!g)return;
  const rows=raw.split(/\r?\n/).map(x=>x.split('\t')[0].trim()).filter(Boolean).filter(x=>!/^(nombre|nombres|alumno|alumnos|nombre completo)$/i.test(x));
  if(!rows.length)return warn('Pega uno o más nombres.');
  const r=addStudentsBulk(g,rows);save();render();
  notify(r.added+' alumnos agregados.'+(r.skipped.length?`\n${r.skipped.length} omitidos por estar repetidos o ser muy largos:\n• `+r.skipped.slice(0,6).join('\n• ')+(r.skipped.length>6?'\n• …':''):''),r.added?'success':'info');
}
function removeStudent(id){
  const g=group(),s=g?.students.find(x=>x.id===id);if(!s)return;
  withUndo(`«${s.name}» salió del grupo (su historial se conserva)`,()=>{s.inactive=true});
}
function reactivateStudent(id){const s=group()?.students.find(x=>x.id===id);if(!s)return;delete s.inactive;save();render();notify(`«${s.name}» regresó al grupo.`,'success')}
function purgeStudent(id){
  const g=group(),s=g?.students.find(x=>x.id===id);if(!s||!s.inactive)return;
  const nGr=[state.grades,state.marks,state.rscores,state.obs].reduce((n,m)=>n+Object.keys(m).filter(k=>k.endsWith('|'+id)).length,0),nAt=Object.values(state.attendance).filter(r=>r[id]!==undefined).length;
  if(!confirm(`BORRAR PARA SIEMPRE a «${s.name}»\n\nSe borrarán sus ${nGr} calificaciones y sus ${nAt} registros de asistencia. Esto NO se puede deshacer.\n\nSi no estás seguro, toca Cancelar: puedes dejarlo como retirado.`))return;
  g.students=g.students.filter(x=>x.id!==id);
  for(const m of [state.grades,state.marks,state.rscores,state.obs])for(const k of Object.keys(m))if(k.endsWith('|'+id))delete m[k];
  for(const k of Object.keys(state.studentNotes))if(k.split('|')[1]===id)delete state.studentNotes[k];
  for(const k of Object.keys(state.attendance))delete state.attendance[k][id];
  delete state.extra[g.id+'|'+id];
  (state.teamSets[g.id]||[]).forEach(set=>set.teams.forEach(t=>{t.students=t.students.filter(x=>x!==id)}));
  state.attendanceLog=state.attendanceLog.filter(e=>e.s!==id);
  save();render();notify('Alumno borrado definitivamente.','info');
}

/* ---------- Asistencia: todos presentes por defecto; se toca sólo a quien faltó ---------- */
let attFlash='',attFocus='';
function attKey(g,d){return g.id+'|'+d}
function attStatusOf(g,date,sid){const rec=state.attendance[attKey(g,date)];return (rec&&rec[sid])||'P'}
function ensureRecord(g,date){
  const k=attKey(g,date);if(!state.attendance[k])state.attendance[k]={};const rec=state.attendance[k];
  roster(g).forEach(s=>{if(rec[s.id]===undefined)rec[s.id]='P'});return rec;
}
/* v0.22: días sin clases (solo para el grupo donde se marca) */
const NC_REASONS={cte:'CTE (Consejo Técnico Escolar)',susp:'Suspensión de clases',fest:'Día festivo',otro:'Otro'};
const NC_ICON={cte:'🏫',susp:'⛔',fest:'🎉',otro:'📝'};
function noClassOf(g,d){return g?state.noClass[g.id+'|'+d]||null:null}
function noClassName(o){return o?(o.r==='otro'?(o.t||'Sin clases'):NC_REASONS[o.r]):''}
function noClassShort(o){return o?(o.r==='cte'?'CTE':o.r==='susp'?'SUSPENSIÓN DE CLASES':o.r==='fest'?'DÍA FESTIVO':(o.t||'SIN CLASES').toUpperCase()):''}
function openNoClass(){
  const g=group();if(!g)return;
  openModal(`<h2>🚫 No hubo clases</h2><p>¿Por qué no hubo clases el <b>${esc(fmtIso(currentDate))}</b> con <b>${esc(g.name)}</b>? El día queda registrado, <b>no cuenta como falta</b> y en el formato oficial sale con su leyenda.</p>
    <div class="nc-reasons">${['cte','susp','fest'].map(r=>`<button class="secondary big" onclick="setNoClass('${r}')">${NC_ICON[r]} ${NC_REASONS[r]}</button>`).join('')}</div>
    <label>Otro motivo<div class="flex"><input class="field" id="ncOther" maxlength="60" placeholder="Ej. Evento cívico, junta de padres…" onkeydown="if(event.key==='Enter')setNoClass('otro')"><button class="primary" onclick="setNoClass('otro')">Guardar</button></div></label>
    <p class="helper">Solo se marca en este grupo. Si en otro grupo tampoco hubo clases, márcalo también allá.</p>
    <div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button></div>`,{label:'No hubo clases'});
}
function setNoClass(r){
  const g=group();if(!g)return;const k=attKey(g,currentDate);let t='';
  if(r==='otro'){t=(document.getElementById('ncOther')?.value||'').trim();if(!t)return warn('Escribe el motivo.')}
  const o={r,t};const had=state.attendance[k];
  if(had&&Object.keys(had).length){o.m=had;delete state.attendance[k]}   /* la lista que había se guarda aparte, no se borra */
  state.noClass[k]=o;save();closeModal();
  attFlash=`${fmtIso(currentDate)}: sin clases (${noClassName(o)}). Queda registrado y no cuenta como falta.`;render();
}
function removeNoClass(){
  const g=group();if(!g)return;const k=attKey(g,currentDate),o=state.noClass[k];if(!o)return;
  if(o.m&&!state.attendance[k])state.attendance[k]=o.m;   /* regresa la lista que había */
  delete state.noClass[k];save();attFlash=o.m?'Se quitó «sin clases» y regresó la lista que habías pasado ese día.':'Se quitó «sin clases». Ya puedes pasar lista ese día.';render();
}

function logAttendance(sid,from,to){
  if(from===to)return;
  state.attendanceLog.push({t:Date.now(),g:selectedGroup,d:currentDate,s:sid,from:from||'-',to});
  if(state.attendanceLog.length>3000)state.attendanceLog=state.attendanceLog.slice(-3000);
}
function toggleAttendance(sid){const g=group();if(!g)return;setAttendance(sid,attStatusOf(g,currentDate,sid)==='P'?'F':'P')}
function setAttendance(id,status){
  const g=group();if(!g||!ATT_CODES.includes(status))return;
  const rec=ensureRecord(g,currentDate);logAttendance(id,rec[id],status);rec[id]=status;save();attFocus=id;render();
}
function saveList(){
  const g=group();if(!g)return;const had=!!state.attendance[attKey(g,currentDate)];ensureRecord(g,currentDate);save();
  const ros=roster(g),f=ros.filter(s=>attStatusOf(g,currentDate,s.id)!=='P').length;
  attFlash=`Lista del ${fmtIso(currentDate)} ${had?'actualizada':'guardada'}: ${ros.length-f} presentes${f?` y ${f} con falta`:''}.`;render();
}
function downloadAttendance(){
  const g=group();if(!g)return;
  csvDownload('asistencia_'+safeName(g.name)+'_'+currentDate+'.csv',[['Alumno','Fecha','Estado'],...roster(g).map(s=>[s.name,currentDate,ATT_NAMES[attStatusOf(g,currentDate,s.id)]])]);
}

/* ---------- Historial de asistencia ---------- */
/* Para cada alumno sólo cuentan los días en que tiene registro (un alumno que llegó después no «debe» faltas anteriores) */
function attendanceStats(g,from,to){
  const days=Object.keys(state.attendance).filter(k=>k.startsWith(g.id+'|')).map(k=>k.split('|')[1]).filter(d=>(!from||d>=from)&&(!to||d<=to)).sort();
  const withJ=state.settings.attRule==='withJustified';
  return {days,rows:roster(g).map(s=>{
    const n={P:0,F:0,FJ:0,FI:0};let counted=0;
    days.forEach(d=>{const x=state.attendance[g.id+'|'+d][s.id];if(x===undefined)return;n[x]++;counted++});
    const assisted=n.P+(withJ?n.FJ:0);return {s,n,counted,pct:counted?Math.round(assisted/counted*100):null};
  })};
}

  const log=state.attendanceLog.filter(e=>e.g===g.id).slice(-50).reverse(),nameOf=id=>g.students.find(s=>s.id===id)?.name||'Alumno borrado';

  <p class="hint">El porcentaje = ${rule==='strict'?'asistencias':'asistencias + faltas justificadas'} ÷ días con lista${(attRange.from||attRange.to)?' en las fechas elegidas':''}. Tú decides la regla: el programa <b>no reprueba ni sanciona automáticamente</b>.</p>

  <details class="import-panel"><summary>Cambios que hiciste (últimos ${log.length})</summary>${log.length?`<div class="table-wrap"><table class="rows"><thead><tr><th>Cuándo</th><th>Lista del día</th><th>Alumno</th><th>Cambio</th></tr></thead><tbody>${log.map(e=>`<tr><td>${esc(new Date(e.t).toLocaleString('es-MX'))}</td><td>${esc(fmtIso(e.d))}</td><td>${esc(nameOf(e.s))}</td><td>${e.from==='-'?'Registro inicial':esc(ATT_NAMES[e.from])} → <b>${esc(ATT_NAMES[e.to])}</b></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Todavía no hay cambios anotados.</p>'}</details></section>`;

function setAttSetting(key,val){

  state.groups=state.groups.filter(g=>!demo.includes(g));

  p.onboarded=true;selectedGroup=gr.id;scopeByGroup={};save();
  const n=wiz.names=[];wiz={step:1,teacher:'',school:'',cycle:defaultCycle(),group:'',disc:[],names:[],fileName:''};
  switchTo('inicio');
  notify(`¡Todo listo! Tu grupo «${gr.name}» tiene ${r.added} alumnos.`+(r.added?'':' Agrégalos en «Mi grupo» cuando quieras.'),'success',{ms:10000});
}

/* ---------- Ruleta ---------- */
let rouletteRevealing=false,rouletteToken=0;
VIEWS.ruleta=function(c,g){
  title('HERRAMIENTAS DIDÁCTICAS','Ruleta de alumnos','Participación al azar, de manera divertida y transparente.');
  const pool=roster(g),chosen=rouletteRemaining[selectedGroup]||[],eligible=pool.filter(s=>!chosen.includes(s.id));
  const shownWinner=(!rouletteRevealing&&rouletteWinner)?pool.find(s=>s.id===rouletteWinner):null;
  c.innerHTML=`<section class="panel"><div class="flex">${groupSelect()}<button class="secondary" onclick="resetRoulette()">↻ Reiniciar sorteos</button><button class="secondary" onclick="downloadExtras()">↓ Exportar puntos CSV</button></div>
  <div class="roulette-grid"><div class="wheel-section"><canvas id="wheel" width="460" height="460" aria-label="Ruleta de selección de estudiantes; los nombres están ocultos"></canvas><button class="primary spin-button" ${!eligible.length||rouletteBusy?'disabled':''} onclick="spinWheel()">◉ ${rouletteBusy?'Girando...':'GIRAR RULETA'}</button><p class="helper">${eligible.length} alumnos pendientes de salir de ${pool.length}. Cada alumno sale una vez por ronda.</p></div>
  <div class="winner-panel"><h3>Alumno seleccionado</h3><div class="winner-name ${shownWinner?'shown':'hidden'}" id="winnerName" aria-live="polite">${shownWinner?esc(shownWinner.name):'?'}</div>${shownWinner?'':'<p class="helper mystery">Los nombres están ocultos: ¡es cuestión de suerte! Gira la ruleta para descubrir quién es.</p>'}<p class="muted">Puedes otorgar o descontar puntos por participación.</p><div class="actions"><button class="primary" onclick="modifyExtra(1)">+ 1 punto</button><button class="danger" onclick="modifyExtra(-1)">− 1 punto</button></div>
  <h3>Puntos del grupo</h3><div class="table-wrap"><table class="rows"><thead><tr><th>Alumno</th><th>Puntos</th></tr></thead><tbody>${pool.map(s=>`<tr><td>${esc(s.name)}</td><td><b>${state.extra[selectedGroup+'|'+s.id]||0}</b></td></tr>`).join('')}</tbody></table></div></div></div></section>`;
  drawWheel(eligible);
};
function resetRoulette(){rouletteToken++;rouletteRevealing=false;rouletteRemaining[selectedGroup]=[];rouletteWinner=null;rouletteAngle=0;render()}
function modifyExtra(delta){if(rouletteRevealing)return;if(!rouletteWinner)return warn('Primero gira la ruleta.');const id=selectedGroup+'|'+rouletteWinner;state.extra[id]=(state.extra[id]||0)+delta;save();render()}
function downloadExtras(){const g=group();if(!g)return;csvDownload('puntos_'+safeName(g.name)+'.csv',[['Alumno','Puntos extra'],...roster(g).map(s=>[s.name,state.extra[selectedGroup+'|'+s.id]||0])])}
function drawWheel(students){
  const cv=document.getElementById('wheel');if(!cv)return;
  const ctx=cv.getContext('2d'),w=cv.width,c=w/2,r=c-14;ctx.clearRect(0,0,w,w);const n=students.length;
  if(!n){ctx.fillStyle='#ecf3f5';ctx.beginPath();ctx.arc(c,c,r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#31576b';ctx.textAlign='center';ctx.font='bold 22px sans-serif';ctx.fillText('Ronda finalizada',c,c);return}
  const colors=ROULETTE_COLORS;
  for(let i=0;i<n;i++){
    const a=rouletteAngle+(i/n)*Math.PI*2-Math.PI/2,step=Math.PI*2/n,col=colors[i%colors.length];
    ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,r,a,a+step);ctx.closePath();ctx.fillStyle=col;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    /* Los nombres están ocultos: cada gajo lleva un signo de interrogación (derecho, no girado) */
    const mx=c+Math.cos(a+step/2)*r*.72,my=c+Math.sin(a+step/2)*r*.72,fs=Math.max(12,Math.min(36,Math.round(Math.PI*2*r*.72/n*.75)));
    ctx.save();ctx.fillStyle=textOn(col);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold '+fs+'px sans-serif';ctx.fillText('?',mx,my);ctx.restore();
  }
  ctx.beginPath();ctx.arc(c,c,23,0,Math.PI*2);ctx.fillStyle='white';ctx.fill();ctx.fillStyle='#173348';ctx.font='bold 19px sans-serif';ctx.textAlign='center';ctx.fillText('★',c,c+7);
  ctx.fillStyle='#1a3549';ctx.beginPath();ctx.moveTo(c-12,5);ctx.lineTo(c+12,5);ctx.lineTo(c,29);ctx.fill();
}
function spinWheel(){
  if(rouletteBusy)return;const pool=roster(group()),used=rouletteRemaining[selectedGroup]||[],students=pool.filter(s=>!used.includes(s.id));
  if(!students.length)return warn('Todos participaron. Reinicia los sorteos.');
  rouletteBusy=true;rouletteWinner=null;rouletteRevealing=false;rouletteToken++;
  const n=students.length,winnerIndex=Math.floor(Math.random()*n),step=2*Math.PI/n,start=rouletteAngle;
  const final=((2*Math.PI-step*(winnerIndex+.5))%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
  const delta=((final-start)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)+Math.PI*2*5,frames=100;let frame=0;
  document.querySelector('.spin-button').disabled=true;
  function animate(){
    const t=++frame/frames,e=1-Math.pow(1-t,4);rouletteAngle=(start+delta*e)%(2*Math.PI);drawWheel(students);
    if(frame<frames){requestAnimationFrame(animate)}
    else{rouletteBusy=false;rouletteWinner=students[winnerIndex].id;(rouletteRemaining[selectedGroup]=rouletteRemaining[selectedGroup]||[]).push(rouletteWinner);rouletteAngle=0;rouletteRevealing=true;const tk=++rouletteToken;render();
      setTimeout(()=>{ /* pequeña pausa de suspenso y luego aparece el nombre */
        if(tk!==rouletteToken)return;rouletteRevealing=false;
        const el=document.getElementById('winnerName'),w=roster(group()).find(x=>x.id===rouletteWinner);
        if(el&&w){el.textContent=w.name;el.className='winner-name shown pop';document.querySelector('.mystery')?.remove()}
        confetti();
      },900)}
  }
  requestAnimationFrame(animate);
}

/* Semáforo sobre escala 0–10: verde 8–10 · amarillo 6–7.9 · rojo < 6. Siempre se muestra también el número. */
function gradeClass(v,max){const t=Number(v)/Number(max)*10,c=levelCuts();return t>=c.ne?'g-ok':t>=c.ep?'g-mid':'g-low'}
function avgHTML(v){return v===null?'<span class="muted">Sin calificaciones</span>':`<span class="avgpill ${gradeClass(v,10)}">${numfmt(v)}</span>`}
const DENS=[['compact','Compacta'],['normal','Normal'],['wide','Amplia']];
function modeOf(a){return a.mode||'num'}
/* Etiqueta corta bajo el nombre de la columna */
function colTag(a){
  const m=modeOf(a),nc=(m==='icon'||m==='level')&&a.counts===false?' · no cuenta':'';
  return ({num:'/ '+a.max,icon:'✓ ½ ✗',level:'Nivel',rubric:(a.rubric?.kind==='cotejo'?'Cotejo':'Rúbrica'),text:'Texto'})[m]+nc;
}
/* Casilla de captura según la forma de calificar (la usan la cuadrícula y la pantalla de Actividades) */
function cellHTML(a,st){
  const m=modeOf(a),k=a.id+'|'+st.id,lab=`${esc(st.name)}, ${esc(a.name)}`,base=`data-a="${a.id}" data-s="${st.id}" onkeydown="gridKey(event)"`;
  if(m==='icon'||m==='level'){
    const list=m==='icon'?ICON_MARKS:LEVEL_MARKS,mk=list.find(x=>x.c===state.marks[k]);
    const keys=list.map((x,i)=>`${i+1} = ${x.name}`).join(', ');
    return `<button class="gcell gmark ${mk?mk.cls:''}" ${base} data-mode="${m}" onclick="cycleMark(this)" title="Toca para cambiar · ${esc(keys)} · Supr = vacío" aria-label="${lab}: ${mk?esc(mk.name):'sin calificar'}">${mk?esc(mk.sym):''}</button>`;
  }
  if(m==='rubric'){
    const r=rubricResult(a,st.id),v=r.frac===null?null:r.frac*a.max;
    const txt=v!==null?numfmt(round2(v)):r.done?`${r.done}/${r.total}`:'Evaluar';
    return `<button class="gcell grub ${v!==null?gradeClass(v,a.max):r.done?'partial':'todo'}" ${base} onclick="openRubricEval('${a.id}','${st.id}')" aria-label="${lab}: ${v!==null?'nota '+numfmt(round2(v)):r.done?r.done+' de '+r.total+' criterios':'sin evaluar'}. Abrir la rúbrica">${txt}</button>`;
  }
  if(m==='text'){
    const t=state.obs[k]||'';
    return `<input class="gcell gtext" type="text" maxlength="300" ${base} value="${esc(t)}" title="${esc(t)}" aria-label="Observación: ${lab}" onchange="setObs(this)">`;
  }
  const v=state.grades[k];
  return `<input class="gcell ${v===undefined?'':gradeClass(v,a.max)}" type="number" min="0" max="${a.max}" step="0.01" inputmode="decimal" ${base} value="${v===undefined?'':esc(v)}" aria-label="${lab}" onfocus="this.select()" onchange="setCell(this)">`;
}
function colAverage(a,ros){
  if(modeOf(a)==='text'){const n=ros.filter(s=>state.obs[a.id+'|'+s.id]).length;return n?n+' notas':'—'}
  const xs=ros.map(s=>scoreOf(a,s.id)).filter(x=>x!==undefined);return xs.length?numfmt(round2(xs.reduce((p,q)=>p+q,0)/xs.length)):'—';
}

function setCell(input){
  const aid=input.dataset.a,sid=input.dataset.s,a=state.activities.find(x=>x.id===aid);if(!a)return;
  const key=aid+'|'+sid,raw=input.value.trim();
  if(raw===''){delete state.grades[key];input.className='field gcell'}
  else{
    const n=Number(raw);
    if(!Number.isFinite(n)||n<0||n>a.max){warn(`La nota debe estar entre 0 y ${a.max}.`);const prev=state.grades[key];input.value=prev===undefined?'':prev;return}
    state.grades[key]=n;input.className='field gcell '+gradeClass(n,a.max);
  }

}
/* ✓ ◐ ✗ y niveles: cada toque pasa a la siguiente marca; después de la última queda vacía */
function setMark(btn,code){
  const a=state.activities.find(x=>x.id===btn.dataset.a);if(!a)return;
  const list=modeOf(a)==='icon'?ICON_MARKS:LEVEL_MARKS,key=a.id+'|'+btn.dataset.s,mk=list.find(x=>x.c===code);
  if(mk)state.marks[key]=mk.c;else delete state.marks[key];
  btn.className='gcell gmark '+(mk?mk.cls:'');btn.textContent=mk?mk.sym:'';
  const st=roster(group()).find(s=>s.id===btn.dataset.s);btn.setAttribute('aria-label',`${st?st.name:''}, ${a.name}: ${mk?mk.name:'sin calificar'}`);
  save();refreshGrid();
}
function cycleMark(btn){
  const a=state.activities.find(x=>x.id===btn.dataset.a);if(!a)return;
  const list=modeOf(a)==='icon'?ICON_MARKS:LEVEL_MARKS,i=list.findIndex(x=>x.c===state.marks[a.id+'|'+btn.dataset.s]);
  setMark(btn,i+1<list.length?list[i+1].c:'');
}
function setObs(input){
  const a=state.activities.find(x=>x.id===input.dataset.a);if(!a)return;
  const key=a.id+'|'+input.dataset.s,t=input.value.replace(/\s+/g,' ').trim().slice(0,300);
  if(t)state.obs[key]=t;else delete state.obs[key];input.value=t;input.title=t;save();refreshGrid();

/* Actualiza promedios y colores sin volver a dibujar la tabla (así no se pierde el foco ni la posición) */
function refreshGrid(){
  const g=group();if(!g)return;const arr=scopedActivities(g),sc={id:scopeId(g)},ros=roster(g);
  ros.forEach(st=>{const cell=document.getElementById('avg_'+st.id);if(cell)cell.innerHTML=avgHTML(averageInScope(g,sc,st,arr))});
  arr.forEach(a=>{const cell=document.getElementById('col_'+a.id);if(cell)cell.textContent=colAverage(a,ros)});
  const sel=state.activities.find(a=>a.id===gradeActivityId);
  if(sel)ros.forEach(st=>{const cell=document.getElementById('prog_'+st.id);if(cell)cell.innerHTML=progressChip(sel,st.id)});
}
function gridKey(e){
  const t=e.target,isMark=t.classList.contains('gmark');
  if(isMark){
    const a=state.activities.find(x=>x.id===t.dataset.a),list=a&&modeOf(a)==='icon'?ICON_MARKS:LEVEL_MARKS;
    if(/^[1-9]$/.test(e.key)&&list[Number(e.key)-1]){e.preventDefault();setMark(t,list[Number(e.key)-1].c);return}
    if(['Delete','Backspace','0'].includes(e.key)){e.preventDefault();setMark(t,'');return}
  }
  if(!['Enter','ArrowDown','ArrowUp'].includes(e.key))return;
  const table=t.closest('table');if(!table)return;
  const col=[...table.querySelectorAll(`.gcell[data-a="${t.dataset.a}"]`)],i=col.indexOf(t);
  e.preventDefault();if(e.key==='Enter'&&t.tagName==='INPUT')t.dispatchEvent(new Event('change'));
  const up=e.key==='ArrowUp'||(e.key==='Enter'&&e.shiftKey),n=col[up?i-1:i+1];if(n){n.focus();if(n.select)n.select()}
}
function fillColumn(aid,mode){
  const sw=document.querySelector('.sheet-wrap'),sl=sw?sw.scrollLeft:0,st=sw?sw.scrollTop:0;setTimeout(()=>{const w=document.querySelector('.sheet-wrap');if(w){w.scrollLeft=sl;w.scrollTop=st}},0);
  const g=group(),a=state.activities.find(x=>x.id===aid);if(!g||!a)return;
  const md=modeOf(a),arr=scopedActivities(g),idx=arr.findIndex(x=>x.id===aid),prev=idx>0?arr[idx-1]:null,todo=[];
  roster(g).forEach(s=>{
    const k=aid+'|'+s.id;if(hasEvaluation(a,s.id))return;
    if(mode==='max'){if(md==='num')todo.push([state.grades,k,a.max]);else if(md==='icon')todo.push([state.marks,k,'OK']);else if(md==='level')todo.push([state.marks,k,'NE'])}
    else if(md==='num'&&prev&&modeOf(prev)==='num'){const pv=state.grades[prev.id+'|'+s.id];if(pv!==undefined)todo.push([state.grades,k,round2(pv/prev.max*a.max)])}
  });
  if(!todo.length)return notify(mode==='max'?'Todos los alumnos ya tienen nota en esta actividad.':'No hay notas anteriores que copiar en casillas vacías.','info');
  const what=mode==='max'?(md==='num'?`puestas con el máximo (${a.max})`:md==='icon'?'marcadas con ✓':'marcadas con «Nivel esperado»'):`copiadas de «${prev.name}»`;
  /* withUndo guarda una copia del estado: las referencias a los mapas se toman de nuevo dentro */
  withUndo(`${todo.length} notas ${what} en «${a.name}»`,()=>{todo.forEach(([map,k,v])=>{(map===state.grades?state.grades:state.marks)[k]=v})});
}
function manageActivity(aid){gradeActivityId=aid;editingActivity='';switchTo('actividades')}
function quickAddActivity(){

  const r=readActivityForm('q',g);if(!r.ok)return warn(r.msg);
  const a=createActivity(g,{...r.data,date:todayISO()});if(!a)return;
  notify(`Actividad «${a.name}» creada. ${a.mode==='rubric'?'Toca una casilla para evaluar con la rúbrica.':'Ya puedes capturar.'}`,'success');
  const first=document.querySelector(`#gradeGrid .gcell[data-a="${a.id}"]`);if(first)first.focus();
}

/* ===== 58_rubrics.js — v0.9: rúbricas y listas de cotejo (biblioteca, editor, evaluación de un clic, compartir por archivo) =====
   · La biblioteca (state.rubrics) y el banco (RUBRIC_BANK) son plantillas.
   · Al crear una actividad «Rúbrica» se guarda una COPIA dentro de la actividad: editar la plantilla después no cambia notas ya puestas.
   · Lo que se califica se guarda en state.rscores['actividad|alumno'] = {idCriterio: índiceDeNivel}. La nota se calcula sola (rubricResult). */

/* ---------- Tabla de solo lectura (vista previa e impresión) ---------- */
function rubricTableHTML(r,opt){
  opt=opt||{};const tw=r.criteria.reduce((a,c)=>a+c.w,0)||1,pct=c=>Math.round(c.w/tw*1000)/10;
  if(r.kind==='cotejo')return `<table class="rubtable cotejo"><thead><tr><th>Criterio</th><th>Vale</th><th>Sí</th><th>No</th></tr></thead><tbody>${r.criteria.map(c=>`<tr><td>${esc(c.n)}</td><td class="num">${numfmt(pct(c))} %</td><td class="box"></td><td class="box"></td></tr>`).join('')}</tbody></table>`;
  return `<table class="rubtable"><thead><tr><th>Criterio</th>${r.levels.map(l=>`<th>${esc(l.n)}<small>${numfmt(l.p)} pts</small></th>`).join('')}</tr></thead><tbody>${r.criteria.map(c=>`<tr><th scope="row">${esc(c.n)}<small>Vale ${numfmt(pct(c))} %</small></th>${r.levels.map((l,j)=>`<td>${esc(c.d[j]||'')}</td>`).join('')}</tr>`).join('')}</tbody></table>${opt.note===false?'':`<p class="helper">Nota = suma de (peso × puntos del nivel) ÷ (suma de pesos × ${numfmt(rubricMaxPts(r))}) × 10.</p>`}`;
}

function toggleRubView(id){rubView=rubView===id?'':id;render()}
function uniqueRubricName(name,exceptId){
  const taken=new Set(state.rubrics.filter(r=>r.id!==exceptId).map(r=>normName(r.name)));let n=name.slice(0,100),k=2;
  while(taken.has(normName(n))){const t=' ('+k++ +')';n=name.slice(0,100-t.length)+t}return n;
}
function newRubric(kind){

function editRubric(id){const r=state.rubrics.find(x=>x.id===id);if(!r)return;rubEdit={ctx:'lib',id,draft:copy(r),locked:false};render();window.scrollTo(0,0)}
function copyRubric(id){

  const r=normalizeRubric({...copy(src),id:gid()});r.criteria.forEach(c=>{c.id=gid();c.pda=''});r.name=uniqueRubricName((src.bank?src.name:'Copia de '+src.name));

}

/* ---------- Editor (biblioteca o rúbrica de una actividad) ---------- */
function rubricEditorHTML(){
  const e=rubEdit,d=e.draft,cot=d.kind==='cotejo',lk=e.locked,tw=d.criteria.reduce((a,c)=>a+(Number(c.w)>0?Number(c.w):0),0)||1;
