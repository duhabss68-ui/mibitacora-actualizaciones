/* ===== 65_autobackup.js — copia automática en una carpeta (File System Access API) + recordatorio ===== */
/* Solo funciona en Chrome/Edge. Si el navegador no lo permite, se muestra un recordatorio para guardar la copia a mano. */
const AB={supported:typeof window.showDirectoryPicker==='function',handle:null,name:'',perm:'none',last:'',err:'',timer:null,warned:false};
function abIdb(){return new Promise((res,rej)=>{const r=indexedDB.open('aulagestion_ab_'+EDITION,1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function abIdbGet(){try{const db=await abIdb();return await new Promise(res=>{const q=db.transaction('h').objectStore('h').get('dir');q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}catch(e){return null}}
async function abIdbSet(v){try{const db=await abIdb();await new Promise((res,rej)=>{const tx=db.transaction('h','readwrite');v?tx.objectStore('h').put(v,'dir'):tx.objectStore('h').delete('dir');tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){}}
function abLastRead(){try{AB.last=localStorage.getItem(KEY+'_ablast')||''}catch(e){}}
async function abLoad(){
  abLastRead();if(!AB.supported){renderTopbar();return}
  const h=await abIdbGet();
  if(h){AB.handle=h;AB.name=h.name;try{AB.perm=await h.queryPermission({mode:'readwrite'})}catch(e){AB.perm='prompt'}}
  /* v0.15.1: el navegador exige volver a dar permiso al reabrir. En vez de mostrar un aviso, se pide solo
     con el primer toque o tecla (un clic en «Permitir»; si ofrece «Permitir en cada visita», mejor). */
  if(AB.handle&&AB.perm!=='granted'&&!AB.armed){AB.armed=true;
    const once=()=>{document.removeEventListener('pointerdown',once,true);document.removeEventListener('keydown',once,true);abAutoAsk()};
    document.addEventListener('pointerdown',once,true);document.addEventListener('keydown',once,true)}
  renderTopbar();if(active==='datos')render();
}
async function abChoose(){
  if(!AB.supported)return warn('Este navegador no permite elegir una carpeta. Usa Chrome o Edge, o guarda tu copia a mano.');
  try{
    const h=await window.showDirectoryPicker({mode:'readwrite',id:'aulagestion'});
    AB.handle=h;AB.name=h.name;AB.perm='granted';AB.err='';await abIdbSet(h);
    await abWrite(true);
  }catch(e){if(e&&e.name!=='AbortError')warn('No se pudo usar esa carpeta: '+(e.message||e))}
}
async function abActivate(){ /* tras reabrir el programa el navegador pide permiso de nuevo: un solo toque */
  if(!AB.handle)return abChoose();
  try{AB.perm=await AB.handle.requestPermission({mode:'readwrite'})}catch(e){AB.perm='prompt'}
  if(AB.perm==='granted')await abWrite(true);else warn('Sin permiso no puedo guardar copias en esa carpeta.');
  renderTopbar();if(active==='datos')render();
}
async function abAutoAsk(){
  if(!AB.handle||AB.perm==='granted')return;
  try{AB.perm=await AB.handle.requestPermission({mode:'readwrite'})}catch(e){AB.perm='prompt'}
  AB.asked=true;if(AB.perm==='granted')await abWrite(false);renderTopbar();if(active==='datos')render();
}
async function abStop(){AB.handle=null;AB.name='';AB.perm='none';await abIdbSet(null);notify('La copia automática quedó apagada.','info');renderTopbar();if(active==='datos')render()}
function abSchedule(){
  if(!AB.handle||AB.perm!=='granted')return;
  clearTimeout(AB.timer);AB.timer=setTimeout(()=>abWrite(false),4000);
}
async function abWrite(announce){
  if(!AB.handle||AB.perm!=='granted')return false;
  try{
    const pack=makeBackupPack(),json=JSON.stringify(pack,null,2),day=new Date().toLocaleDateString('en-CA');
    for(const name of ['MiBitacora_'+EDITION+'_auto_ultima.json','MiBitacora_'+EDITION+'_auto_'+day+'.json']){
      const fh=await AB.handle.getFileHandle(name,{create:true}),w=await fh.createWritable();await w.write(json);await w.close();
    }
    /* conserva solo las 10 copias diarias más recientes */
    /* también cuenta las copias con el nombre anterior (AulaGestion_…), ordenando por fecha */
    const dated=[],re=new RegExp('^(MiBitacora|AulaGestion)_'+EDITION+'_auto_(\\d{4}-\\d{2}-\\d{2})\\.json$');for await(const [n] of AB.handle.entries()){const m=re.exec(n);if(m)dated.push([m[2],n])}
    dated.sort((a,b)=>b[0].localeCompare(a[0])||(a[1]<b[1]?1:-1)).slice(10).forEach(([,n])=>AB.handle.removeEntry(n).catch(()=>{}));
    AB.last=pack.exportedAt;AB.err='';try{localStorage.setItem(KEY+'_ablast',AB.last)}catch(e){}
    if(announce)notify(`Copia automática lista en la carpeta «${AB.name}». Se actualiza sola cada vez que guardas.`,'success');
    renderTopbar();if(active==='datos')render();return true;
  }catch(e){
    AB.err=e.message||String(e);if(e&&(e.name==='NotAllowedError'||e.name==='SecurityError'))AB.perm='prompt';
    renderTopbar();return false;
  }
}
function lastAnyBackup(){const a=state.lastBackup?Date.parse(state.lastBackup):0,b=AB.last?Date.parse(AB.last):0;const m=Math.max(a||0,b||0);return m?new Date(m).toISOString():''}
function renderTopbar(){
  const bar=document.getElementById('topbar');if(!bar)return;
  let html='';
  if(typeof loadWarning==='string'&&loadWarning&&!AB.dismissWarn)html=`<span class="grow">⚠ ${esc(loadWarning)}</span><button class="secondary" onclick="AB.dismissWarn=true;renderTopbar()">Entendido</button>`;
  else if(AB.handle&&AB.perm!=='granted'&&AB.asked)html=`<span class="grow">🔒 Para seguir guardando tu copia automática, el navegador necesita tu permiso otra vez.</span><button class="primary" onclick="abActivate()">Permitir</button>`;
  else if(!AB.handle){
    const last=lastAnyBackup(),d=last?daysSince(last):null,hasData=countsOf(state).students>0&&state.profile.onboarded;
    if(hasData&&(d===null||d>=7))html=`<span class="grow">${ico('save')} ${d===null?'Todavía no has guardado una copia de seguridad.':'Hace '+d+' días que no guardas una copia de seguridad.'} Hazlo hoy para no perder tu trabajo.</span><button class="primary" onclick="backup()">Guardar copia ahora</button>${AB.supported?'<button class="secondary" onclick="abChoose()">Hacerlo automático</button>':''}`;
  }
  bar.innerHTML=html;bar.classList.toggle('show',!!html);
}
function abPanelHTML(){
  if(!AB.supported){
    /* v0.19: en tabletas no existe la copia a carpeta; se ofrece mandar la copia a Drive/correo con «Compartir» */
    const share=typeof webCanShareFiles==='function'&&webCanShareFiles()?`<div class="actions"><button class="primary big" onclick="backupShare()">📤 Enviar copia a Drive, correo o WhatsApp</button></div>`:'';
    if(IS_TOUCH||IS_ANDROID)return `<div class="hint"><b>Copia de seguridad en tableta:</b> aquí no se puede guardar sola en una carpeta. Una vez por semana guarda tu copia: con «Guardar copia» queda en <b>Descargas</b>${share?', o envíala a tu Google Drive o a tu correo para tenerla fuera de la tableta':''}. ${APP_NAME} te lo recordará cada 7 días.${share}</div>`;
    return `<div class="hint warn"><b>Copia automática:</b> este navegador no permite guardarla sola en una carpeta. Abre ${APP_NAME} en <b>Chrome o Edge</b> para activarla. Mientras tanto, el programa te recordará guardar tu copia a mano cada semana.</div>`;
  }
  if(AB.handle)return `<div class="hint ok-hint"><b>Copia automática ${AB.perm==='granted'?'activada':'pausada'}</b> en la carpeta «${esc(AB.name)}». ${AB.last?'Última copia: '+esc(new Date(AB.last).toLocaleString('es-MX'))+'.':''}${AB.err?'<br><span class="imp-flag">'+esc(AB.err)+'</span>':''}<div class="actions">${AB.perm==='granted'?'<button class="secondary" onclick="abWrite(true)">Guardar ahora</button>':'<button class="primary" onclick="abActivate()">Permitir</button>'}<button class="secondary" onclick="abChoose()">Cambiar carpeta</button><button class="linkbtn" onclick="abStop()">Apagar</button></div></div>`;
  return `<div class="hint"><b>Copia automática:</b> elige una carpeta (mejor una USB o una carpeta de OneDrive/Google Drive) y el programa guardará solo una copia cada vez que trabajes. Se conservan las 10 más recientes.<div class="actions"><button class="primary big" onclick="abChoose()">Elegir carpeta para la copia automática</button></div></div>`;
}
window.addEventListener('beforeunload',e=>{
  if(AB.warned||AB.handle)return;const last=lastAnyBackup(),d=last?daysSince(last):null;
  if(countsOf(state).students>0&&(d===null||d>=7)){AB.warned=true;e.preventDefault();e.returnValue=''}
});

/* ===== 66_licencia.js — v0.15: activación con clave (edición con LIC_REQUIRED) =====
   · Cada laptop/navegador tiene un «código de equipo» (8 letras y números) que se crea una sola vez.
   · El docente se lo manda a Rusho; él genera una clave firmada (ECDSA P-256) con su llave privada.
     La app solo trae la llave pública: puede comprobar claves, pero no fabricarlas.
   · Clave = 'MB1-' + base64url(JSON {v,e,c,n,t,x}) + '.' + base64url(firma). La firma cubre el texto base64url.
   · Sin clave: 15 días de prueba completos (v0.16; antes 30). Prueba o clave vencida: solo lectura (ver, exportar, respaldar);
     NUNCA se borran ni se bloquean los datos.
   · La licencia se guarda aparte de los datos (KEY+'_lic'): no viaja en los respaldos.
   · La fecha que se usa es la mayor entre hoy y la última vista (atrasar el reloj no regresa días).
   v0.20 — licencia por niveles:
   · La clave trae la lista de niveles comprados: {…, e:'<primer nivel>', l:['Primaria','Secundaria',…]}.
     Las claves viejas (solo «e») valen para ese único nivel. «e» se sigue llenando para las versiones viejas.
   · Licencia y prueba son UNA por equipo para todos los niveles (se guardan en 'mibitacora_lic').
     La primera vez se juntan las de cada edición (sin borrar las originales); la prueba cuenta desde el primer uso.
   · Se pueden tener varias claves (por ejemplo una vieja de Secundaria y otra nueva de Primaria): cuentan todas.
   · En la prueba se usan todos los niveles. Con clave, los niveles que no vienen en ella quedan en SOLO LECTURA
     (estado 'nivel'), con candado y el botón «Agregar este nivel» (WhatsApp 33 5195 0699). Nunca se borra nada. */
const LIC_TRIAL_DAYS=15;
const LIC_ALPHA='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const LIC={status:'checking',info:null,error:'',frozen:null,blockedAt:0,keys:[],levels:[],activated:false};
const LIC_LEVELS=['Primaria','Secundaria','Telesecundaria','Bachillerato'];   /* Bachillerato: reservado para cuando exista la edición */
const LIC_SHARED='mibitacora_lic';
const LIC_WA='523351950699',LIC_WA_TXT='33 5195 0699';
function licRead(k){try{const o=JSON.parse(localStorage.getItem(k)||'null');return o&&typeof o==='object'?o:null}catch(e){return null}}
function licStore(){
  const s=licRead(LIC_SHARED);
  if(s){if(!Array.isArray(s.keys))s.keys=[];return s}
  /* v0.20: primera vez con la licencia compartida: se juntan las licencias que había en cada edición (no se borran) */
  const own=licRead(KEY+'_lic')||{};
  const olds=['primaria','secundaria','telesecundaria'].map(e=>licRead('aulagestion_v09_'+e+'_lic')).filter(Boolean);
  const withKey=own.key?own:olds.find(x=>x.key);
  const o={dev:(withKey||own).dev||(olds[0]||{}).dev||'',keys:[],migrated:true};
  [own,...olds].forEach(x=>{if(x.key&&!o.keys.includes(x.key))o.keys.push(x.key)});
  const firsts=[own,...olds].map(x=>x.first).filter(d=>DATE_RE.test(d||'')).sort();
  const lasts=[own,...olds].map(x=>x.last).filter(d=>DATE_RE.test(d||'')).sort();
  if(firsts.length)o.first=firsts[0];
  if(lasts.length)o.last=lasts[lasts.length-1];
  licSave(o);return o;
}
function licSave(o){try{localStorage.setItem(LIC_SHARED,JSON.stringify(o))}catch(e){}}
function licLevelsOf(info){const l=Array.isArray(info?.l)&&info.l.length?info.l:[info?.e];return [...new Set(l.filter(x=>LIC_LEVELS.includes(x)))]}
function licJoin(a){return a.length<2?(a[0]||''):a.slice(0,-1).join(', ')+' y '+a[a.length-1]}
function licNewCode(){const r=new Uint8Array(8);crypto.getRandomValues(r);const s=[...r].map(b=>LIC_ALPHA[b%LIC_ALPHA.length]).join('');return s.slice(0,4)+'-'+s.slice(4)}
function licNormCode(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/^(.{4})(.+)$/,'$1-$2')}
/* Datos del equipo: código, primer uso y última fecha vista */
function licDevice(){
  const o=licStore();let changed=false;
  const hd=window.MB_HOST&&window.MB_HOST.device;   /* v0.17: en el instalador el código sale del equipo (no cambia al reinstalar) */
  if(hd&&o.dev!==hd){o.dev=hd;changed=true}
  if(!/^[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(o.dev||'')){o.dev=licNewCode();changed=true}
  const t=todayISO();
  if(!DATE_RE.test(o.first||'')){o.first=t;changed=true}
  if(!DATE_RE.test(o.last||'')||t>o.last){o.last=t;changed=true}
  if(changed)licSave(o);
  return o;
}
function licToday(){const o=licDevice(),t=todayISO();return t>o.last?t:o.last}
function daysBetween(a,b){return Math.round((Date.parse(b+'T12:00:00')-Date.parse(a+'T12:00:00'))/864e5)}
function licTrialLeft(){const o=licDevice();return Math.max(0,LIC_TRIAL_DAYS-daysBetween(o.first,licToday()))}
const b64uDec=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((s.length+3)%4)),c=>c.charCodeAt(0));
/* Comprueba una clave. Devuelve {ok,info,msg} */
async function licVerify(raw){
  const key=String(raw||'').replace(/\s+/g,'');
  if(window.MB_HOST)return window.MB_HOST.invoke('verify_license',{key,edition:EDITION,device:licDevice().dev}).then(r=>r.ok?{ok:true,info:r.info,key}:{ok:false,msg:r.msg}).catch(e=>({ok:false,msg:'No se pudo comprobar la clave ('+e+').'}));   /* v0.17: en el instalador la firma se comprueba en el programa (Rust) */
  const m=/^MB1-([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)$/.exec(key);
  if(!m)return {ok:false,msg:'Esa no parece una clave de Mi Bitácora. Cópiala completa, empieza con «MB1-».'};
  let info;
  try{
    const k=await crypto.subtle.importKey('jwk',LIC_PUB,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
    const good=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},k,b64uDec(m[2]),new TextEncoder().encode(m[1]));
    if(!good)return {ok:false,msg:'La clave no es válida. Revisa que la hayas copiado completa, sin cambiar ninguna letra.'};
    info=JSON.parse(new TextDecoder().decode(b64uDec(m[1])));
  }catch(e){return {ok:false,msg:'No se pudo comprobar la clave. Revisa que esté completa.'}}
  const dev=licDevice().dev;
  if(!licLevelsOf(info).length)return {ok:false,msg:'Esa clave no trae ningún nivel de Mi Bitácora.'};
  if(licNormCode(info.c)!==dev)return {ok:false,msg:`Esa clave es para otro equipo (${info.c}). El código de esta laptop es ${dev}.`};
  return {ok:true,info,key};
}
/* Estado: 'activa' | 'prueba' | 'vencida' (y 'libre' si la edición no pide clave) */
/* Estados: 'activa' | 'prueba' | 'vencida' | 'nivel' (este nivel no viene en la clave: solo lectura) */
async function licRefresh(){
  if(!LIC_REQUIRED){LIC.status='libre';return}
  const o=licDevice(),today=licToday();LIC.info=null;LIC.error='';LIC.keys=[];
  for(const k of o.keys){const r=await licVerify(k);if(r.ok)LIC.keys.push({key:k,info:r.info,levels:licLevelsOf(r.info),expired:!!(r.info.x&&today>r.info.x)});else LIC.error=r.msg}
  LIC.activated=LIC.keys.length>0;
  const live=LIC.keys.filter(k=>!k.expired),mine=LIC.keys.filter(k=>k.levels.includes(EDITION));
  LIC.levels=[...new Set(live.flatMap(k=>k.levels))];
  LIC.info=(mine.find(k=>!k.expired)||mine[0]||live[0]||LIC.keys[0]||{}).info||null;
  if(!LIC.activated)LIC.status=licTrialLeft()>0?'prueba':'vencida';
  else if(LIC.levels.includes(EDITION))LIC.status='activa';
  else LIC.status=mine.length?'vencida':'nivel';
  LIC.frozen=licReadOnly()?licSnapshot(state):null;
  /* para la pantalla de elegir edición (solo para mostrar candados; la app vuelve a comprobar todo) */
  const cache={activated:LIC.activated,levels:LIC.levels,trial:LIC.status==='prueba'};
  if(JSON.stringify(o.cache)!==JSON.stringify(cache)){o.cache=cache;licSave(o)}
}
function licReadOnly(){return LIC_REQUIRED&&(LIC.status==='vencida'||LIC.status==='nivel')}
function licWhyOff(){return LIC.status==='nivel'?`Tu licencia no incluye el nivel ${EDITION}`:LIC.info?'Tu licencia venció':'Terminó tu periodo de prueba'}

  const o=licDevice();if(!o.keys.includes(r.key))o.keys.push(r.key);o.key=r.key;licSave(o);await licRefresh();render();

  const p=state.profile,rows=[['Docente',p.teacher||'Sin configurar'],['Escuela',p.school||'Sin configurar'],['Ciclo escolar',p.cycle||'Sin configurar']];

function provNote(){return ZERO_FILL?'Promedios PROVISIONALES (escala 0 a 10). Las casillas vacías se cuentan como 0 para acercarse a la calificación real. No son calificaciones oficiales.':'Promedios PROVISIONALES (escala 0 a 10). Las actividades pendientes no cuentan como cero. No son calificaciones oficiales.'}
function noScopeSelected(){warn('Selecciona al menos '+(EDITION==='Primaria'?'un campo formativo':'una disciplina')+' para exportar.')}

/* ---------- CSV ---------- */
function notebookRows(g){
  const data=selectedScopeData(g),ros=roster(g),out=[['CUADERNO COMPLETO — '+APP_NAME+' '+EDITION],...exportMeta(g),[provNote()],[]];
  for(const b of data){
    out.push([b.scope.name.toUpperCase()]);
    out.push(['Alumno',...b.activities.map(a=>a.name+' ('+kindName(a)+', '+(modeOf(a)==='num'?'máx '+a.max:modeName(modeOf(a)))+')'),'Promedio provisional /10']);
    for(const st of ros){const v=averageInScope(g,b.scope,st,b.activities);out.push([st.name,...b.activities.map(a=>exportValue(a,st.id)??''),v===null?'':round2(v)])}
    out.push([]);
  }
  out.push(['RESUMEN GENERAL']);
  const over=EDITION==='Primaria';
  out.push(['Alumno',...data.map(b=>b.scope.name),...(over?['Promedio orientativo']:[])]);
  for(const st of ros){const avgs=data.map(b=>averageInScope(g,b.scope,st,b.activities));out.push([st.name,...avgs.map(v=>v===null?'':round2(v)),...(over?[meanOf(avgs)===null?'':round2(meanOf(avgs))]:[])])}
  return out;
}
function exportFullCSV(){
  const g=group();if(!g)return;if(!selectedScopeData(g).length)return noScopeSelected();
  csvDownload('Cuaderno_'+EDITION+'_'+safeName(g.name)+'_P'+currentPeriod+'.csv',withZeros(()=>notebookRows(g)));
}

/* Valor de una casilla para CSV/Excel: número cuando lo hay (número o rúbrica completa); texto para marcas, niveles y observaciones */
function exportValue(a,sid){
  const m=modeOf(a);
  if(ZERO_FILL&&countsInAverage(a)&&scoreOf(a,sid)===undefined)return 0;   /* v0.15.2: vacío = 0 al exportar */
  if(m==='num'){const v=state.grades[a.id+'|'+sid];return v===undefined?null:Number(v)}
  if(m==='rubric'){const v=scoreOf(a,sid);return v!==undefined?round2(v):(cellText(a,sid)||null)}
  return cellText(a,sid,true)||null;
}

/* Registro de estilos: genera styles.xml a partir de las combinaciones realmente usadas */
class StyleBook{
  constructor(){
    this.fonts=['<font><sz val="11"/><name val="Calibri"/><family val="2"/></font>'];
    this.fills=['<fill><patternFill patternType="none"/></fill>','<fill><patternFill patternType="gray125"/></fill>'];
    this.borders=['<border><left/><right/><top/><bottom/><diagonal/></border>'];
    this.xfs=['<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'];this.cache=new Map();
  }
  _idx(arr,x){let i=arr.indexOf(x);if(i<0){arr.push(x);i=arr.length-1}return i}
  xf(o){
    const key=JSON.stringify(o);if(this.cache.has(key))return this.cache.get(key);
    /* v0.26: o.font = nombre de la letra (por omisión Calibri) */
    const font=(o.b||o.i||o.sz||o.color||o.font)?`<font>${o.b?'<b/>':''}${o.i?'<i/>':''}<sz val="${o.sz||11}"/>${o.color?`<color rgb="FF${o.color}"/>`:''}<name val="${o.font||'Calibri'}"/>${o.font?'<family val="3"/>':'<family val="2"/>'}</font>`:null;
    const fontId=font?this._idx(this.fonts,font):0;
    const fillId=o.fill?this._idx(this.fills,`<fill><patternFill patternType="solid"><fgColor rgb="FF${o.fill}"/><bgColor indexed="64"/></patternFill></fill>`):0;
    const side=n=>o.border==='dark'?`<${n} style="thin"><color rgb="FF000000"/></${n}>`:`<${n} style="thin"><color rgb="FFBFC9D1"/></${n}>`;
    /* border:'bottom' = solo línea abajo (para firmar), v0.21 */
    /* v0.26: o.bd={l,r,t,b} con 'thin' | 'medium' | 'thick' | 'double' (bordes distintos por lado, en negro) */

function faDays(g,sc,from,to,onlyClass){
  /* v0.22: también los días sin clases del grupo (salen con su leyenda) */
  const ks=[...Object.keys(state.attendance),...Object.keys(state.noClass)].filter(k=>k.startsWith(g.id+'|'));
  let days=[...new Set(ks.map(k=>k.split('|')[1]))].filter(d=>(!from||d>=from)&&(!to||d<=to)).sort();
  if(onlyClass){
    const wd=new Set(state.profile.schedule.filter(x=>x.groupId===g.id&&x.scopeId===sc).map(x=>(DAYS.indexOf(x.day)+1)%7));
    if(wd.size)days=days.filter(d=>wd.has(faDow(d)));
  }
  return days;
}
/* v0.21: días de clase programados en el periodo: los días de la semana de esa disciplina en «Mi horario»
   (de lunes a viernes si no está en el horario). No conoce los días festivos: si hubo, se corrige la casilla en Excel. */
function faProgrammed(g,sc,from,to){
  if(!from||!to||to<from)return 0;
  const wd=new Set(state.profile.schedule.filter(x=>x.groupId===g.id&&x.scopeId===sc).map(x=>(DAYS.indexOf(x.day)+1)%7));
  const ok=wd.size?wd:new Set([1,2,3,4,5]);let n=0;

      {v:tJ+tI,f:`SUM(${[...jR,...iR].join(',')||'0'})`,s:st.sumV},
      {v:nS&&real?round2((tJ+tI)/(nS*real)*10000)/10000:'',f:`IF(${nS}*${cell(5)}=0,"",${cell(6)}/(${nS}*${cell(5)}))`,s:st.sumP}];
    vals.forEach((x,i)=>{area(S+2,Xs[i],S+3,Xs[i+1]-1,'',x.s);rows[S+2][Xs[i]]=x});
    area(S+1,Xs[8],S+3,Xs[9]-1,'',st.sumG);rows[S+1][Xs[8]]={v:fins.length?round2(fins.reduce((a,b)=>a+b,0)/fins.length):'',f:`IF(${cnt}=0,"",AVERAGE(${calR.join(',')||'A1'}))`,s:st.sumG};
    box(S,Xs[0],S+3,Xs[9]-1,'medium','thin');
    /* firmas y sello */
    area(S+2,at(816),S+2,at(1077)-1,'',st.sigName);box(S+2,at(816),S+2,at(1077)-1,null,null,{b:'thin'});
    area(S+3,at(790),S+3,at(1085)-1,'Nombre y Firma del Subdirector de la Escuela',st.sigLab);
    area(S+2,at(1092),S+2,at(1353)-1,up(info.teacher),st.sigName);box(S+2,at(1092),S+2,at(1353)-1,null,null,{b:'thin'});
    area(S+3,at(1092),S+3,at(1353)-1,'Firma del Profesor',st.sigLab);
    area(S,at(1383),S+1,PC,'Sello de la\nescuela',st.sello);
    box(S+2,at(1383),S+3,at(1383),null,null,{l:'thin'});box(S+3,at(1383),S+3,at(1383),null,null,{b:'thin'});
    box(S+2,PC,S+3,PC,null,null,{r:'thin'});box(S+3,PC,S+3,PC,null,null,{b:'thin'});
    if(p<pages-1)breaks.push(o+ROWS);
  }
  /* bordes a cada celda */
  const W={thin:1,medium:2,double:3,thick:3},pick=(a,b)=>!a?b:!b?a:(W[b]>W[a]?b:a);
  const bd={};const add=(r,c,side,w)=>{if(!w)return;const k=r+','+c;bd[k]=bd[k]||{};bd[k][side]=pick(bd[k][side],w)};
  boxes.forEach(b=>{for(let r=b.r1;r<=b.r2;r++)for(let c=b.c1;c<=b.c2;c++){
    if(b.only){if(b.only.b&&r===b.r2)add(r,c,'b',b.only.b);if(b.only.t&&r===b.r1)add(r,c,'t',b.only.t);if(b.only.l&&c===b.c1)add(r,c,'l',b.only.l);if(b.only.r&&c===b.c2)add(r,c,'r',b.only.r);continue}
    add(r,c,'t',r===b.r1?b.outer:b.inner);add(r,c,'b',r===b.r2?b.outer:b.inner);add(r,c,'l',c===b.c1?b.outer:b.inner);add(r,c,'r',c===b.c2?b.outer:b.inner)}});
  Object.entries(bd).forEach(([k,v])=>{const [r,c]=k.split(',').map(Number);while(rows.length<=r)rows.push([]);const cur=rows[r][c];
    if(cur&&typeof cur==='object')rows[r][c]={...cur,s:{...(cur.s||{}),bd:v}};else rows[r][c]={v:cur===undefined?'':cur,s:{bd:v}}});
  const cols=px.map(w=>Math.round(w*96/110/7*100)/100);
  return {name:'Asistencias',rows,merges,heights,cols,images,breaks,footer:'',paper:5,fitH:0,
    margins:'<pageMargins left="0.2" right="0.2" top="0.3" bottom="0.2" header="0" footer="0"/>'};
}

/* ===== 72_instalador.js — v0.17: cuando Mi Bitácora corre dentro del instalador de Windows (Tauri) =====
   En el navegador este archivo no hace nada (no existe window.__TAURI__).
   En el instalador:
   · Descargas (Excel, CSV, copias, formato oficial): ventana «Guardar como» de Windows.
   · Copia automática: se guarda sola en Documentos\Mi Bitácora <edición>\Copias automáticas (sin pedir permiso cada vez).
   · Código de equipo: lo da Windows (no cambia al reinstalar) y la clave se comprueba en el programa compilado.
   · Los datos viven en la carpeta del programa (no en Chrome/Edge): no se pierden al borrar el historial del navegador.
   · v0.18: un solo instalador con las tres ediciones. La primera vez se elige la edición; se puede cambiar en Mis datos.
     Cada edición guarda sus datos por separado (la licencia es una sola para el equipo, v0.20): cambiar de edición no borra nada. */
window.MB_HOST=(()=>{
  const T=window.__TAURI__;if(!T||!T.core||typeof T.core.invoke!=='function')return null;
  const h={invoke:T.core.invoke,device:'',folder:''};
  h.ready=Promise.all([
    T.core.invoke('device_code').then(c=>{h.device=c}).catch(()=>{}),
    T.core.invoke('backup_folder',{edition:EDITION}).then(f=>{h.folder=f}).catch(()=>{}),
    /* v0.18: el programa recuerda la edición abierta (la próxima vez abre directo aquí) y pone el título de la ventana */
    T.core.invoke('set_edition',{edition:EDITION}).catch(()=>{})]);
  try{localStorage.setItem('mb_edicion',EDITION)}catch(e){}
  return h;
})();
if(window.MB_HOST){
  document.body.classList.add('en-instalador');
  const toB64=buf=>{const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
  download=function(name,blob){
    blob.arrayBuffer().then(buf=>MB_HOST.invoke('save_file',{name,dataB64:toB64(buf)}))
      .then(p=>{if(p)notify('Guardado en '+p,'success',{ms:7000})})
      .catch(e=>warn('No se pudo guardar el archivo: '+e));
  };
  AB.supported=true;
  const abOff=()=>{try{return localStorage.getItem(KEY+'_aboff')==='1'}catch(e){return false}};
  abLoad=async function(){
    abLastRead();
    if(!abOff()&&MB_HOST.folder){AB.handle={name:MB_HOST.folder};AB.name=MB_HOST.folder;AB.perm='granted'}
    renderTopbar();if(active==='datos')render();
  };
  abWrite=async function(announce){
    if(!AB.handle)return false;
    try{
      const pack=makeBackupPack(),day=new Date().toLocaleDateString('en-CA');
      const p=await MB_HOST.invoke('backup_write',{edition:EDITION,json:JSON.stringify(pack,null,2),day});
      AB.last=pack.exportedAt;AB.err='';AB.name=p;try{localStorage.setItem(KEY+'_ablast',AB.last)}catch(e){}
      if(announce)notify(`Copia automática guardada en «${p}».`,'success');
      renderTopbar();if(active==='datos')render();return true;
    }catch(e){AB.err=String(e);renderTopbar();return false}
  };
  abChoose=async function(){
    try{const f=await MB_HOST.invoke('choose_backup_folder',{edition:EDITION});if(!f)return;MB_HOST.folder=f;
      try{localStorage.removeItem(KEY+'_aboff')}catch(e){}AB.handle={name:f};AB.name=f;AB.perm='granted';await abWrite(true)}
    catch(e){warn('No se pudo usar esa carpeta: '+e)}
  };
  abActivate=()=>abWrite(true);
  abAutoAsk=async function(){};
  abStop=async function(){try{localStorage.setItem(KEY+'_aboff','1')}catch(e){}AB.handle=null;AB.name='';AB.perm='none';notify('La copia automática quedó apagada.','info');renderTopbar();if(active==='datos')render()};
  abPanelHTML=function(){
    if(!AB.handle)return `<div class="hint"><b>Copia automática apagada.</b><div class="actions"><button class="primary big" onclick="try{localStorage.removeItem(KEY+'_aboff')}catch(e){};abLoad().then(()=>abWrite(true))">Encender la copia automática</button></div></div>`;
    return `<div class="hint ok-hint"><b>Copia automática activada</b> en la carpeta «${esc(AB.name)}». Se guarda sola cada vez que trabajas y se conservan las 10 más recientes. ${AB.last?'Última copia: '+esc(new Date(AB.last).toLocaleString('es-MX'))+'.':''}${AB.err?'<br><span class="imp-flag">'+esc(AB.err)+'</span>':''}
      <div class="actions"><button class="secondary" onclick="abWrite(true)">Guardar ahora</button><button class="secondary" onclick="abChoose()">Cambiar carpeta (por ejemplo, una USB)</button><button class="secondary" onclick="abStop()">Apagar</button></div></div>`;
  };
}

   Se publica en GitHub Pages: raíz = pantalla para elegir edición; /primaria, /secundaria, /telesecundaria = la app.

     (viven en el almacenamiento del navegador de ese equipo, con la misma clave de siempre).
   · Pide al navegador guardar los datos de forma persistente (que no los borre si falta espacio).
   · El archivo HTML que se entrega suelto (file://) y el instalador de Windows no usan nada de esto. */
const MB_WEB=!window.MB_HOST&&/^https?:$/.test(location.protocol)&&'serviceWorker' in navigator;
const WEB={reg:null,installEvt:null,updating:false};
const IS_TOUCH=matchMedia('(pointer:coarse)').matches;
const IS_ANDROID=/Android/i.test(navigator.userAgent);

  try{localStorage.setItem('mb_edicion',EDITION)}catch(e){}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  navigator.serviceWorker.register('../sw.js',{scope:'../'}).then(reg=>{
    WEB.reg=reg;
    const check=()=>{if(reg.waiting&&navigator.serviceWorker.controller)webShowUpdate()};
    check();
    reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed')check()})});
    setInterval(()=>reg.update().catch(()=>{}),60*60*1000);
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{})});
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(WEB.updating)location.reload()});
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();WEB.installEvt=e;if(active==='perfil')render()});
  window.addEventListener('appinstalled',()=>{WEB.installEvt=null;notify('Listo: Mi Bitácora quedó instalada en este equipo.','success',{ms:6000})});

}
function webApplyUpdate(){
  const w=WEB.reg&&WEB.reg.waiting;if(!w){location.reload();return}
  try{save()}catch(e){}

/* ===== v0.24 — Concentrado por trimestre / periodo =====
   Calificar › Concentrado. Un renglón por alumno; por cada campo formativo o disciplina, el promedio de cada
   rubro y el promedio del campo/disciplina. Pestañas: 1, 2, 3 y Final.
   · Primaria: además, «Promedio general» = promedio de los campos formativos (en cada trimestre y en Final).
   · Secundaria y Telesecundaria: cada disciplina se evalúa por separado; en Final, su «Promedio general»
     es el promedio de sus 3 periodos (no se promedian disciplinas entre sí).
   · Final = promedio de los trimestres que ya tienen calificación.
   · En pantalla lo pendiente no cuenta (como en el cuaderno); en el Excel, las casillas vacías cuentan como 0. */
let concTab='1',concScope='all';
const CONC_OVER=()=>EDITION==='Primaria';
function concScopes(g){const all=scopesForGroup(g);return concScope==='all'?all:all.filter(s=>s.id===concScope)}
function concPeriodData(g,per){
  return concScopes(g).map(sc=>{const acts=scopedActivities(g,sc.id,per),R=rubrosOf(g,sc.id,per);return {sc,acts,R,items:R.items}});
}
function concStudentPeriod(g,blocks,st){
  const out=blocks.map(b=>({rub:b.items.map(it=>rubroAverage(st,b.acts,it.id)),avg:averageInScope(g,b.sc,st,b.acts)}));
  return {blocks:out,general:meanOf(out.map(x=>x.avg))};
}
function concStudentFinal(g,st){
  const scs=concScopes(g),per=['1','2','3'];
  const out=scs.map(sc=>{const ps=per.map(p=>averageInScope(g,sc,st,scopedActivities(g,sc.id,p)));return {ps,fin:meanOf(ps)}});
  return {blocks:out,general:meanOf(out.map(x=>x.fin))};
}
function concCell(v,cls=''){return v===null||v===undefined?`<td class="cc-empty ${cls}">—</td>`:`<td class="${cls}"><span class="avgpill ${gradeClass(v,10)}">${numfmt(round2(v))}</span></td>`}
function concHead(sc,span){const col=scopeColor(sc.id);return `<th colspan="${span}" class="cc-scope" style="background:${col};color:${textOn(col)}">${esc(sc.name)}</th>`}

VIEWS.concentrado=function(c,g){
  const P=periodLabel(g);
  title('CALIFICACIONES','Concentrado',`Promedios por ${P.toLowerCase()}, por ${CONC_OVER()?'campo formativo':'disciplina'} y por rubro.`);
  if(!g){c.innerHTML=emptyPanel('Primero crea un grupo.');return}
  const all=scopesForGroup(g);if(concScope!=='all'&&!all.some(s=>s.id===concScope))concScope='all';
  const ros=roster(g),over=CONC_OVER(),tabs=[['1',periodName(1)],['2',periodName(2)],['3',periodName(3)],['F','Final']];
  const scSel=!over&&all.length>1?`<label class="label-inline">Disciplina <select class="field" onchange="concScope=this.value;render()"><option value="all">Todas (${all.length})</option>${all.map(s=>`<option value="${esc(s.id)}" ${s.id===concScope?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>`:'';
  let table='';
  if(!ros.length)table='<div class="empty">Este grupo todavía no tiene alumnos.</div>';
  else if(concTab==='F'){
    const scs=concScopes(g),rows=ros.map(st=>({st,r:concStudentFinal(g,st)}));
    const grpAvg=(f)=>meanOf(rows.map(f));
    table=`<table class="rows sheet conc-table"><thead><tr><th class="stickycol" rowspan="2">Alumno</th>${scs.map(sc=>concHead(sc,4)).join('')}${over?'<th rowspan="2" class="cc-gen">Promedio general</th>':''}</tr>
      <tr>${scs.map(()=>`<th>${periodName(1)}</th><th>${periodName(2)}</th><th>${periodName(3)}</th><th class="cc-fin">${over?'Promedio':'Promedio general'}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(({st,r})=>`<tr><td class="stickycol">${esc(st.name)}</td>${r.blocks.map(b=>b.ps.map(v=>concCell(v)).join('')+concCell(b.fin,'cc-fin')).join('')}${over?concCell(r.general,'cc-gen'):''}</tr>`).join('')}
      <tr class="cc-grp"><td class="stickycol"><b>Promedio del grupo</b></td>${scs.map((_,i)=>[0,1,2].map(k=>concCell(grpAvg(x=>x.r.blocks[i].ps[k]))).join('')+concCell(grpAvg(x=>x.r.blocks[i].fin),'cc-fin')).join('')}${over?concCell(grpAvg(x=>x.r.general),'cc-gen'):''}</tr></tbody></table>`;
  }else{
    const blocks=concPeriodData(g,concTab),rows=ros.map(st=>({st,r:concStudentPeriod(g,blocks,st)}));
    const grpAvg=(f)=>meanOf(rows.map(f));
    table=`<table class="rows sheet conc-table"><thead><tr><th class="stickycol" rowspan="2">Alumno</th>${blocks.map(b=>concHead(b.sc,b.items.length+1)).join('')}${over?'<th rowspan="2" class="cc-gen">Promedio general</th>':''}</tr>
      <tr>${blocks.map(b=>b.items.map(it=>`<th>${esc(it.name)}${b.R.pct?`<small>${numfmt(it.w)} %</small>`:''}</th>`).join('')+`<th class="cc-fin">Promedio</th>`).join('')}</tr></thead>
      <tbody>${rows.map(({st,r})=>`<tr><td class="stickycol">${esc(st.name)}</td>${r.blocks.map(b=>b.rub.map(v=>concCell(v)).join('')+concCell(b.avg,'cc-fin')).join('')}${over?concCell(r.general,'cc-gen'):''}</tr>`).join('')}
      <tr class="cc-grp"><td class="stickycol"><b>Promedio del grupo</b></td>${blocks.map((b,i)=>b.items.map((_,k)=>concCell(grpAvg(x=>x.r.blocks[i].rub[k]))).join('')+concCell(grpAvg(x=>x.r.blocks[i].avg),'cc-fin')).join('')}${over?concCell(grpAvg(x=>x.r.general),'cc-gen'):''}</tr></tbody></table>`;
  }
  c.innerHTML=`<section class="panel"><div class="flex">${groupSelect()}${scSel}<span class="spacer"></span><button class="secondary" onclick="exportConcentrado()">⬇ Excel del concentrado</button></div>
    <div class="flex subtabs conc-tabs" role="tablist">${tabs.map(([k,l])=>`<button class="subtab ${concTab===k?'on':''}" role="tab" aria-selected="${concTab===k}" onclick="concTab='${k}';render()">${esc(l)}</button>`).join('')}</div>
    <p class="helper">${concTab==='F'?`Final = promedio de los ${P.toLowerCase()}s que ya tienen calificación.${over?' El promedio general promedia los campos formativos.':' Cada disciplina tiene su propio promedio general (no se promedian disciplinas entre sí).'}`:`Promedio de cada rubro y del ${over?'campo formativo':'trimestre en cada disciplina'} con tus porcentajes.${over?' El promedio general promedia los campos formativos.':''}`} En pantalla las actividades sin calificar no cuentan; en el Excel cuentan como 0.</p>
    <div class="table-wrap sheet-wrap conc-wrap">${table}</div></section>`;
};
HELP.concentrado={icon:'📊',title:'Concentrado',steps:['Elige el trimestre o «Final». Cada trimestre muestra sus propios rubros.','Ves el promedio de cada rubro y de cada campo o disciplina.','«Final» promedia los tres trimestres.','Con «Excel del concentrado» descargas las cuatro pestañas (lo vacío cuenta como 0).']};

/* Excel: una hoja por trimestre/periodo y la hoja Final (con ceros) */
function buildConcentradoSheets(g){
  const P=periodLabel(g),ros=roster(g),over=CONC_OVER(),acc=EDITION_ACCENT[EDITION],DARK=acc.dark.slice(1);
  const S={title:{b:1,sz:15,color:DARK},sub:{i:1,color:'5B6B7A'},name:{b:1,border:1},head:{b:1,border:1,h:'center',wrap:1,fill:'EEF2F5'},
    v:{border:1,h:'center',num:'0.00'},fin:{b:1,border:1,h:'center',num:'0.00',fill:'F3F6F9'},gen:{b:1,border:1,h:'center',num:'0.00',fill:'FFF4D6'},blank:{border:1},grp:{b:1,i:1,border:1,h:'center',num:'0.00',fill:'EEF2F5'},grpName:{b:1,i:1,border:1,fill:'EEF2F5'}};
  const cell=(v,s)=>({v:v===null||v===undefined?null:round2(v),s:v===null||v===undefined?S.blank:s});
  const mk=(name,t)=>{const sh={name,rows:[[{v:t,s:S.title}],[{v:provNote(),s:S.sub}],[{v:`${g.name} · ${state.profile.teacher||''}`.trim(),s:S.sub}],[]],heights:{0:24},merges:[],cols:[30],freeze:null};return sh};
  const scopeHead=(sh,r,c,span,sc)=>{const col=scopeColor(sc.id);sh.rows[r]=sh.rows[r]||[];for(let k=0;k<span;k++)sh.rows[r][c+k]={v:k?'':sc.name,s:{b:1,border:1,h:'center',fill:col.slice(1),color:textOn(col).slice(1)}};if(span>1)sh.merges.push(`${colName(c)}${r+1}:${colName(c+span-1)}${r+1}`)};
  const sheets=[];
  for(const per of ['1','2','3']){
    const sh=mk(periodName(per),`Concentrado · ${periodName(per)}`),blocks=concPeriodData(g,per),r0=sh.rows.length;
    sh.rows.push([{v:'Alumno',s:S.head}]);sh.rows.push([{v:'',s:S.head}]);sh.merges.push(`A${r0+1}:A${r0+2}`);sh.heights[r0+1]=36;
    let c=1;blocks.forEach(b=>{scopeHead(sh,r0,c,b.items.length+1,b.sc);b.items.forEach((it,k)=>{sh.rows[r0+1][c+k]={v:it.name+(b.R.pct?` (${numfmt(it.w)} %)`:''),s:S.head}});sh.rows[r0+1][c+b.items.length]={v:'Promedio',s:S.head};c+=b.items.length+1});
    if(over){sh.rows[r0][c]={v:'Promedio general',s:S.head};sh.rows[r0+1][c]={v:'',s:S.head};sh.merges.push(`${colName(c)}${r0+1}:${colName(c)}${r0+2}`)}
    const all=ros.map(st=>concStudentPeriod(g,blocks,st));
    ros.forEach((st,i)=>{const r=all[i];sh.rows.push([{v:st.name,s:S.name},...r.blocks.flatMap(b=>[...b.rub.map(v=>cell(v,S.v)),cell(b.avg,S.fin)]),...(over?[cell(r.general,S.gen)]:[])])});
    const ga=f=>meanOf(all.map(f));
    sh.rows.push([{v:'Promedio del grupo',s:S.grpName},...blocks.flatMap((b,i)=>[...b.items.map((_,k)=>cell(ga(x=>x.blocks[i].rub[k]),S.grp)),cell(ga(x=>x.blocks[i].avg),S.grp)]),...(over?[cell(ga(x=>x.general),S.grp)]:[])]);
    sh.cols=[30,...Array(c-1+(over?1:0)).fill(13)];sh.freeze={x:1,y:r0+2};sheets.push(sh);
  }
  {
    const sh=mk('Final',`Concentrado · Final (promedio de los ${P.toLowerCase()}s)`),scs=concScopes(g),r0=sh.rows.length;
    sh.rows.push([{v:'Alumno',s:S.head}]);sh.rows.push([{v:'',s:S.head}]);sh.merges.push(`A${r0+1}:A${r0+2}`);sh.heights[r0+1]=30;
    let c=1;scs.forEach(sc=>{scopeHead(sh,r0,c,4,sc);[periodName(1),periodName(2),periodName(3),over?'Promedio':'Promedio general'].forEach((t,k)=>{sh.rows[r0+1][c+k]={v:t,s:S.head}});c+=4});
    if(over){sh.rows[r0][c]={v:'Promedio general',s:S.head};sh.rows[r0+1][c]={v:'',s:S.head};sh.merges.push(`${colName(c)}${r0+1}:${colName(c)}${r0+2}`)}
    const all=ros.map(st=>concStudentFinal(g,st));
    ros.forEach((st,i)=>{const r=all[i];sh.rows.push([{v:st.name,s:S.name},...r.blocks.flatMap(b=>[...b.ps.map(v=>cell(v,S.v)),cell(b.fin,over?S.fin:S.gen)]),...(over?[cell(r.general,S.gen)]:[])])});
    const ga=f=>meanOf(all.map(f));
    sh.rows.push([{v:'Promedio del grupo',s:S.grpName},...scs.flatMap((_,i)=>[0,1,2].map(k=>cell(ga(x=>x.blocks[i].ps[k]),S.grp)).concat([cell(ga(x=>x.blocks[i].fin),S.grp)])),...(over?[cell(ga(x=>x.general),S.grp)]:[])]);
    sh.cols=[30,...Array(c-1+(over?1:0)).fill(12)];sh.freeze={x:1,y:r0+2};sheets.push(sh);
  }
  const used=new Set();sheets.forEach(sh=>{sh.name=uniqueSheetName(sh.name,used)});return sheets;
}
function exportConcentrado(){
  const g=group();if(!g)return;if(!roster(g).length)return warn('Este grupo todavía no tiene alumnos.');
  const sheets=withZeros(()=>buildConcentradoSheets(g)),sb=new StyleBook();
  download('MiBitacora_'+EDITION+'_'+safeName(g.name)+'_Concentrado.xlsx',zipBlob(xlsxFiles(sheets,sb,'Concentrado '+g.name)));
  notify('Concentrado descargado (las casillas vacías cuentan como 0).','success');
}
